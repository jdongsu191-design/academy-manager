<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>BMAPS · 베티 OMR [v0.2-grade]</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif;
         background: #f1f5f9; color: #1e293b; -webkit-text-size-adjust: 100%; touch-action: manipulation; }
  button { font-family: inherit; cursor: pointer; touch-action: manipulation; }

  /* ===== 상단바 ===== */
  .bo-top { position: sticky; top: 0; z-index: 50; background: linear-gradient(135deg,#1e3a5f,#0369a1);
            color: #fff; display: flex; align-items: center; gap: 10px; padding: 12px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .bo-title { font-size: 16px; font-weight: 800; }
  .bo-ver { font-size: 10px; background: rgba(255,255,255,.2); padding: 2px 7px; border-radius: 100px; font-weight: 700; }
  .bo-who { margin-left: auto; font-size: 12px; opacity: .9; }

  .bo-wrap { max-width: 560px; margin: 0 auto; padding: 14px 14px 90px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .hint { font-size: 12.5px; color: #64748b; line-height: 1.6; }
  .empty { padding: 34px 10px; text-align: center; color: #94a3b8; font-size: 14px; }

  .btn { border: 1.5px solid #cbd5e1; background: #fff; color: #334155; border-radius: 10px;
         padding: 10px 16px; font-size: 14px; font-weight: 700; }
  .btn-primary { background: #0369a1; border-color: #0369a1; color: #fff; }
  .btn:disabled { opacity: .5; }

  /* ===== 홈: 회차 목록 ===== */
  .rd-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #fff;
             border: 1.5px solid #e2e8f0; border-radius: 14px; margin-bottom: 10px; }
  .rd-date { font-size: 15px; font-weight: 800; color: #0f172a; }
  .rd-meta { font-size: 12px; color: #64748b; margin-top: 2px; }
  .rd-act { margin-left: auto; flex-shrink: 0; }
  .rd-go { background: #0369a1; color: #fff; border: none; border-radius: 10px;
           padding: 10px 16px; font-size: 14px; font-weight: 800; }
  .rd-done { background: #f0fdf4; color: #15803d; border: 1.5px solid #86efac; border-radius: 10px;
             padding: 10px 14px; font-size: 13px; font-weight: 800; }

  /* ===== 선택과목 ===== */
  .el-btn { display: block; width: 100%; padding: 18px; margin-bottom: 10px; font-size: 17px;
            font-weight: 800; border: 2px solid #cbd5e1; border-radius: 14px; background: #fff; color: #0f172a; }
  .el-btn:active { border-color: #0369a1; background: #f0f9ff; }

  /* ===== OMR ===== */
  .omr-head { position: sticky; top: 49px; z-index: 40; background: #f1f5f9; padding: 10px 0;
              display: flex; align-items: center; gap: 10px; }
  .omr-prog { flex: 1; font-size: 13px; font-weight: 800; color: #334155; }
  .omr-bar { height: 6px; background: #e2e8f0; border-radius: 100px; overflow: hidden; margin-top: 5px; }
  .omr-bar i { display: block; height: 100%; background: #0369a1; border-radius: 100px; transition: width .2s; }

  .q-card { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 14px;
            padding: 14px 16px; margin-bottom: 10px; }
  .q-card.marked { border-color: #7dd3fc; }
  .q-card.excl { background: #f8fafc; }
  .q-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .q-no { font-size: 16px; font-weight: 800; color: #0f172a; }
  .q-pts { font-size: 12px; font-weight: 700; color: #64748b; }
  .q-tag { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 100px; }
  .tag-short { background: #ede9fe; color: #6d28d9; }
  .tag-excl { background: #e2e8f0; color: #64748b; }

  .c-row { display: flex; gap: 8px; }
  .c-btn { flex: 1; aspect-ratio: 1; max-height: 54px; font-size: 18px; font-weight: 800;
           border: 2px solid #cbd5e1; border-radius: 50%; background: #fff; color: #334155; }
  .c-btn.on { background: #0369a1; border-color: #0369a1; color: #fff; }

  .s-btn { width: 100%; padding: 13px; font-size: 20px; font-weight: 800; letter-spacing: 4px;
           border: 2px dashed #cbd5e1; border-radius: 12px; background: #f8fafc; color: #94a3b8; }
  .s-btn.on { border-style: solid; border-color: #0369a1; background: #f0f9ff; color: #0f172a; }

  /* 제출 바 */
  .submit-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
                background: #fff; border-top: 1px solid #e2e8f0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .submit-bar .inner { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .sb-info { flex: 1; font-size: 13px; font-weight: 700; color: #334155; }
  .sb-go { background: #0369a1; color: #fff; border: none; border-radius: 12px;
           padding: 14px 26px; font-size: 16px; font-weight: 800; }
  .sb-go:disabled { background: #cbd5e1; }

  /* ===== 키패드 시트 ===== */
  .kp-ov { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none;
           align-items: flex-end; justify-content: center; z-index: 9999; }
  .kp-ov.open { display: flex; }
  .kp { background: #fff; border-radius: 20px 20px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
        width: 100%; max-width: 560px; }
  .kp-head { display: flex; align-items: center; margin-bottom: 10px; }
  .kp-title { font-size: 14px; font-weight: 800; color: #334155; }
  .kp-val { margin-left: auto; font-size: 30px; font-weight: 800; color: #0f172a;
            min-width: 96px; text-align: right; letter-spacing: 4px; }
  .kp-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  .kp-grid button { padding: 15px 0; font-size: 21px; font-weight: 800; border: 1.5px solid #e2e8f0;
                    border-radius: 12px; background: #f8fafc; color: #0f172a; }
  .kp-grid button:active { background: #e0f2fe; }
  .kp-ok { grid-column: span 3; background: #0369a1 !important; color: #fff !important; border-color: #0369a1 !important; }
  .kp-hint { font-size: 11.5px; color: #94a3b8; text-align: center; margin-top: 8px; }

  /* ===== 결과 ===== */
  .res-score { text-align: center; padding: 22px 0 16px; }
  .res-num { font-size: 46px; font-weight: 800; color: #0369a1; }
  .res-num small { font-size: 20px; color: #94a3b8; font-weight: 700; }
  .res-sub { font-size: 13px; color: #64748b; margin-top: 4px; }
  .res-row { display: flex; align-items: center; gap: 10px; padding: 11px 6px;
             border-bottom: 1px solid #f1f5f9; }
  .res-row:last-child { border-bottom: none; }
  .res-qno { width: 44px; font-size: 15px; font-weight: 800; color: #334155; }
  .res-mark { width: 30px; font-size: 19px; font-weight: 800; text-align: center; }
  .ok { color: #16a34a; } .bad { color: #dc2626; }
  .res-my { flex: 1; font-size: 13px; color: #64748b; }
  .res-yt { flex-shrink: 0; background: #fee2e2; color: #dc2626; border: 1.5px solid #fca5a5;
            border-radius: 9px; padding: 8px 12px; font-size: 12.5px; font-weight: 800; text-decoration: none; }

  /* ===== 차단 ===== */
  .blocker { position: fixed; inset: 0; background: #0f172a; display: none;
             align-items: center; justify-content: center; z-index: 99999; padding: 16px; }
  .blocker.open { display: flex; }
  .bk { background: #fff; border-radius: 16px; padding: 28px 24px; max-width: 360px; text-align: center; }
  .bk h3 { font-size: 17px; margin-bottom: 10px; }
  .bk p { font-size: 13.5px; color: #475569; line-height: 1.7; margin-bottom: 16px; }
</style>
</head>
<body>

<div class="bo-top">
  <span class="bo-title">📝 베티 OMR</span>
  <span class="bo-ver">v0.2-grade</span>
  <span class="bo-who" id="bo-who"></span>
</div>

<div class="bo-wrap">

  <!-- 홈: 회차 목록 -->
  <div id="view-home">
    <div class="card">
      <div style="font-size:15px;font-weight:800;margin-bottom:4px">응시 회차</div>
      <div class="hint">응시할 회차를 선택하세요. 제출한 회차는 결과를 다시 볼 수 있습니다.</div>
    </div>
    <div id="bo-rounds"><div class="empty">불러오는 중...</div></div>
  </div>

  <!-- 시험지 선택 (레벨·선택과목이 갈릴 때) -->
  <div id="view-pick" style="display:none">
    <div class="card">
      <div style="font-size:16px;font-weight:800;margin-bottom:6px">응시한 시험을 선택하세요</div>
      <div class="hint">본인이 <b>실제로 푼 시험지 표지</b>와 같은 것을 골라주세요.<br>
      잘못 골라 제출했다면 선생님(데스크)께 초기화를 요청하면 됩니다.</div>
    </div>
    <div id="bo-pick-btns"></div>
    <button class="btn" style="width:100%" onclick="boShowHome()">← 돌아가기</button>
  </div>

  <!-- OMR -->
  <div id="view-omr" style="display:none">
    <div class="omr-head">
      <button class="btn" style="padding:8px 12px;font-size:13px" onclick="boLeaveOmr()">←</button>
      <div class="omr-prog">
        <div id="omr-title">-</div>
        <div class="omr-bar"><i id="omr-bar" style="width:0%"></i></div>
      </div>
    </div>
    <div id="bo-questions"></div>
  </div>

  <!-- 결과 -->
  <div id="view-result" style="display:none">
    <div class="card">
      <div class="res-score">
        <div id="res-title" style="font-size:14px;font-weight:800;color:#334155;margin-bottom:6px">-</div>
        <div class="res-num"><span id="res-score">0</span><small> / <span id="res-total">100</span></small></div>
        <div class="res-sub" id="res-sub"></div>
      </div>
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:800;margin-bottom:8px">문항별 결과</div>
      <div class="hint" style="margin-bottom:8px">틀린 문항은 <b>해설 영상</b>으로 확인하세요. (정답은 영상에서 공개됩니다)</div>
      <div id="res-items"></div>
    </div>
    <button class="btn" style="width:100%" onclick="boShowHome()">← 회차 목록으로</button>
  </div>
</div>

<!-- 제출 바 (OMR 화면에서만) -->
<div class="submit-bar" id="bo-submit-bar" style="display:none">
  <div class="inner">
    <div class="sb-info" id="sb-info">0 / 0 마킹</div>
    <button class="sb-go" id="sb-go" onclick="boSubmit()">제출하기</button>
  </div>
</div>

<!-- 주관식 키패드 -->
<div class="kp-ov" id="bo-kp" onclick="if(event.target===this)boKpClose()">
  <div class="kp">
    <div class="kp-head">
      <span class="kp-title" id="kp-title">문항</span>
      <span class="kp-val" id="kp-val">&nbsp;</span>
    </div>
    <div class="kp-grid">
      <button onclick="boKpPress('1')">1</button><button onclick="boKpPress('2')">2</button><button onclick="boKpPress('3')">3</button>
      <button onclick="boKpPress('4')">4</button><button onclick="boKpPress('5')">5</button><button onclick="boKpPress('6')">6</button>
      <button onclick="boKpPress('7')">7</button><button onclick="boKpPress('8')">8</button><button onclick="boKpPress('9')">9</button>
      <button onclick="boKpClear()">지움</button><button onclick="boKpPress('0')">0</button><button onclick="boKpBack()">←</button>
      <button class="kp-ok" onclick="boKpOk()">확인</button>
    </div>
    <div class="kp-hint">0~999 사이 숫자를 입력하세요</div>
  </div>
</div>

<!-- 차단 -->
<div class="blocker" id="bo-blocker">
  <div class="bk">
    <h3>📝 베티 OMR</h3>
    <p id="bo-bk-msg">접근할 수 없습니다.</p>
    <button class="btn btn-primary" onclick="location.href='index.html'">← BMAPS로 이동</button>
  </div>
</div>

<script>
/* ============================================================
   [BETY OMR — 학생 응시]
   ─ 모든 DB 접근은 RPC 경유 (정답은 절대 클라이언트로 내려오지 않음)
   ─ 인증: localStorage.savedUserId → users (role='student' + bety_yn)
   ─ 흐름: 홈(회차목록) → (고3 최초 선택과목) → OMR → 서버 채점 → 결과
============================================================ */
const SUPABASE_URL = 'https://qtpftloyumtffvgurvqv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XGP9n-2fuBQFuJlAA5MJ8w_R8JYIi9O';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

window.BETY_OMR_VERSION = 'v0.2-grade';
console.log('BETY-OMR build:', window.BETY_OMR_VERSION);

var _bo = { user:null, rounds:[], date:'', exam:null, questions:[], answers:{},
            kpQ:null, kpVal:'', submitting:false };

function boEsc(v){ return String(v==null?'':v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function boView(name){
  ['home','pick','omr','result'].forEach(function(v){
    document.getElementById('view-'+v).style.display = (v===name) ? '' : 'none';
  });
  document.getElementById('bo-submit-bar').style.display = (name==='omr') ? '' : 'none';
  window.scrollTo(0,0);
}
function boBlock(msg){
  document.getElementById('bo-bk-msg').innerHTML = msg;
  document.getElementById('bo-blocker').classList.add('open');
}

/* ── 인증 ───────────────────────────────────────────────── */
async function boBoot(){
  var savedId = null;
  try { savedId = localStorage.getItem('savedUserId'); } catch(e){}
  if(!savedId){ boBlock('로그인 정보가 없습니다.<br>BMAPS에서 <b>학생 코드로 로그인</b>한 뒤 다시 들어와주세요.'); return; }
  try {
    var r = await db.from('users').select('id,name,role,bety_yn').eq('id', savedId).maybeSingle();
    if(r.error || !r.data){ boBlock('계정을 확인할 수 없습니다.'); return; }
    if(r.data.role !== 'student'){
      boBlock('학생 전용 화면입니다.<br>관리는 <b>bety-admin.html</b>을 이용해주세요.'); return;
    }
    if(!r.data.bety_yn){
      boBlock('베티모의고사 대상 학생이 아닙니다.<br>대상인데 이 화면이 보이면 선생님께 문의해주세요.'); return;
    }
    _bo.user = r.data;
    document.getElementById('bo-who').textContent = r.data.name || '';
    await boLoadRounds();
  } catch(e){ boBlock('오류: ' + boEsc(e.message||e)); }
}

/* ── 홈: 회차 목록 (학년·학교급 기준) ───────────────────── */
// 좁히기: 조건에 맞는 게 하나도 없으면 좁히기를 취소하고 전체 유지
function boNarrow(list, pred){ var f = list.filter(pred); return f.length ? f : list; }
// 회차의 후보 시험지 결정: 제출본 > 출석부 레벨 > 저장된 선택과목 순으로 좁힘
function boCandidates(rd){
  var done = (rd.exams||[]).filter(function(e){ return e.submitted; });
  if(done.length) return { mode:'done', exam: done[0] };
  var c = (rd.exams||[]).slice();
  if(rd.known_level) c = boNarrow(c, function(e){ return e.level === rd.known_level; });
  if(_bo.elective)   c = boNarrow(c, function(e){ return !e.elective || e.elective === _bo.elective; });
  return (c.length === 1) ? { mode:'auto', exam: c[0] } : { mode:'pick', exams: c };
}
function boExamLabel(e){ return e.level + (e.elective ? (' · ' + e.elective) : ''); }

async function boLoadRounds(){
  var box = document.getElementById('bo-rounds');
  box.innerHTML = '<div class="empty">불러오는 중...</div>';
  try {
    var r = await db.rpc('bety_omr_list_for_student', { p_student_id: _bo.user.id });
    if(r.error) throw r.error;
    var d = r.data || {};
    if(!d.ok){
      box.innerHTML = '<div class="empty">' + (d.reason==='not_participant'
        ? '베티모의고사 대상 학생이 아닙니다' : '회차를 불러올 수 없습니다') + '</div>';
      return;
    }
    _bo.elective = d.elective || null;
    _bo.rounds = d.rounds || [];
    if(!_bo.rounds.length){
      box.innerHTML = '<div class="empty">아직 응시할 수 있는 회차가 없습니다.<br>시험지가 준비되면 여기에 표시됩니다.</div>';
      return;
    }
    box.innerHTML = _bo.rounds.map(function(rd, i){
      var c = boCandidates(rd), meta, act;
      if(c.mode === 'done'){
        meta = boExamLabel(c.exam) + ' · ' + c.exam.total_score + '점 만점';
        act = '<button class="rd-done" onclick="boOpenResult(\''+c.exam.id+'\',\''+rd.session_date+'\')">'
            + c.exam.score + '점 · 결과</button>';
      } else if(c.mode === 'auto'){
        meta = boExamLabel(c.exam) + ' · ' + c.exam.total_score + '점 만점';
        act = '<button class="rd-go" onclick="boOpenExam(\''+c.exam.id+'\',\''+rd.session_date+'\')">응시하기</button>';
      } else {
        meta = '시험지 ' + c.exams.length + '종 · 응시한 시험 선택';
        act = '<button class="rd-go" onclick="boShowPicker(' + i + ')">응시하기</button>';
      }
      return '<div class="rd-item"><div>'
        + '<div class="rd-date">' + boEsc(rd.session_date) + '</div>'
        + '<div class="rd-meta">' + boEsc(meta) + '</div>'
        + '</div><div class="rd-act">' + act + '</div></div>';
    }).join('');
  } catch(e){
    box.innerHTML = '<div class="empty" style="color:#dc2626">불러오기 실패: ' + boEsc(e.message||e) + '</div>';
  }
}
function boShowHome(){ boView('home'); boLoadRounds(); }

/* ── 시험지 선택 화면 ───────────────────────────────────── */
function boShowPicker(idx){
  var rd = _bo.rounds[idx]; if(!rd) return;
  var c = boCandidates(rd);
  if(c.mode === 'done'){ boOpenResult(c.exam.id, rd.session_date); return; }
  if(c.mode === 'auto'){ boOpenExam(c.exam.id, rd.session_date); return; }
  _bo.date = rd.session_date;
  document.getElementById('bo-pick-btns').innerHTML = c.exams.map(function(e){
    return '<button class="el-btn" onclick="boPickExam(\''+e.id+'\',\''+rd.session_date
         + '\',\''+boEsc(e.elective||'')+'\')">' + boEsc(boExamLabel(e)) + '</button>';
  }).join('');
  boView('pick');
}
async function boPickExam(examId, date, elective){
  // 고3: 처음 고른 선택과목을 저장해 다음부터 자동 적용
  if(elective && !_bo.elective){
    if(confirm('선택과목을 [' + elective + '](으)로 저장할까요?\n다음부터 자동으로 적용됩니다.')){
      try {
        var r = await db.rpc('bety_omr_set_elective', { p_student_id: _bo.user.id, p_elective: elective });
        if(!r.error && r.data && r.data.ok) _bo.elective = elective;
      } catch(e){ /* 저장 실패해도 응시는 진행 */ }
    }
  }
  await boOpenExam(examId, date);
}

/* ── 시험지 진입 (응시/결과 분기) ───────────────────────── */
async function boOpenExam(examId, date){
  _bo.date = date;
  try {
    var r = await db.rpc('bety_omr_get_exam', { p_student_id: _bo.user.id, p_exam_id: examId });
    if(r.error) throw r.error;
    var d = r.data || {};
    if(!d.ok){
      alert(d.reason === 'not_eligible' ? '이 시험지의 응시 대상이 아닙니다.'
          : d.reason === 'no_exam'      ? '시험지가 없거나 아직 발행되지 않았습니다.'
          : '시험지를 불러올 수 없습니다.');
      return;
    }
    if(d.submitted){ await boOpenResult(examId, date); return; }
    _bo.exam = d.exam;
    _bo.questions = d.questions || [];
    _bo.answers = {};
    boRenderOmr();
    boView('omr');
  } catch(e){ alert('오류: ' + (e.message||e)); }
}

/* ── OMR 렌더 ───────────────────────────────────────────── */
function boRenderOmr(){
  var ex = _bo.exam;
  document.getElementById('omr-title').textContent =
    ex.session_date + ' · ' + ex.level + (ex.elective ? (' · ' + ex.elective) : '');
  var box = document.getElementById('bo-questions');
  box.innerHTML = _bo.questions.map(function(q){
    if(q.is_excluded){
      return '<div class="q-card excl"><div class="q-top">'
        + '<span class="q-no">' + q.q_no + '번</span>'
        + '<span class="q-tag tag-excl">제외 문항</span>'
        + '<span class="hint" style="margin-left:auto">풀지 않는 문항입니다</span></div></div>';
    }
    var marked = _bo.answers[q.q_no] != null;
    var body;
    if(q.q_type === 'short'){
      var v = _bo.answers[q.q_no];
      body = '<button class="s-btn ' + (marked?'on':'') + '" onclick="boKpOpen(' + q.q_no + ')">'
           + (marked ? boEsc(v) : '탭해서 입력') + '</button>';
    } else {
      body = '<div class="c-row">' + [1,2,3,4,5].map(function(n){
        var on = String(_bo.answers[q.q_no]) === String(n);
        return '<button class="c-btn ' + (on?'on':'') + '" onclick="boMark(' + q.q_no + ',' + n + ')">'
             + ['①','②','③','④','⑤'][n-1] + '</button>';
      }).join('') + '</div>';
    }
    return '<div class="q-card ' + (marked?'marked':'') + '" id="qc-' + q.q_no + '"><div class="q-top">'
      + '<span class="q-no">' + q.q_no + '번</span>'
      + '<span class="q-pts">' + q.points + '점</span>'
      + (q.q_type === 'short' ? '<span class="q-tag tag-short">주관식</span>' : '')
      + '</div>' + body + '</div>';
  }).join('');
  boSyncProgress();
}
function boActiveQs(){ return _bo.questions.filter(function(q){ return !q.is_excluded; }); }
function boMarkedCount(){
  return boActiveQs().filter(function(q){ return _bo.answers[q.q_no] != null; }).length;
}
function boSyncProgress(){
  var total = boActiveQs().length, done = boMarkedCount();
  document.getElementById('sb-info').textContent = done + ' / ' + total + ' 마킹';
  document.getElementById('omr-bar').style.width = (total ? Math.round(done/total*100) : 0) + '%';
}
function boMark(qNo, n){
  _bo.answers[qNo] = String(n);
  boRedrawQ(qNo);
}
function boRedrawQ(qNo){
  // 해당 카드만 다시 그리기 (전체 리렌더 시 스크롤 튐 방지)
  var q = _bo.questions.find(function(x){ return x.q_no === qNo; }); if(!q) return;
  var old = document.getElementById('qc-' + qNo); if(!old) return;
  var tmp = document.createElement('div');
  var marked = _bo.answers[qNo] != null;
  var body;
  if(q.q_type === 'short'){
    var v = _bo.answers[qNo];
    body = '<button class="s-btn ' + (marked?'on':'') + '" onclick="boKpOpen(' + qNo + ')">'
         + (marked ? boEsc(v) : '탭해서 입력') + '</button>';
  } else {
    body = '<div class="c-row">' + [1,2,3,4,5].map(function(n){
      var on = String(_bo.answers[qNo]) === String(n);
      return '<button class="c-btn ' + (on?'on':'') + '" onclick="boMark(' + qNo + ',' + n + ')">'
           + ['①','②','③','④','⑤'][n-1] + '</button>';
    }).join('') + '</div>';
  }
  tmp.innerHTML = '<div class="q-card ' + (marked?'marked':'') + '" id="qc-' + qNo + '"><div class="q-top">'
    + '<span class="q-no">' + qNo + '번</span>'
    + '<span class="q-pts">' + q.points + '점</span>'
    + (q.q_type === 'short' ? '<span class="q-tag tag-short">주관식</span>' : '')
    + '</div>' + body + '</div>';
  old.replaceWith(tmp.firstChild);
  boSyncProgress();
}
function boLeaveOmr(){
  if(boMarkedCount() > 0 && !confirm('입력한 답이 저장되지 않았습니다.\n회차 목록으로 나갈까요?')) return;
  boShowHome();
}

/* ── 주관식 키패드 ──────────────────────────────────────── */
function boKpOpen(qNo){
  _bo.kpQ = qNo;
  _bo.kpVal = _bo.answers[qNo] != null ? String(_bo.answers[qNo]) : '';
  document.getElementById('kp-title').textContent = qNo + '번 · 주관식';
  boKpSync();
  document.getElementById('bo-kp').classList.add('open');
}
function boKpSync(){
  document.getElementById('kp-val').innerHTML = _bo.kpVal ? boEsc(_bo.kpVal) : '&nbsp;';
}
function boKpPress(d){
  if(_bo.kpVal.length >= 3) return;
  if(_bo.kpVal === '0') _bo.kpVal = '';   // 선행 0 방지 (0 자체는 허용)
  _bo.kpVal += d;
  boKpSync();
}
function boKpBack(){ _bo.kpVal = _bo.kpVal.slice(0,-1); boKpSync(); }
function boKpClear(){ _bo.kpVal = ''; boKpSync(); }
function boKpClose(){ document.getElementById('bo-kp').classList.remove('open'); _bo.kpQ = null; }
function boKpOk(){
  if(_bo.kpQ == null) return;
  if(_bo.kpVal === ''){ delete _bo.answers[_bo.kpQ]; }
  else { _bo.answers[_bo.kpQ] = String(parseInt(_bo.kpVal,10)); }
  var q = _bo.kpQ;
  boKpClose();
  boRedrawQ(q);
}

/* ── 제출 ───────────────────────────────────────────────── */
async function boSubmit(){
  if(_bo.submitting) return;
  var total = boActiveQs().length, done = boMarkedCount();
  var missing = boActiveQs().filter(function(q){ return _bo.answers[q.q_no] == null; })
                            .map(function(q){ return q.q_no; });
  var msg = (missing.length
    ? '⚠️ 아직 마킹하지 않은 문항이 ' + missing.length + '개 있습니다.\n(' + missing.join(', ') + '번)\n\n'
    : '') + '제출하면 수정할 수 없습니다.\n제출할까요?';
  if(!confirm(msg)) return;

  _bo.submitting = true;
  var btn = document.getElementById('sb-go');
  btn.disabled = true; btn.textContent = '채점 중...';
  try {
    var payload = {};
    Object.keys(_bo.answers).forEach(function(k){ payload[k] = _bo.answers[k]; });
    var r = await db.rpc('bety_omr_submit', {
      p_student_id: _bo.user.id, p_exam_id: _bo.exam.id, p_answers: payload });
    if(r.error) throw r.error;
    var d = r.data || {};
    if(!d.ok){
      if(d.reason === 'already_submitted'){ alert('이미 제출된 회차입니다. 결과를 보여드릴게요.');
        await boOpenResult(_bo.exam.id, _bo.date); return; }
      alert('제출하지 못했습니다: ' + (d.reason||'')); return;
    }
    boRenderResult(d, _bo.date);
    boView('result');
  } catch(e){ alert('제출 오류: ' + (e.message||e)); }
  finally {
    _bo.submitting = false;
    btn.disabled = false; btn.textContent = '제출하기';
  }
}

/* ── 결과 ───────────────────────────────────────────────── */
async function boOpenResult(examId, date){
  try {
    var r = await db.rpc('bety_omr_get_result', { p_student_id: _bo.user.id, p_exam_id: examId });
    if(r.error) throw r.error;
    var d = r.data || {};
    if(!d.ok){ alert('결과가 없습니다.'); return; }
    boRenderResult(d, date);
    boView('result');
  } catch(e){ alert('오류: ' + (e.message||e)); }
}
function boRenderResult(d, date){
  document.getElementById('res-title').textContent = (date||'') + ' 베티모의고사 결과';
  document.getElementById('res-score').textContent = d.score;
  document.getElementById('res-total').textContent = d.total_score;
  var wrong = (d.items||[]).filter(function(it){ return !it.is_correct; }).length;
  document.getElementById('res-sub').textContent =
    '맞은 문항 ' + d.correct_count + '개 · 틀린 문항 ' + wrong + '개'
    + (d.bonus ? ' · 기본점수 ' + d.bonus + '점 포함' : '');
  document.getElementById('res-items').innerHTML = (d.items||[]).map(function(it){
    var yt = (!it.is_correct && it.youtube_url)
      ? '<a class="res-yt" href="' + boEsc(it.youtube_url) + '" target="_blank" rel="noopener">▶ 해설 영상</a>'
      : '';
    return '<div class="res-row">'
      + '<span class="res-qno">' + it.q_no + '번</span>'
      + '<span class="res-mark ' + (it.is_correct?'ok':'bad') + '">' + (it.is_correct?'O':'X') + '</span>'
      + '<span class="res-my">내 답: ' + (it.response!=null&&it.response!=='' ? boEsc(it.response) : '미기입') + '</span>'
      + yt + '</div>';
  }).join('');
}

boBoot();
</script>
</body>
