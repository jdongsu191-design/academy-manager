<style>
  body{background:var(--bg,#f4f6f9);padding:20px;max-width:900px;margin:0 auto;}
  .nje-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:14px 18px;background:var(--navy,#1F3A51);color:#fff;border-radius:12px;}
  .nje-header h1{font-size:18px;margin:0;}
  #nje-auth-status{font-size:13px;}
  #nje-saved-info{display:none;margin-top:14px;padding:12px 16px;background:#ecfdf5;border:1px solid #86efac;border-radius:8px;color:#065f46;font-size:13px;}
  #nje-blocker{display:none;padding:40px 20px;text-align:center;color:#6b7280;}
  /* step 컨테이너가 카드로 보이게 (메인 CSS 의존 보정) */
  #admin-naje-step2, #admin-naje-step3{background:#fff;border:1px solid var(--border,#e5e7eb);border-radius:12px;padding:18px;margin-top:14px;}
  #admin-naje-problem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px;}
</style>
</head>
<body>

<div class="nje-header">
  <h1>📄 N제 PDF 등록 <span style="font-size:11px;opacity:0.6;font-weight:400">[v6-FIXED]</span></h1>
  <div id="nje-auth-status">로그인 확인 중...</div>
</div>

<div id="nje-blocker">
  <p style="font-size:15px;font-weight:600;margin-bottom:8px">관리자 로그인이 필요합니다</p>
  <p style="font-size:13px">먼저 메인 BMAPS에서 관리자 계정으로 로그인한 뒤 이 페이지를 열어주세요.</p>
</div>

<div id="nje-main" style="display:none">
<div id="admin-naje-panel-upload">

        <!-- STEP 1 -->
        <div id="admin-naje-step1" class="card">
          <div class="card-title">📄 문제 등록</div>
          <div class="alert alert-info" style="margin-bottom:12px;font-size:12px">
            💡 PDF를 업로드하면 문제 영역을 자동으로 인식하고 QR 해설 영상도 자동 연결됩니다.
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
            <div class="form-group" style="margin:0;grid-column:1/-1">
              <label>제목 *</label>
              <input id="admin-naje-title" placeholder="예: 5주차 삼각함수 HEAT 고2 본">
            </div>
            <div class="form-group" style="margin:0">
              <label>과목</label>
              <input id="admin-naje-subject" placeholder="예: 수학, 미적분">
            </div>
            <div class="form-group" style="margin:0">
              <label>대상 학년 *</label>
              <select id="admin-naje-grade"  style="width:100%;padding:9px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:#fff">
                <option value="">학년 선택</option>
                <option value="고1">고1</option>
                <option value="고2">고2</option>
                <option value="고3">고3</option>
              </select>
            </div>
            <div class="form-group" style="margin:0">
              <label>주차</label>
              <input id="admin-naje-week" type="number" placeholder="예: 5" min="1">
            </div>
            <div class="form-group" style="margin:0">
              <label>메모</label>
              <input id="admin-naje-desc" placeholder="추가 설명 (선택)">
            </div>
            <div class="form-group" style="margin:0;grid-column:1/-1">
              <label>📁 폴더 이름 <span style="color:#9ca3af;font-weight:400">(선택)</span></label>

const NJ = {

  HEADER_RATIO: 0.08,
  LEFT_COL_RATIO: 0.50,

async function startNajePdfLoad(file, mode){
  mode = mode||_najeMode||'teacher';
  _najeMode = mode;
  var p = _np(mode);

  const titleEl = document.getElementById(p+'title');
  if(titleEl && !titleEl.value.trim()){
    titleEl.value = file.name.replace(/\.pdf$/i,'').replace(/[_-]/g,' ').trim();
  }

  document.getElementById(p+'upload-area').innerHTML = `
    <div class="ua-icon">\u2705</div>
    <p><strong style="color:var(--primary)">${file.name}</strong></p>
    <p style="font-size:12px;color:#6b7280;margin-top:4px">${(file.size/1024/1024).toFixed(1)}MB \u00B7 분석 중...</p>`;

  document.getElementById(p+'step1').style.display = 'none';
  document.getElementById(p+'step2').style.display = 'block';

  const progressEl = document.getElementById(p+'progress');
  const progressBar = document.getElementById(p+'progress-bar');
  const progressText = document.getElementById(p+'progress-text');

  najeExtractedProblems = [];
  najeAnswerMap = {};
  najeQuickAnswerDataUrl = null;

  try{
    if(typeof pdfjsLib === 'undefined'){
      throw new Error('PDF.js 라이브러리가 로드되지 않았습니다. 페이지를 새로고침해주세요.');
    }

    const ab = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: ab}).promise;
    let num = 1;

    for(let p = 2; p <= pdf.numPages; p++){
      progressText.textContent = p + '/' + pdf.numPages + ' 페이지 분석 중...';
      progressBar.style.width = Math.round((p-2)/(pdf.numPages-1) * 85) + '%';

      const page = await pdf.getPage(p);
      const vp = page.getViewport({scale: NJ.PDF_SCALE});
      const cvs = document.createElement('canvas');
      cvs.width = vp.width; cvs.height = vp.height;
      await page.render({canvasContext: cvs.getContext('2d'), viewport: vp}).promise;

      const textContent = await page.getTextContent();
      const pageText = textContent.items.map(function(i){return i.str;}).join('');

      const isQuickAnswerPage = (/빠른정답/.test(pageText) && /[0-9]+[\uFF5C|]/.test(pageText))
        || (/정답\s*및\s*해설/.test(pageText) && /빠른정답/.test(pageText));

      const isCommentaryPage = !isQuickAnswerPage && (
        /정답\s*및\s*해설/.test(pageText) ||
        (/풀이/.test(pageText) && /[0-9]+[\uFF5C|]/.test(pageText) && !/빠른정답/.test(pageText)) ||
        (/해설/.test(pageText) && !/빠른정답/.test(pageText) && pageText.length > 500 && !/[0-9]+[\uFF5C|]/.test(pageText))
      );

      if(isCommentaryPage){
        continue; // 해설 페이지는 문제 이미지도, 정답도 처리 안 함
      }

      if(isQuickAnswerPage){
        if(!najeQuickAnswerDataUrl){
          var qaCanvas = document.createElement('canvas');
          var qaTargetW = 800;
          var qaTargetH = Math.floor(cvs.height * qaTargetW / cvs.width);
          qaCanvas.width = qaTargetW;
          qaCanvas.height = qaTargetH;
          qaCanvas.getContext('2d').drawImage(cvs, 0, 0, qaTargetW, qaTargetH);
          najeQuickAnswerDataUrl = qaCanvas.toDataURL('image/jpeg', 0.85);
          try { sessionStorage.setItem('najeQuickAnswerDataUrl', najeQuickAnswerDataUrl); } catch(e) {}
        }
        var ansItems = textContent.items.slice().sort(function(a, b) {
          var dy = b.transform[5] - a.transform[5];
          if(Math.abs(dy) > 3) return dy;
          return a.transform[4] - b.transform[4];
        });

        var i = 0;
        while(i < ansItems.length){
          var str = ansItems[i].str.trim();

          var inlineMatch = str.match(/^(\d+)[\uFF5C|]\s+(.+)$/);
          if(inlineMatch){
            var pNum = parseInt(inlineMatch[1]);
            var ans = inlineMatch[2].replace(/[\uE000-\uF8FF]/g,'').trim();
            ans = ans.replace(/\s*\d+[\uFF5C|].*$/, '').trim();
            if(ans && !najeAnswerMap[pNum]) najeAnswerMap[pNum] = ans;
            i++; continue;
          }

          var numMatch = str.match(/^(\d+)[\uFF5C|]$/);
          if(numMatch){
            var pNum = parseInt(numMatch[1]);
            var j = i + 1;
            while(j < ansItems.length && j < i + 8){
              var next = ansItems[j].str.trim();
              if(!next || next === '정답'){ j++; continue; }
              if(/^\d+[\uFF5C|]$/.test(next)) break;
              if(/빠른정답|내신|모고|킬러|베티/.test(next)) break;
              var mixedMatch = next.match(/^(.+?)\s+\d+[\uFF5C|].*$/);
              if(mixedMatch){
                var cleanAns = mixedMatch[1].replace(/[\uE000-\uF8FF]/g,'').trim();
                if(cleanAns && !najeAnswerMap[pNum]) najeAnswerMap[pNum] = cleanAns;
                break;
              }
              var cleaned = next.replace(/[\uE000-\uF8FF]/g,'').trim();
              if(cleaned && !najeAnswerMap[pNum]) najeAnswerMap[pNum] = cleaned;
              break;
            }
          }
          i++;
        }
        console.log('정답 파싱 완료:', Object.keys(najeAnswerMap).length, '개');
        continue; // 문제 이미지 처리 스킵
      }

      const W = cvs.width, H = cvs.height;
      const midX = Math.floor(W * NJ.LEFT_COL_RATIO);

      function scanQR(imgData, w, h){
        // \uD83C\uDFAF 개선: QR 위치를 예측할 수 없으므로 여러 영역을 순차적으로 시도
        // 순서: 하단 50% \u2192 중앙 50% (25~75%) \u2192 상단 50% \u2192 전체
        //       원본 해상도 \u2192 1/2 축소본

        const tryScan = function(data, width, height, yOffset){
          var qr = jsQR(data, width, height, {inversionAttempts:'dontInvert'});
          if(qr){
            if(yOffset) qr.location.topLeftCorner.y += yOffset;
            return qr;
          }
          qr = jsQR(data, width, height, {inversionAttempts:'attemptBoth'});
          if(qr){
            if(yOffset) qr.location.topLeftCorner.y += yOffset;
            return qr;
          }
          return null;
        };

        const extractRegion = function(imgD, W, H, startY, endY){
          const ch = endY - startY;
          const buf = new Uint8ClampedArray(ch * W * 4);
          for(let r = 0; r < ch; r++) buf.set(imgD.data.slice((startY+r)*W*4, (startY+r+1)*W*4), r*W*4);
          return buf;
        };

        // \u2460 하단 50% (가장 흔한 위치)
        let startY = Math.floor(h * 0.5);
        let region = extractRegion(imgData, w, h, startY, h);
        let qr = tryScan(region, w, h - startY, startY);
        if(qr) return qr;

        // \u2461 중앙 50% (25%~75%) \u2014 36번처럼 중간에 있는 QR 대응
        startY = Math.floor(h * 0.25);
        let endY = Math.floor(h * 0.75);
        region = extractRegion(imgData, w, h, startY, endY);
        qr = tryScan(region, w, endY - startY, startY);
        if(qr) return qr;

        // \u2462 상단 50% (드물지만 가능)
        startY = 0;
        endY = Math.floor(h * 0.5);
        region = extractRegion(imgData, w, h, startY, endY);
        qr = tryScan(region, w, endY, 0);
        if(qr) return qr;

        // \u2463 전체 스캔 (fallback)
        qr = tryScan(imgData.data, w, h, 0);
        if(qr) return qr;

        // \u2464 1/2 축소 후 전체 스캔 (고해상도 이미지에서 jsQR이 놓치는 경우 대응)
        try {
          const halfW = Math.floor(w / 2), halfH = Math.floor(h / 2);
          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = w; tempCanvas.height = h;
          const tempCtx = tempCanvas.getContext('2d');
          const tempImg = tempCtx.createImageData(w, h);
          tempImg.data.set(imgData.data);
          tempCtx.putImageData(tempImg, 0, 0);

          const scaledCanvas = document.createElement('canvas');
          scaledCanvas.width = halfW; scaledCanvas.height = halfH;
          scaledCanvas.getContext('2d').drawImage(tempCanvas, 0, 0, halfW, halfH);
          const scaledData = scaledCanvas.getContext('2d').getImageData(0, 0, halfW, halfH);
          const scaledQR = tryScan(scaledData.data, halfW, halfH, 0);
          if(scaledQR){
            // 좌표를 원본 기준으로 복구
            scaledQR.location.topLeftCorner.y *= 2;
            scaledQR.location.topLeftCorner.x *= 2;
            return scaledQR;
          }
        } catch(e) { /* 메모리 부족 등 무시 */ }

        return null;
      }

      

      const leftCvs = document.createElement('canvas');
      leftCvs.width = midX; leftCvs.height = H;
      leftCvs.getContext('2d').drawImage(cvs, 0, 0, midX, H, 0, 0, midX, H);
      const leftData = leftCvs.getContext('2d').getImageData(0, 0, midX, H);
      const leftQR = scanQR(leftData, midX, H);
      console.log('[N제] p'+p+' 좌 QR:', leftQR ? '\u2713 @y='+Math.round(leftQR.location.topLeftCorner.y) : '\u2717 없음');

      if(leftQR || colHasProblemContent(leftData, midX, H)){
        // \uD83C\uDFAF QR 못 찾았을 때도 줄칸 시작점에서 자르기 (fallback)
        let leftCutY;
        if(leftQR){
          leftCutY = Math.max(30, Math.round(leftQR.location.topLeftCorner.y) - 15);
        } else {
          // 줄칸 시작점 찾기 (본문 끝 지점). 못 찾으면 전체 사용.
          const lineY = njFindLineStart(leftData, midX, 0, midX, 0, H);
          leftCutY = (lineY > 0 && lineY < H) ? Math.max(30, lineY - 10) : H;
          console.log('[N제] p'+p+' 좌 QR없음\u2192줄칸자르기 lineY='+lineY+' cutY='+leftCutY);
        }
        const leftFinal = njCrop(cvs, 0, midX, 0, leftCutY);
        najeExtractedProblems.push({
          number: num++, canvas: leftFinal, qrUrl: leftQR ? leftQR.data : null,
          dataUrl: leftFinal.toDataURL('image/jpeg', 0.92),
          pageNum: p, side: 'left', ...getLevelInfo(num-1)
        });
      } else {
        console.log('[N제] 좌열 스킵 - 문제 콘텐츠 없음 (p'+p+')');
      }

      const rightCvs = document.createElement('canvas');
      rightCvs.width = W-midX; rightCvs.height = H;
      rightCvs.getContext('2d').drawImage(cvs, midX, 0, W-midX, H, 0, 0, W-midX, H);
      const rightData = rightCvs.getContext('2d').getImageData(0, 0, W-midX, H);
      const rightQR = scanQR(rightData, W-midX, H);
      console.log('[N제] p'+p+' 우 QR:', rightQR ? '\u2713 @y='+Math.round(rightQR.location.topLeftCorner.y) : '\u2717 없음');

      if(rightQR || colHasProblemContent(rightData, W-midX, H)){
        // \uD83C\uDFAF QR 못 찾았을 때도 줄칸 시작점에서 자르기 (fallback)
        let rightCutY;
        if(rightQR){
          rightCutY = Math.max(30, Math.round(rightQR.location.topLeftCorner.y) - 15);
        } else {
          const lineY = njFindLineStart(rightData, W-midX, 0, W-midX, 0, H);
          rightCutY = (lineY > 0 && lineY < H) ? Math.max(30, lineY - 10) : H;
          console.log('[N제] p'+p+' 우 QR없음\u2192줄칸자르기 lineY='+lineY+' cutY='+rightCutY);
        }
        const rightFinal = njCrop(cvs, midX, W, 0, rightCutY);
        najeExtractedProblems.push({
          number: num++, canvas: rightFinal, qrUrl: rightQR ? rightQR.data : null,
          dataUrl: rightFinal.toDataURL('image/jpeg', 0.92),
          pageNum: p, side: 'right', ...getLevelInfo(num-1)
        });
      } else {
        console.log('[N제] 우열 스킵 - 문제 콘텐츠 없음 (p'+p+')');
      }
    }

    progressBar.style.width = '95%';
    progressText.textContent = '미리보기 생성 중...';

    setTimeout(()=>{
      document.getElementById(_np(_najeMode)+'step2').style.display = 'none';
      document.getElementById(_np(_najeMode)+'step3').style.display = 'block';
      showNajePreview(najeExtractedProblems, 0);
    }, 500);

  }catch(err){
    alert('PDF 처리 오류: ' + err.message);
    console.error(err);
    resetNajeUpload();
  }
}

}

      '\u2461 객관식 동그라미 숫자(\u2460\u2461\u2462\u2463\u2464)는 반드시 원본 기호 그대로 유지하세요. 절대 1,2,3,4,5로 바꾸지 마세요.',
      '\u2462 분수는 "분자/분모" 형식으로 표기하세요. 예: 16/3, -5/2',

      '\u2466 영문자/미지수는 그대로. 예: a+b, 2x+1',

      '\u2468 여러 열(단)로 나뉘어 있으면 왼쪽 위 \u2192 오른쪽 아래 순서로 모두 읽으세요.',
      '',
      '\u3010반환 형식\u3011',
      '반드시 아래처럼 순수 JSON만 반환하세요. 설명, 주석, 마크다운 코드 블록 절대 금지.',
      '{"answers":{"1":"\u2462","2":"\u2463","3":"16/3","4":"(2,3)","5":"a+b"},"total_count":5,"last_number":5}',
      '',
      '\u3010검증\u3011',
      '- answers 의 키 개수 = total_count',
      '- 가장 큰 번호 = last_number',
      '- 번호가 연속되지 않으면 건너뛴 번호까지 포함해서 보고',
    ].join('\n');

    const MAX_RETRY = 3;
    let response, data, parsed = null;

    for(let attempt = 1; attempt <= MAX_RETRY; attempt++){
      if(attempt > 1){
        const waitSec = attempt * 3;
        console.log(`[Gemini 정답 인식] 재시도 ${attempt}/${MAX_RETRY} (${waitSec}초 대기)`);
        await new Promise(r => setTimeout(r, waitSec * 1000));
      }

      try {
        response = await fetch('/api/gemini-proxy', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            model: 'gemini-2.5-pro',
            contents: [{
              parts: [
                { inlineData: { mimeType: mediaType, data: base64 } },
                { text: prompt }
              ]
            }],
            generationConfig: {
              temperature: 0,
              maxOutputTokens: 8192,
              responseMimeType: 'application/json'
            }
          })
        });
        data = await response.json();
      } catch(fetchErr){
        console.warn('[Gemini 정답 인식] fetch 오류:', fetchErr.message);
        if(attempt === MAX_RETRY) return {};
        continue;
      }

      if(data.error){
        console.warn('[Gemini 정답 인식] API 오류:', data.error.message || data.error);
        if(attempt === MAX_RETRY) return {};
        continue;
      }

      let text = '';
      if(data.candidates && data.candidates[0]){
        const parts = data.candidates[0].content && data.candidates[0].content.parts;
        text = (parts && parts[0] && parts[0].text) || '';
      }
      if(!text){
        console.warn('[Gemini 정답 인식] 빈 응답');
        if(attempt === MAX_RETRY) return {};
        continue;
      }

      // JSON 파싱
      const clean = text.replace(/```json|```/g, '').trim();
      const jsonMatch = clean.match(/\{[\s\S]*\}/);
      if(!jsonMatch){
        console.warn('[Gemini 정답 인식] JSON 없음:', clean.slice(0, 200));
        if(attempt === MAX_RETRY) return {};
        continue;
      }

      try {
        parsed = JSON.parse(jsonMatch[0]);
      } catch(parseErr){
        console.warn('[Gemini 정답 인식] JSON 파싱 실패:', parseErr.message);
        if(attempt === MAX_RETRY) return {};
        continue;
      }

      // answers 객체 추출 (새 포맷 또는 레거시 포맷 둘 다 지원)
      const answersObj = parsed.answers || parsed;
      if(!answersObj || typeof answersObj !== 'object' || Array.isArray(answersObj)){
        console.warn('[Gemini 정답 인식] answers 객체 없음');
        if(attempt === MAX_RETRY) return {};
        continue;
      }

      const keys = Object.keys(answersObj);
      if(keys.length === 0){
        console.warn('[Gemini 정답 인식] 빈 결과');
        if(attempt === MAX_RETRY) return {};
        continue;
      }

      // \uD83D\uDD0D 자가 검증: 번호 연속성 체크
      const numKeys = keys.map(k => parseInt(k)).filter(n => !isNaN(n)).sort((a,b) => a-b);
      const maxN = numKeys[numKeys.length - 1];
      const expected = parsed.last_number || maxN;
      const missing = [];
      for(let i = 1; i <= Math.max(maxN, expected); i++){
        if(!(i in answersObj) && !(String(i) in answersObj)) missing.push(i);
      }

      // 누락이 20% 이상이면 재시도 (단, 마지막 시도면 그냥 반환)
      const missingRatio = missing.length / Math.max(1, expected || maxN);
      if(missingRatio > 0.2 && attempt < MAX_RETRY){
        console.log(`[Gemini 정답 인식] 누락 ${missing.length}개 감지 (${(missingRatio*100).toFixed(0)}%), 재시도`);
        continue;
      }

      if(missing.length > 0){
        console.log(`[Gemini 정답 인식] 누락 번호 (관리자 검토 필요):`, missing);
      }

      // 결과 반환
      const result = {};
      keys.forEach(k => {
        const n = parseInt(k);
        if(!isNaN(n) && answersObj[k] != null){
          result[n] = String(answersObj[k]).trim();
        }
      });
      console.log(`[Gemini 정답 인식] 완료: ${Object.keys(result).length}개 추출`);
      return result;
    }

    return {};
  } catch(e){
    console.error('Gemini 정답 파싱 오류:', e);
    return {};
  }
}

function colHasProblemContent(imgData, w, h){
        const data = imgData.data;
        let darkPixels = 0;
        const total = w * h;
        const sampleStep = 2; // 2픽셀마다 샘플링 (속도)
        let sampledTotal = 0;

        for(let y = 0; y < h; y += sampleStep){
          for(let x = Math.floor(w*0.05); x < Math.floor(w*0.95); x += sampleStep){
            const i = (y * w + x) * 4;
            const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
            if(brightness < 180) darkPixels++; // 어두운 픽셀 (텍스트/선)
            sampledTotal++;
          }
        }
        const darkRatio = darkPixels / sampledTotal;

        // \uD83C\uDFAF darkRatio 임계값 0.03 \u2192 0.008 로 낮춤
        // 이유: 짧은 수식 문제(36번 등)도 실제 darkRatio가 0.011~0.028 수준
        //       과도하게 높으면 정상 문제도 "빈 컬럼"으로 오판됨
        if(darkRatio < 0.008){
          // \uD83C\uDFAF 핵심 버그 수정: lineStartY=0 은 "줄칸 시작을 못 찾음"이 아니라
          //    "이미지 상단부터 하얀 여백이 있음"일 수 있음.
          //    페이지 상단엔 항상 여백이 있으므로 0을 "줄칸"으로 간주하면 안 됨.
          //    \u2192 lineStartY가 상단 20% 이후부터 시작할 때만 "줄칸 영역"으로 인정
          const lineStartY = njFindLineStart(imgData, w, 0, w, 0, h);
          const topMarginPx = Math.floor(h * 0.20);
          if(lineStartY > topMarginPx && lineStartY < h * 0.30){
            console.log('[N제] 줄칸만 있는 컬럼 감지 - 스킵 (darkRatio:', darkRatio.toFixed(3), 'lineStartY:', lineStartY, '/', h, ')');
            return false;
          }
        }
        return true;
      }

async function prepAnswerImageForOCR(dataUrl){
  return new Promise(function(resolve){
    var img = new Image();
    img.onload = function(){
      var W = img.naturalWidth, H = img.naturalHeight;
      // 목표: 너비 1400~2200px
      var targetW = W;
      if(W < 1400) targetW = Math.min(1800, W * 2);      // 작으면 2배 업스케일
      else if(W > 2400) targetW = 2200;                   // 너무 크면 축소
      if(targetW === W){ resolve(dataUrl); return; }
      var scale = targetW / W;
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(W * scale);
      canvas.height = Math.round(H * scale);
      var ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.92));
    };
    img.onerror = function(){ resolve(dataUrl); };
    img.src = dataUrl;
  });
}

function najeGroupByStep(problems){
  const stepMap = {};
  problems.forEach(p => {
    const num = p.number !== undefined ? p.number : p.problem_number;
    const info = getLevelInfoByNum(num);
    const s = info.step || 0;
    if(!stepMap[s]) stepMap[s] = {step:s, name:info.name, type:info.type, problems:[]};
    stepMap[s].problems.push(p);
  });
  return Object.keys(stepMap).map(Number).sort((a,b)=>a-b).map(s => stepMap[s]);
}

function njCrop(src, x1, x2, y1, y2){

}

function njFindLineStart(imgData, W, x1, x2, startY, endY){
  const {data} = imgData;
  const margin = 20;
  const scanLeft = x1 + margin;
  const scanRight = x2 - margin;
  const colW = scanRight - scanLeft;
  if(colW <= 0) return endY;

  let consecutiveBright = 0;
  let firstBrightRow = -1;
  const BRIGHT_THRESH = 240;  // 거의 흰색
  const BRIGHT_RATIO = 0.97;  // 97% 이상이 흰색이면 줄칸 행
  const MIN_CONSEC = 8;       // 8행 연속이면 줄칸 확정

  for(let y = startY; y < endY; y++){
    let brightCnt = 0;
    for(let x = scanLeft; x < scanRight; x++){
      const i = (y * W + x) * 4;
      const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
      if(brightness >= BRIGHT_THRESH) brightCnt++;
    }
    const ratio = brightCnt / colW;

    if(ratio >= BRIGHT_RATIO){
      if(consecutiveBright === 0) firstBrightRow = y;
      consecutiveBright++;
      if(consecutiveBright >= MIN_CONSEC){
        return Math.max(startY, firstBrightRow - 5);
      }
    } else {
      consecutiveBright = 0;
      firstBrightRow = -1;
    }
  }

  return endY; // 줄칸 없으면 전체 사용
}

function _np(mode){ return mode==='admin' ? 'admin-naje-' : 'naje-'; }

async function saveNajeSet(mode){
  mode = mode||_najeMode||'teacher';
  var p = _np(mode);
  const title = document.getElementById(p+'title').value.trim();
  if(!title){ alert('제목을 입력하세요'); return; }
  if(!najeExtractedProblems.length){ alert('이미지를 먼저 업로드하세요'); return; }

  const btn = document.getElementById(p+'save-btn');
  btn.textContent = '저장 중...'; btn.disabled = true;

  const progressEl = document.getElementById(p+'save-progress');
  const progressBar = document.getElementById(p+'save-progress-bar');
  const progressText = document.getElementById(p+'save-progress-text');
  progressEl.style.display = 'block';

  try{
    var teacherId = currentUser.id;
    // 폴더명: 드롭다운 값 or "__new__" 선택 시 직접 입력값 사용
    var folderSelect = document.getElementById(p+'folder-select');
    var folderNew    = document.getElementById(p+'folder-new');
    var folderName = null;
    if(folderSelect){
      var sel = folderSelect.value || '';
      if(sel === '__new__'){
        folderName = (folderNew && folderNew.value.trim()) || null;
      } else if(sel){
        folderName = sel;
      }
    }
    const setData = {
      teacher_id: teacherId,
      title,
      subject: document.getElementById(p+'subject').value.trim() || null,
      target_grade: document.getElementById(p+'grade').value.trim() || null,
      week_number: parseInt(document.getElementById(p+'week').value) || null,
      description: document.getElementById(p+'desc').value.trim() || null,
      folder_name: folderName,
      total_problems: najeExtractedProblems.length
    };

    if(najeQuickAnswerDataUrl){
      const qaRes = await fetch(najeQuickAnswerDataUrl);
      const qaBlob = await qaRes.blob();
      const qaFname = `naje/quick_answer_${Date.now()}.jpg`;
      const{error:qaErr} = await db.storage.from('homework-photos').upload(qaFname, qaBlob, {contentType:'image/jpeg', upsert:true});
      if(!qaErr){
        const{data:qaUrl} = db.storage.from('homework-photos').getPublicUrl(qaFname);
        setData.quick_answer_image_url = qaUrl.publicUrl;
      }
    }

    const{data:setRow, error:setErr} = await db.from('naje_sets').insert(setData).select().single();
    if(setErr) throw setErr;
    const setId = setRow.id;

    const problemInserts = [];
    for(let i=0; i<najeExtractedProblems.length; i++){
      const p = najeExtractedProblems[i];
      progressText.textContent = `문제 ${i+1}/${najeExtractedProblems.length} 저장 중...`;
      progressBar.style.width = ((i+1)/najeExtractedProblems.length*100)+'%';

      const res = await fetch(p.dataUrl);
      const blob = await res.blob();
      const fname = `naje/${setId}/${p.number}.jpg`;

      const{error:upErr} = await db.storage.from('homework-photos').upload(fname, blob, {contentType:'image/jpeg', upsert:true});
      if(upErr) throw upErr;

      const{data:urlData} = db.storage.from('homework-photos').getPublicUrl(fname);
      problemInserts.push({
        set_id: setId,
        problem_number: p.number,
        level_name: p.level_name || null,
        level_type: p.level_type || null,
        image_url: urlData.publicUrl,
        page_number: p.pageNum,
        qr_url: p.qrUrl || null,
        correct_answer: najeAnswerMap[p.number] || null
      });
    }

    const{error:probErr} = await db.from('naje_problems').insert(problemInserts);
    if(probErr) throw probErr;

    progressEl.style.display = 'none';
    alert(`\u2705 "${title}" 저장 완료! (${najeExtractedProblems.length}문제)`);

    progressEl.style.display = 'none';
    resetNajeUpload(mode);
    [p+'title',p+'subject',p+'grade',p+'week',p+'desc'].forEach(function(id){
      const el = document.getElementById(id);
      if(el) el.value='';
    });
    // 별도 페이지: 폼 초기화하고 목록 영역으로
    resetNajeUpload(mode);
    document.getElementById('nje-saved-info').textContent = '✅ "' + title + '" 등록 완료 (' + najeExtractedProblems.length + '문제). 메인 BMAPS N제 관리에서 확인하세요.';
    document.getElementById('nje-saved-info').style.display = 'block';

  }catch(err){
    progressEl.style.display = 'none';
    alert('저장 오류: ' + err.message);
  }
  btn.textContent = '\uD83D\uDCBE 저장'; btn.disabled = false;
}

async function openAssignAnswerModal(mode){

  if(!najeQuickAnswerDataUrl){
    try { najeQuickAnswerDataUrl = sessionStorage.getItem('najeQuickAnswerDataUrl'); } catch(e) {}
  }
  if(!najeQuickAnswerDataUrl){
    alert('빠른정답 이미지가 없습니다. 정답 페이지가 포함된 PDF인지 확인해주세요.');
    return;
  }

  const existing = document.getElementById('modal-assign-answer');
  if(existing) existing.remove();

  const modal = document.createElement('div');
  modal.id = 'modal-assign-answer';
  modal.className = 'modal-backdrop open';
  modal.innerHTML = '<div class="modal" style="max-width:920px;width:96vw;max-height:92vh;display:flex;flex-direction:column">'
    + '<div class="modal-handle"></div>'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-shrink:0">'
    + '<h3 style="margin:0">\uD83D\uDCCB 문항별 정답 부여</h3>'
    + '<button onclick="document.getElementById(&quot;modal-assign-answer&quot;).remove()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#6b7280">\u2715</button>'
    + '</div>'
    + '<div id="assign-answer-body" style="overflow-y:auto;flex:1;min-height:0">'
    + '<div style="text-align:center;padding:40px;color:#6b7280">'
    + '<div style="font-size:32px;margin-bottom:12px">\uD83E\uDD16</div>'
    + '<div>BMAPS 정답 인식 프로그램 작동 중...</div>'
    + '</div>'
    + '</div>'
    + '<div id="assign-answer-footer" style="margin-top:14px;display:flex;gap:8px;display:none;flex-shrink:0">'
    + '<button onclick="document.getElementById(&quot;modal-assign-answer&quot;).remove()" class="btn" style="flex:1">취소</button>'
    + '<button onclick="applyAnswerMap()" class="btn btn-primary" style="flex:1">\u2705 정답 부여</button>'
    + '</div>'
    + '</div>';
  document.body.appendChild(modal);

  const claudeAnswers = await parseAnswersWithClaude(najeQuickAnswerDataUrl);
  const body = document.getElementById('assign-answer-body');
  const footer = document.getElementById('assign-answer-footer');

  if(!claudeAnswers || Object.keys(claudeAnswers).length === 0){
    body.innerHTML = '<div style="text-align:center;padding:30px;color:#dc2626">\u274C 정답 인식 실패. 빠른정답 이미지를 확인해주세요.</div>';
    return;
  }

  window._pendingAnswerMap = claudeAnswers;
  renderAssignAnswerSections(claudeAnswers);
  footer.style.display = 'flex';
}

function openImgViewer(src, caption){
  document.getElementById('viewerImg').src=src;
  document.getElementById('imgViewer').classList.add('open');
  var cap = document.getElementById('viewerCaption');
  if(cap) cap.textContent = caption||'';
  if(cap) cap.style.display = caption ? 'block' : 'none';
}

function closeModal(id){
  var el = document.getElementById('modal-'+id);
  if(el) el.classList.remove('open');
  // 관리자가 다른 선생님 진도계획서 조회 후 닫을 때 전역 변수 복원
  if(id === 't-syllabusPreview' && typeof window._sylViewRestoreFn === 'function'){
    window._sylViewRestoreFn();
  }
}

function renderAssignAnswerSections(answersMap){
  const body = document.getElementById('assign-answer-body');
  if(!body) return;

  const nums = Object.keys(answersMap).map(Number).sort(function(a,b){return a-b;});
  const total = najeExtractedProblems.length;
  const matched = nums.filter(function(n){ return n >= 1 && n <= total; }).length;

  // \uD83D\uDCE6 섹션 그룹핑: 현재 문제의 단계(level_name) 정보 활용
  // najeExtractedProblems[i].level_name 이 있으면 그룹핑, 없으면 10문항 단위로 자동 그룹핑
  const sections = buildAnswerSections(nums, answersMap);

  // 섹션별 색상 (이미지의 청록 계열 참고)
  const sectionColors = [
    { bg:'#e6f4f1', accent:'#14b8a6', icon:'#0d9488' },  // 청록
    { bg:'#e0f2fe', accent:'#0284c7', icon:'#0369a1' },  // 하늘
    { bg:'#fef3c7', accent:'#d97706', icon:'#b45309' },  // 호박
    { bg:'#fce7f3', accent:'#db2777', icon:'#be185d' },  // 핑크
    { bg:'#ede9fe', accent:'#7c3aed', icon:'#6d28d9' },  // 보라
    { bg:'#dcfce7', accent:'#16a34a', icon:'#15803d' },  // 초록
    { bg:'#fee2e2', accent:'#dc2626', icon:'#b91c1c' },  // 빨강
    { bg:'#f1f5f9', accent:'#64748b', icon:'#475569' },  // 회색
  ];

  let html = ''
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:10px 14px;background:#f8fafc;border-radius:10px;flex-wrap:wrap;gap:8px">'
    + '<div style="font-size:13px;color:#475569">'
    +   '총 <strong style="color:#1F3A51">' + nums.length + '개</strong> 정답 인식 \u00B7 '
    +   '매칭: <strong style="color:' + (matched===total?'#10b981':'#f59e0b') + '">' + matched + '/' + total + '</strong>'
    + '</div>'
    + '<div style="font-size:11px;color:#9ca3af">\uD83D\uDDB1 <b style="color:#6d28d9">\u270F\uFE0F</b> 클릭으로 수정</div>'
    + '</div>';

  // 2열 그리드
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px">';

  sections.forEach(function(sec, idx){
    const color = sectionColors[idx % sectionColors.length];
    html += renderAnswerSectionCard(sec, idx+1, color, total);
  });

  html += '</div>';

  body.innerHTML = html;
}

function renderAnswerSectionCard(sec, stepNum, color, total){
  const numsInSec = sec.numbers;
  const rangeLabel = numsInSec.length > 0
    ? numsInSec[0] + '~' + numsInSec[numsInSec.length-1] + '번'
    : '';

  let html = '<div style="border:1.5px solid ' + color.accent + '33;border-radius:12px;overflow:hidden;background:#fff">';

  // 섹션 헤더 (이미지의 라벨 스타일: 번호 동그라미 + 이름 + 화살표)
  html += '<div style="background:' + color.bg + ';padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1.5px solid ' + color.accent + '22">';
  html += '<div style="width:26px;height:26px;border-radius:50%;background:' + color.icon + ';color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0">' + stepNum + '</div>';
  html += '<div style="flex:1;min-width:0">';
  html += '<div style="font-size:13px;font-weight:800;color:' + color.icon + '">\uD83D\uDCCD ' + (sec.title || '섹션') + ' 빠른정답</div>';
  if(rangeLabel || sec.subtitle){
    html += '<div style="font-size:10px;color:' + color.icon + 'cc;margin-top:1px">' + [rangeLabel, sec.subtitle].filter(Boolean).join(' \u00B7 ') + '</div>';
  }
  html += '</div>';
  html += '</div>';

  // 본문: 2열 정답 리스트
  html += '<div style="padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px">';
  numsInSec.forEach(function(n){
    const ans = (window._pendingAnswerMap && window._pendingAnswerMap[n]) != null
      ? window._pendingAnswerMap[n] : '';
    const exists = n >= 1 && n <= total;
    html += renderAnswerRow(n, ans, exists, color);
  });
  html += '</div>';

  html += '</div>';
  return html;
}

function buildAnswerSections(nums, answersMap){
  // 우선순위 1: najeExtractedProblems 에 level_name 있으면 그것으로 그룹
  const problems = najeExtractedProblems || [];
  const hasStageInfo = problems.length > 0 && problems.some(function(p){ return p && (p.level_name || p.step); });

  if(hasStageInfo){
    // 단계별 그룹핑
    const groups = {};
    const order = [];
    // 먼저 문제 목록에서 단계별 범위 파악
    problems.forEach(function(p){
      const step = p.step || 0;
      const key = step + '_' + (p.level_name || '기타');
      if(!groups[key]){
        groups[key] = {
          title: p.level_name || '기타',
          subtitle: p.level_type || '',
          step: step,
          numbers: []
        };
        order.push(key);
      }
    });

    // 인식된 번호를 해당 그룹에 배정
    nums.forEach(function(n){
      const prob = problems[n-1]; // 문제 번호는 1-based
      const step = prob ? (prob.step || 0) : 0;
      const levelName = prob ? (prob.level_name || '기타') : '기타';
      const key = step + '_' + levelName;
      if(groups[key]){
        groups[key].numbers.push(n);
      } else {
        // 해당 범위를 벗어나는 번호 \u2192 "기타" 그룹
        const miscKey = '_misc';
        if(!groups[miscKey]){
          groups[miscKey] = { title: '기타', subtitle: '범위 외', step: 999, numbers: [] };
          order.push(miscKey);
        }
        groups[miscKey].numbers.push(n);
      }
    });

    const result = order.map(function(k){ return groups[k]; }).filter(function(g){ return g.numbers.length > 0; });
    if(result.length > 0) return result;
  }

  // 우선순위 2: 단계 정보 없으면 10문항 단위 자동 그룹핑
  const autoGroups = [];
  const CHUNK = 10;
  let current = null;
  nums.forEach(function(n){
    const chunkIdx = Math.floor((n-1) / CHUNK);
    if(!current || current._chunkIdx !== chunkIdx){
      const start = chunkIdx * CHUNK + 1;
      const end = (chunkIdx + 1) * CHUNK;
      current = {
        title: start + '~' + end + '번',
        subtitle: '',
        step: chunkIdx + 1,
        numbers: [],
        _chunkIdx: chunkIdx
      };
      autoGroups.push(current);
    }
    current.numbers.push(n);
  });
  return autoGroups;
}

function closeImgViewer(){document.getElementById('imgViewer').classList.remove('open');}

function getLevelInfoByNum(num){
  if(NAJE_LEVEL_MAP[num]) return NAJE_LEVEL_MAP[num];
  if(num >= 81) return {name:NAJE_KILLER_NAME, type:NAJE_KILLER_TYPE, step:NAJE_KILLER_STEP};
  return {name:'', type:'', step:0};
}

function renderAnswerRow(n, ans, exists, color){
  const numBadge = '<span style="min-width:26px;text-align:right;color:#64748b;font-size:12px;font-weight:600">' + n + '</span>';
  const sep = '<span style="color:#cbd5e1">|</span>';
  const ansBadge = ''
    + '<span id="pending-ans-' + n + '" '
    + 'onclick="editPendingAnswer(' + n + ')" '
    + 'style="display:inline-block;min-width:50px;text-align:center;padding:2px 8px;border:1px solid ' + color.accent + '55;border-radius:6px;background:' + color.bg + ';color:' + color.icon + ';font-size:12px;font-weight:700;cursor:pointer;transition:all 0.15s" '
    + 'onmouseover="this.style.borderColor=\'' + color.accent + '\';this.style.transform=\'translateY(-1px)\'" '
    + 'onmouseout="this.style.borderColor=\'' + color.accent + '55\';this.style.transform=\'\'" '
    + 'title="클릭하여 수정">' + (ans || '?') + '</span>';
  const warn = exists ? '' : '<span title="문항 범위 밖" style="color:#f59e0b;font-size:11px">\u26A0</span>';

  return '<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-family:-apple-system,BlinkMacSystemFont,sans-serif">'
    + numBadge + sep + ansBadge + warn
    + '</div>';
}

function editPendingAnswer(num){
  const cell = document.getElementById('pending-ans-' + num);
  const cur = cell ? cell.textContent : '';
  const newVal = prompt(num + '번 정답 수정:', cur === '?' ? '' : cur);
  if(newVal === null) return;
  if(cell){
    cell.textContent = newVal || '?';
    // 수정됨 표시 (굵은 테두리)
    cell.style.borderWidth = '2px';
    cell.style.boxShadow = '0 0 0 2px #fef3c7';
  }
  if(window._pendingAnswerMap) window._pendingAnswerMap[num] = newVal;
}

async function njeInitAuth(){
  const statusEl = document.getElementById('nje-auth-status');
  const blocker = document.getElementById('nje-blocker');
  const main = document.getElementById('nje-main');
  try{
    const savedId = localStorage.getItem('savedUserId');
    if(!savedId){ statusEl.textContent='미로그인'; blocker.style.display='block'; return; }
    const {data, error} = await db.from('users').select('*').eq('id', savedId).single();
    if(error || !data){ statusEl.textContent='계정 조회 실패'; blocker.style.display='block'; return; }
    if(data.role !== 'admin'){ statusEl.textContent=data.name+' ('+data.role+') — 관리자 아님'; blocker.style.display='block'; return; }
    currentUser = data;
    statusEl.textContent = '✅ ' + data.name + ' (관리자)';
    main.style.display = 'block';
  }catch(e){ statusEl.textContent='인증 오류'; blocker.style.display='block'; }
}

window.addEventListener('DOMContentLoaded', function(){
  njeInitAuth();
  const pdfInput = document.getElementById('admin-naje-pdf-input');
  if(pdfInput){
    pdfInput.addEventListener('change', function(e){
      if(e.target.files && e.target.files[0]){ startNajePdfLoad(e.target.files[0], 'admin'); }
    });
  }
});
