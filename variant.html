<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>변형문제 — BMAPS v0.02</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --maroon:#1b6e4d; --maroon-d:#134e37; --maroon-l:#e7f3ec;
    --ink:#1f2430; --mut:#6b7280; --line:#e6e8ec; --bg:#f5f6f8; --card:#ffffff;
    --ok:#0f766e; --warn:#b45309; --bad:#b91c1c;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  header.top{background:var(--maroon);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px}
  header.top h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.2px}
  header.top .badge{font-size:11px;font-weight:700;background:rgba(255,255,255,.18);
    padding:3px 9px;border-radius:999px;letter-spacing:.3px}
  header.top .sp{margin-left:auto;font-size:12px;opacity:.85}
  main{display:grid;grid-template-columns:264px 1fr;gap:16px;padding:16px 22px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px}
  .panel .ph{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .panel .ph h2{margin:0;font-size:13px;font-weight:800}
  .panel .pb{padding:12px 14px}
  button{font-family:inherit;font-size:13px;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:var(--ink);padding:7px 12px;cursor:pointer}
  button:hover{background:#f3f4f6}
  button.pri{background:var(--maroon);border-color:var(--maroon);color:#fff;font-weight:700}
  button.pri:hover{background:var(--maroon-d)}
  button:disabled{opacity:.5;cursor:default}
  input,select,textarea{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink);width:100%}
  .mut{color:var(--mut)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .pill.ok{background:#ecfdf5;color:var(--ok)}
  .pill.warn{background:#fffbeb;color:var(--warn)}
  .pill.bad{background:#fef2f2;color:var(--bad)}
  .pill.mut{background:#f3f4f6;color:var(--mut)}

  /* 왼쪽 문서 목록 */
  .tree{display:flex;flex-direction:column;gap:2px;max-height:66vh;overflow-y:auto}
  .tree .grp{font-size:11px;font-weight:800;color:var(--mut);padding:8px 8px 3px;letter-spacing:.2px}
  .doc{padding:8px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
  .doc:hover{background:#f3f4f6}
  .doc.on{background:var(--maroon-l);border-color:#bfe0cf}
  .doc .t{font-weight:700;font-size:13px}
  .doc .s{font-size:11px;color:var(--mut);margin-top:2px}

  /* 탭 */
  .tabs{display:flex;gap:4px;padding:10px 14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:9px 9px 0 0;cursor:pointer;font-weight:700;font-size:13px;
    color:var(--mut);border:1px solid transparent;border-bottom:none;margin-bottom:-1px}
  .tab.on{background:#fff;color:var(--maroon);border-color:var(--line);border-bottom-color:#fff}
  .tabbody{padding:14px}

  /* 읽기 화면 — 원본과 결과를 나란히 */
  .readgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .pages{max-height:70vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;
    border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbfc}
  .pages img{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:zoom-in}
  .plist{max-height:70vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
  .prob{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
  .prob .h{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .prob .n{font-weight:800;font-size:14px}
  .empty{padding:34px 14px;text-align:center;color:var(--mut);font-size:13px}

  /* 올리기 모달 */
  .mask{position:fixed;inset:0;background:rgba(15,20,28,.45);display:none;align-items:center;
    justify-content:center;z-index:50;padding:20px}
  .mask.on{display:flex}
  .modal{background:#fff;border-radius:14px;width:min(560px,100%);max-height:90vh;overflow-y:auto}
  .modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800}
  .modal .mb{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modal .mb .full{grid-column:1/-1}
  .modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  label.f{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:4px}
  .drop{border:2px dashed #cbd5e1;border-radius:10px;padding:20px;text-align:center;color:var(--mut);
    cursor:pointer;background:#fafbfc}
  .drop.on{border-color:var(--maroon);background:var(--maroon-l);color:var(--maroon-d)}

  /* 인증 가림막 */
  .gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:80}
  .gate .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 30px;text-align:center;max-width:380px}
  .bar{height:6px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--maroon);width:0;transition:width .2s}
</style>
</head>
<body>

<header class="top">
  <h1>변형문제</h1>
  <span class="badge" id="ver">v0.02</span>
  <span class="sp" id="who">…</span>
</header>

<main>
  <!-- ── 왼쪽: 문서 목록 ─────────────────────────────── -->
  <section class="panel">
    <div class="ph">
      <h2>원본 문서</h2>
      <button class="pri" style="margin-left:auto;padding:5px 10px" onclick="vOpenUpload()">＋ 올리기</button>
    </div>
    <div class="pb">
      <input id="q" placeholder="제목·학교 검색" oninput="vRenderTree()" style="margin-bottom:8px">
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-bottom:8px">
        <input type="checkbox" id="trash" style="width:auto" onchange="vLoadDocs()"> 휴지통 보기
      </label>
      <div class="tree" id="tree"><div class="empty">불러오는 중…</div></div>
    </div>
  </section>

  <!-- ── 오른쪽: 작업 화면 ───────────────────────────── -->
  <section class="panel">
    <div class="tabs">
      <div class="tab on" data-tab="read"   onclick="vTab('read')">1 · 읽기</div>
      <div class="tab"    data-tab="make"   onclick="vTab('make')">2 · 변형 만들기</div>
      <div class="tab"    data-tab="review" onclick="vTab('review')">3 · 검수</div>
      <div class="tab"    data-tab="export" onclick="vTab('export')">4 · 내보내기</div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:8px;padding-bottom:8px" id="dochead"></div>
    </div>
    <div class="tabbody" id="body"><div class="empty">왼쪽에서 문서를 고르세요.</div></div>
  </section>
</main>

<!-- ── 올리기 모달 ─────────────────────────────────── -->
<div class="mask" id="upmask">
  <div class="modal">
    <div class="mh">원본 문서 올리기</div>
    <div class="mb">
      <div class="full">
        <label class="f">파일 (PDF 또는 이미지)</label>
        <div class="drop" id="drop" onclick="document.getElementById('file').click()">
          여기를 누르거나 파일을 끌어다 놓으세요<br>
          <span style="font-size:11px">한글 파일(.hwpx)은 한/글에서 <b>PDF로 저장</b>해서 올려주세요</span>
        </div>
        <input type="file" id="file" accept=".pdf,image/*" style="display:none" onchange="vPick(this.files[0])">
        <div id="fileinfo" class="mut" style="font-size:12px;margin-top:6px"></div>
      </div>
      <div class="full"><label class="f">제목</label><input id="u-title" placeholder="2026 1학기 중간 [기하] 고척고"></div>
      <div><label class="f">과목</label>
        <select id="u-subject"><option value="">—</option><option>대수</option><option>미적분Ⅰ</option>
        <option>미적분Ⅱ</option><option>확률과 통계</option><option>기하</option><option>공통수학</option></select></div>
      <div><label class="f">단원</label><input id="u-unit" placeholder="지수로그함수"></div>
      <div><label class="f">학년</label>
        <select id="u-grade"><option value="">—</option><option>중1</option><option>중2</option><option>중3</option>
        <option>고1</option><option>고2</option><option>고3</option></select></div>
      <div><label class="f">출처</label>
        <select id="u-src"><option>내신기출</option><option>교재</option><option>모의고사</option><option>기타</option></select></div>
      <div><label class="f">학교</label><input id="u-school" placeholder="고척고"></div>
      <div><label class="f">연도</label><input id="u-year" type="number" placeholder="2026"></div>
      <div><label class="f">학기</label>
        <select id="u-sem"><option value="">—</option><option value="1">1학기</option><option value="2">2학기</option></select></div>
      <div><label class="f">회차</label>
        <select id="u-round"><option value="">—</option><option>중간</option><option>기말</option></select></div>
      <div class="full" id="upprog" style="display:none">
        <div class="mut" style="font-size:12px" id="upmsg"></div>
        <div class="bar"><i id="upbar"></i></div>
      </div>
    </div>
    <div class="mf">
      <button onclick="vCloseUpload()">취소</button>
      <button class="pri" id="upgo" onclick="vUpload()">올리기</button>
    </div>
  </div>
</div>

<!-- ── 인증 가림막 ─────────────────────────────────── -->
<div class="gate" id="gate">
  <div class="box">
    <div style="font-size:15px;font-weight:800;margin-bottom:6px">변형문제</div>
    <div class="mut" id="gatemsg">확인 중…</div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   변형문제 만들기 — 화면 뼈대
   · index.html 에는 손대지 않는다. BMAPS 메뉴에서 새 창으로 연다.
   · 이 단계에서 하는 일: 원본 올리기 · 쪽 이미지 만들기 · 목록/휴지통
   · 읽기(비전)·변형 생성·검수·내보내기는 다음 단계에서 붙인다.
══════════════════════════════════════════════════════════════ */
window.VARIANT_VERSION = 'v0.02';

const SUPABASE_URL = 'https://qtpftloyumtffvgurvqv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XGP9n-2fuBQFuJlAA5MJ8w_R8JYIi9O';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = 'variants';
const PAGE_SCALE = 170 / 72;          /* 비전이 읽기 좋은 해상도 (실측 170dpi) */
/* WebP 90 은 PNG 의 1/2.7 인데 읽기 결과는 같았다(실측: 8문항 내용 동일). */
const PAGE_TYPE = 'image/webp', PAGE_Q = 0.90, PAGE_EXT = 'webp';

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

var vUser = null, vDocs = [], vDocId = null, vTabNow = 'read', vNames = {}, vPick_ = null;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function $(id){ return document.getElementById(id); }

/* ── 인증 — BMAPS 로그인(savedUserId)을 그대로 쓴다 ───────── */
var ALLOW = ['admin','vice_director','desk','teacher'];
async function vAuth(){
  var msg = $('gatemsg');
  try {
    var id = localStorage.getItem('savedUserId');
    if (!id) { msg.innerHTML = 'BMAPS에 먼저 로그인해주세요.'; return; }
    var r = await db.from('users').select('id,name,role,branch_id').eq('id', id).maybeSingle();
    if (r.error || !r.data) { msg.textContent = '사용자 정보를 찾을 수 없습니다.'; return; }
    if (ALLOW.indexOf(r.data.role) < 0) { msg.textContent = '권한이 없는 계정입니다.'; return; }
    vUser = r.data;
    $('who').textContent = r.data.name + ' 선생님';
    $('gate').style.display = 'none';
    vLoadNames();
    vLoadDocs();
  } catch(e) { msg.textContent = '오류: ' + (e.message || e); }
}

/* 만든이 이름표 — 학생은 뺀다 */
async function vLoadNames(){
  var r = await db.from('users').select('id,name').neq('role','student').limit(500);
  (r.data || []).forEach(function(u){ vNames[u.id] = u.name; });
}

/* ── 문서 목록 (전 분원 공통으로 본다) ────────────────────── */
async function vLoadDocs(){
  var trash = $('trash').checked;
  var q = db.from('variant_docs').select('*').order('created_at', { ascending:false }).limit(500);
  q = trash ? q.not('deleted_at','is',null) : q.is('deleted_at', null);
  var r = await q;
  if (r.error) { $('tree').innerHTML = '<div class="empty">불러오기 실패<br>' + esc(r.error.message) + '</div>'; return; }
  vDocs = r.data || [];
  vRenderTree();
}

function vRenderTree(){
  var kw = ($('q').value || '').trim();
  var list = vDocs.filter(function(d){
    if (!kw) return true;
    return (d.title + ' ' + (d.school||'') + ' ' + (d.unit||'')).indexOf(kw) >= 0;
  });
  if (!list.length) { $('tree').innerHTML = '<div class="empty">문서가 없습니다.</div>'; return; }

  /* 과목 → 단원 두 단계로 묶는다 */
  var grp = {};
  list.forEach(function(d){
    var k = (d.subject || '분류 없음');
    (grp[k] = grp[k] || []).push(d);
  });
  var html = '';
  Object.keys(grp).sort().forEach(function(k){
    html += '<div class="grp">' + esc(k) + '</div>';
    grp[k].forEach(function(d){
      html += '<div class="doc' + (d.id === vDocId ? ' on' : '') + '" onclick="vSelect(\'' + d.id + '\')">'
           +    '<div class="t">' + esc(d.title) + '</div>'
           +    '<div class="s">' + [d.unit, d.grade, (d.page_count ? d.page_count + '쪽' : '')]
                   .filter(Boolean).map(esc).join(' · ')
           +      ' ' + vStatusPill(d) + '</div>'
           +  '</div>';
    });
  });
  $('tree').innerHTML = html;
}

function vStatusPill(d){
  var m = { '올림':'mut', '읽는중':'warn', '읽음':'ok', '실패':'bad' };
  return '<span class="pill ' + (m[d.status] || 'mut') + '">' + esc(d.status) + '</span>';
}

function vSelect(id){ vDocId = id; vRenderTree(); vRenderBody(); }
function vTab(t){
  vTabNow = t;
  [].forEach.call(document.querySelectorAll('.tab'), function(el){
    el.classList.toggle('on', el.dataset.tab === t); });
  vRenderBody();
}

function vDoc(){ return vDocs.filter(function(d){ return d.id === vDocId; })[0]; }

function vRenderBody(){
  var d = vDoc();
  $('dochead').innerHTML = d
    ? '<span class="mut" style="font-size:12px">' + esc(vNames[d.created_by] || '') + '</span>'
      + (d.deleted_at
          ? '<button onclick="vRestore()">되살리기</button>'
          : '<button onclick="vTrash()">휴지통</button>')
    : '';
  if (!d) { $('body').innerHTML = '<div class="empty">왼쪽에서 문서를 고르세요.</div>'; return; }
  if (vTabNow === 'read') return vRenderRead(d);
  $('body').innerHTML = '<div class="empty">' +
    ({ make:'2 · 변형 만들기', review:'3 · 검수', export:'4 · 내보내기' }[vTabNow]) +
    ' — 다음 단계에서 붙입니다.</div>';
}

/* 버킷이 비공개이므로 공개 URL 이 없다. 한 시간짜리 서명 URL 을 한 번에 받아 쓴다. */
async function vSignedUrls(paths){
  var m = {};
  if (!paths.length) return m;
  var r = await db.storage.from(BUCKET).createSignedUrls(paths, 3600);
  if (r.error) { console.warn('서명 URL 실패', r.error); return m; }
  (r.data || []).forEach(function(x){ if (x.signedUrl) m[x.path] = x.signedUrl; });
  return m;
}

/* ══════════════════════════════════════════════════════════
   비전으로 문항 읽기
   · 쪽 이미지를 그대로 AI 에게 보여 준다. (문제은행 PDF 는 글자 추출이 안 된다)
   · 프록시의 imageUrls 모드를 쓰면 주소만 넘기면 되므로 요청이 가볍다.
════════════════════════════════════════════════════════════ */
/* ⚠ 반드시 상대 경로여야 한다. 운영 도메인을 박아 두면 프리뷰에서는 출처가 달라져
   사전요청(OPTIONS)이 나가고, 프록시가 그걸 405 로 막아 'Failed to fetch' 가 난다.
   index.html 도 같은 이유로 '/api/gemini-proxy' 를 쓴다. */
var PROXY = '/api/gemini-proxy';
var READ_AT_ONCE = 2;        /* 동시에 읽는 쪽 수 */

var OCR_PROMPT = [
 '이 이미지는 고등학교 수학 문제지 한 쪽이다. 여기 있는 문항을 **하나도 빠짐없이** 읽어라.',
 '',
 '번호 매김',
 '- 문항 번호는 `1.` 일 수도 `1|` 일 수도 있다. 어느 쪽이든 그 숫자를 number 에 넣어라.',
 '- 쪽은 **2단**일 수 있다. 왼쪽 단을 위에서 아래까지 다 읽은 뒤 오른쪽 단을 읽어라.',
 '- 문항 번호 옆의 `[2026 1학기 중간 고척]` 같은 출처 꼬리표는 statement 에 넣지 마라.',
 '',
 '받아쓰기',
 '- 보이는 그대로 옮겨 적어라. **풀지 마라. 답을 쓰지 마라.**',
 '- 수식은 LaTeX 로 쓰고 반드시 \\( \\) 로 감싸라. 예: \\(x^2 = -8y\\)',
 '- **\\( \\) 밖에는 수식 기호가 하나도 남으면 안 된다.** `x^2`, `7/2`, `sqrt(2)`, `P_0` 같은 걸 맨몸으로 쓰지 마라.',
 '- 괄호·중괄호의 짝을 반드시 맞춰라. `\\((2, 1))\\)` 처럼 하나 더 붙이지 마라.',
 '',
 '상자와 선택지',
 '- `<보기>` 상자나 `(가) (나)` 조건 상자는 **statement 안에 줄바꿈으로 이어서** 적어라. 빠뜨리면 안 된다.',
 '- 선택지는 ①②③④⑤ 순서대로 choices 에. 번호 기호는 빼고 내용만.',
 '- **선택지가 없는 주관식이면 choices 를 빈 배열로 둬라.** 없는 선택지를 지어내지 마라.',
 '- 배점 `[3.1점]` 이 있으면 points 에 "3.1" 처럼 숫자만. 없으면 빈 문자열.',
 '',
 '그림',
 '- 그림이 있으면 has_figure=true, figure_desc 에 무엇이 그려져 있는지 적어라(곡선·점 이름·표시).',
 '- 글자가 흐려 확실하지 않으면 그 부분을 ?? 로 표시해라. **추측해서 지어내지 마라.**'
].join('\n');

var OCR_SCHEMA = { type:'object', properties:{ problems:{ type:'array', items:{ type:'object',
  properties:{ number:{type:'string'}, statement:{type:'string'},
    choices:{type:'array', items:{type:'string'}}, points:{type:'string'},
    has_figure:{type:'boolean'}, figure_desc:{type:'string'} },
  required:['number','statement','choices','points','has_figure','figure_desc'] } } },
  required:['problems'] };

/* ⚠ JSON 이스케이프가 역슬래시를 삼킨다.
   모델이 "\frac" 이라 쓰면 \f 가 폼피드로 해석되어 "rac" 만 남는다.
   제어문자 하나가 역슬래시+글자 **두 글자**를 삼킨 것이므로 둘 다 되살린다. */
var VCMD = {
  '\x0c':['rac','orall','lat'],            '\x09':['heta','imes','an','ext','o','frac','au'],
  '\x08':['eta','inom','ar','ig','ullet'], '\x0d':['ight','ho','m','angle'],
  '\x0a':['eq','e','u','ot','abla'],       '\x0b':['ee','arphi','ec','ert']
};
var VBACK = { '\x08':'\\b', '\x09':'\\t', '\x0a':'\\n', '\x0b':'\\v', '\x0c':'\\f', '\x0d':'\\r' };

function vRepair(t){
  if (!t) return { t:t || '', n:0 };
  var out = '', n = 0, i = 0;
  while (i < t.length) {
    var c = t.charAt(i), list = VCMD[c];
    if (list) {
      var tail = t.substr(i + 1, 10), hit = false;
      for (var k = 0; k < list.length; k++) if (tail.indexOf(list[k]) === 0) { hit = true; break; }
      if (hit) { out += VBACK[c]; n++; i++; continue; }
    }
    out += c; i++;
  }
  return { t:out, n:n };
}

/* 형식 검사 — 내용이 맞는지는 사람이 봐야 하지만, 형식은 코드가 다 잡는다 */
var BARE = /(?:\\frac|\\sqrt|\\pm|\\theta|\\overline|\^|_\{|sqrt\(|[0-9]\/[0-9]|[a-zA-Z]_[0-9])/;
function vFlags(statement, choices){
  var f = [];
  function one(t, where){
    if (!t) return;
    var o = (t.match(/\\\(/g) || []).length, c = (t.match(/\\\)/g) || []).length;
    if (o !== c) f.push(where + ': 수식 구분자 짝 안 맞음');
    var m, rx = /\\\(([\s\S]*?)\\\)/g;
    while ((m = rx.exec(t))) {
      var s = m[1];
      if ((s.match(/\(/g)||[]).length !== (s.match(/\)/g)||[]).length) f.push(where + ': 괄호 안 맞음');
      if ((s.match(/\{/g)||[]).length !== (s.match(/\}/g)||[]).length) f.push(where + ': 중괄호 안 맞음');
    }
    var outside = t.replace(/\\\([\s\S]*?\\\)/g, ' ');
    if (BARE.test(outside)) f.push(where + ': 수식이 안 감싸짐');
  }
  one(statement, '본문');
  (choices || []).forEach(function(c, i){ one(c, '선택지' + (i + 1)); });
  return f;
}

async function vAskPage(url){
  var res = await fetch(PROXY, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ model:'gemini-2.5-flash', imageUrls:[url], prompt: OCR_PROMPT,
      generationConfig:{ temperature:0.1, maxOutputTokens:16384,
        responseMimeType:'application/json',
        thinkingConfig:{ thinkingBudget:8192 }, responseSchema: OCR_SCHEMA } }) });
  var d = await res.json();
  if (d.error) throw new Error(d.error.message || JSON.stringify(d.error));
  var c = (d.candidates || [])[0] || {};
  var t = c.content && c.content.parts && c.content.parts[0] && c.content.parts[0].text;
  if (!t) throw new Error('빈 응답 (' + (c.finishReason || '이유 없음') + ')');
  return JSON.parse(t).problems || [];
}

async function vRead(){
  var d = vDoc();
  if (!d) return;
  var pages = d.page_images || [];
  if (!pages.length) { alert('쪽 이미지가 없습니다.'); return; }

  var had = await db.from('variant_problems').select('id').eq('doc_id', d.id).limit(1);
  if ((had.data || []).length &&
      !confirm('이미 읽어 둔 문항이 있습니다.\n다시 읽으면 검수한 내용까지 모두 지워집니다.\n\n계속할까요?'))
    return;

  var btn = $('readbtn');
  if (btn) { btn.disabled = true; btn.textContent = '읽는 중…'; }
  var box = $('plist');
  var done = 0, rows = [], errs = [], repaired = 0;
  function tick(msg){
    if (box) box.innerHTML = '<div class="empty">' + esc(msg) + '<div class="bar" style="margin-top:10px">'
      + '<i style="width:' + Math.round(done / pages.length * 100) + '%"></i></div></div>';
  }
  tick('읽는 중 0 / ' + pages.length + '쪽');

  try {
    var urls = await vSignedUrls(pages.map(function(p){ return p.path; }));
    var queue = pages.slice();
    async function worker(){
      while (queue.length) {
        var p = queue.shift();
        try {
          var got = await vAskPage(urls[p.path]);
          got.forEach(function(g){
            var st = vRepair(g.statement), ch = (g.choices || []).map(function(x){ return vRepair(x); });
            repaired += st.n + ch.reduce(function(a, b){ return a + b.n; }, 0);
            var choices = ch.map(function(x){ return x.t; });
            rows.push({ doc_id: d.id, number: String(g.number || ''), page_no: p.no,
              statement: st.t, choices: choices, points: g.points || null,
              has_figure: !!g.has_figure, status: '초안',
              ocr: { model:'gemini-2.5-flash', page:p.no, repaired: st.n,
                     format_flags: vFlags(st.t, choices),
                     figure_desc: g.figure_desc || '' } });
          });
        } catch(e) { errs.push(p.no + '쪽: ' + (e.message || e)); }
        done++; tick('읽는 중 ' + done + ' / ' + pages.length + '쪽');
      }
    }
    await Promise.all(Array.from({ length: Math.min(READ_AT_ONCE, pages.length) }, worker));

    /* 쪽 순서 → 문항 번호 순서로 정리 */
    rows.sort(function(a, b){
      return (a.page_no - b.page_no) || (parseInt(a.number,10) || 0) - (parseInt(b.number,10) || 0); });
    rows.forEach(function(r, i){ r.order_no = i + 1; });

    tick('저장 중…');
    await db.from('variant_problems').delete().eq('doc_id', d.id);
    if (rows.length) {
      var ins = await db.from('variant_problems').insert(rows);
      if (ins.error) throw ins.error;
    }
    await db.from('variant_docs').update({
      status: errs.length ? (rows.length ? '읽음' : '실패') : '읽음',
      error: errs.length ? errs.join(' / ') : null,
      updated_at: new Date().toISOString() }).eq('id', d.id);

    var flagged = rows.filter(function(r){ return r.ocr.format_flags.length; }).length;
    alert('읽기가 끝났습니다.\n\n문항 ' + rows.length + '개'
      + '\n형식 경고 ' + flagged + '개'
      + (repaired ? '\n깨진 역슬래시 ' + repaired + '곳 복구' : '')
      + (errs.length ? '\n\n실패한 쪽:\n' + errs.join('\n') : ''));
    await vLoadDocs(); vRenderBody();
  } catch(e) {
    alert('읽기 실패\n\n' + (e.message || e));
    if (btn) { btn.disabled = false; btn.textContent = '읽기 시작'; }
    vRenderBody();
  }
}

/* ── [1] 읽기 — 원본 쪽과 읽은 문항을 나란히 ─────────────── */
async function vRenderRead(d){
  var pages = d.page_images || [];
  var urls = await vSignedUrls(pages.map(function(p){ return p.path; }));
  var imgs = pages.map(function(p){
    return '<img src="' + (urls[p.path] || '') + '" loading="lazy"'
         + ' onclick="window.open(this.src)" alt="' + p.no + '쪽">';
  }).join('') || '<div class="empty">쪽 이미지가 없습니다.</div>';

  $('body').innerHTML =
    '<div class="readgrid">'
    + '<div><div style="font-size:12px;font-weight:800;margin-bottom:6px">원본 ' + pages.length + '쪽</div>'
    +   '<div class="pages">' + imgs + '</div></div>'
    + '<div><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
    +   '<div style="font-size:12px;font-weight:800">읽은 문항</div>'
    +   '<span class="mut" style="font-size:12px" id="pstat"></span>'
    +   '<button class="pri" id="readbtn" style="margin-left:auto;padding:5px 10px"'
    +     ' onclick="vRead()">읽기 시작</button>'
    +   '</div><div class="plist" id="plist"><div class="empty">불러오는 중…</div></div></div>'
    + '</div>';
  vRenderProblems(d);
}

var vProbs = [];
async function vRenderProblems(d){
  var r = await db.from('variant_problems').select('*')
            .eq('doc_id', d.id).is('deleted_at', null).order('order_no');
  var box = $('plist');
  if (!box) return;
  if (r.error) { box.innerHTML = '<div class="empty">' + esc(r.error.message) + '</div>'; return; }
  vProbs = r.data || [];
  var st = $('pstat');
  if (st) {
    var done = vProbs.filter(function(p){ return p.status === '검수완료'; }).length;
    var warn = vProbs.filter(function(p){ return (((p.ocr||{}).format_flags)||[]).length; }).length;
    st.textContent = vProbs.length
      ? vProbs.length + '개 · 검수 ' + done + '개' + (warn ? ' · 경고 ' + warn + '개' : '') : '';
  }
  if (!vProbs.length) { box.innerHTML = '<div class="empty">아직 읽지 않았습니다.</div>'; return; }

  box.innerHTML = vProbs.map(function(p, i){
    var flags = ((p.ocr || {}).format_flags) || [];
    return '<div class="prob" id="pb-' + i + '">'
      + '<div class="h" style="cursor:pointer" onclick="vToggle(' + i + ')">'
      +   '<span class="n">' + esc(p.number) + '</span>'
      +   '<span class="pill ' + (p.status === '검수완료' ? 'ok' : 'mut') + '">' + esc(p.status) + '</span>'
      +   (flags.length ? '<span class="pill warn" title="' + esc(flags.join(' / ')) + '">형식 경고 '
                          + flags.length + '</span>' : '')
      +   (p.has_figure ? '<span class="pill mut">그림</span>' : '')
      +   '<span class="mut" style="margin-left:auto;font-size:11px">' + p.page_no + '쪽</span>'
      + '</div>'
      + '<div class="body">' + esc(p.statement || '')
      +   (p.choices && p.choices.length
            ? '<div class="mut" style="margin-top:4px;font-size:12px">'
              + p.choices.map(function(c, k){ return '①②③④⑤'.charAt(k) + ' ' + esc(c); }).join('　')
              + '</div>' : '')
      + '</div></div>';
  }).join('');
}

/* 문항을 눌러 펼치면 그 자리에서 고친다 — 원본 이미지를 보며 오독을 잡는 곳 */
function vToggle(i){
  var el = $('pb-' + i), p = vProbs[i];
  if (!el) return;
  if (el.dataset.open === '1') { el.dataset.open = ''; vRenderProblems(vDoc()); return; }
  el.dataset.open = '1';
  var flags = ((p.ocr || {}).format_flags) || [];
  el.querySelector('.body').innerHTML =
      (flags.length ? '<div class="pill warn" style="display:block;margin-bottom:6px;padding:6px 9px">'
                      + esc(flags.join(' / ')) + '</div>' : '')
    + '<label class="f">본문</label>'
    + '<textarea id="ed-s-' + i + '" rows="4">' + esc(p.statement || '') + '</textarea>'
    + '<label class="f" style="margin-top:6px">선택지 (한 줄에 하나, 없으면 비움)</label>'
    + '<textarea id="ed-c-' + i + '" rows="' + Math.max(2, (p.choices||[]).length) + '">'
      + esc((p.choices || []).join('\n')) + '</textarea>'
    + ((p.ocr||{}).figure_desc
        ? '<div class="mut" style="font-size:11px;margin-top:6px">AI 가 본 그림: '
          + esc(p.ocr.figure_desc) + ' <b>(믿지 말 것 — 배치를 자주 틀립니다)</b></div>' : '')
    + '<div style="display:flex;gap:6px;margin-top:8px">'
    +   '<button onclick="vSaveProb(' + i + ')">저장</button>'
    +   '<button class="pri" onclick="vSaveProb(' + i + ',true)">'
        + (p.status === '검수완료' ? '검수 해제' : '저장하고 검수완료') + '</button>'
    +   '<button style="margin-left:auto" onclick="vDropProb(' + i + ')">폐기</button>'
    + '</div>';
}

async function vSaveProb(i, done){
  var p = vProbs[i];
  var s = $('ed-s-' + i).value;
  var c = $('ed-c-' + i).value.split('\n').map(function(x){ return x.trim(); })
            .filter(function(x){ return x; });
  var ocr = Object.assign({}, p.ocr || {}, { format_flags: vFlags(s, c), edited: true });
  var status = done ? (p.status === '검수완료' ? '초안' : '검수완료') : p.status;
  var up = await db.from('variant_problems').update({
      statement: s, choices: c, ocr: ocr, status: status,
      reviewed_by: (status === '검수완료' ? vUser.id : null),
      reviewed_at: (status === '검수완료' ? new Date().toISOString() : null),
      updated_at: new Date().toISOString() }).eq('id', p.id);
  if (up.error) { alert('저장 실패\n' + up.error.message); return; }
  vRenderProblems(vDoc());
}

async function vDropProb(i){
  if (!confirm('이 문항을 폐기할까요?')) return;
  await db.from('variant_problems')
    .update({ status:'폐기', deleted_at: new Date().toISOString() }).eq('id', vProbs[i].id);
  vRenderProblems(vDoc());
}

/* ── 휴지통 ─────────────────────────────────────────────── */
async function vTrash(){
  if (!confirm('휴지통으로 옮길까요? 나중에 되살릴 수 있습니다.')) return;
  await db.from('variant_docs').update({ deleted_at: new Date().toISOString() }).eq('id', vDocId);
  vDocId = null; vLoadDocs(); vRenderBody();
}
async function vRestore(){
  await db.from('variant_docs').update({ deleted_at: null }).eq('id', vDocId);
  vLoadDocs(); vRenderBody();
}

/* ── 올리기 ─────────────────────────────────────────────── */
function vOpenUpload(){ $('upmask').classList.add('on'); }
function vCloseUpload(){ $('upmask').classList.remove('on'); }

function vPick(f){
  vPick_ = f || null;
  $('fileinfo').textContent = f ? (f.name + ' · ' + (f.size / 1048576).toFixed(1) + ' MB') : '';
  if (f && !$('u-title').value) $('u-title').value = f.name.replace(/\.[^.]+$/, '');
}
(function(){
  var d = $('drop');
  ['dragenter','dragover'].forEach(function(e){ d.addEventListener(e, function(ev){
    ev.preventDefault(); d.classList.add('on'); }); });
  ['dragleave','drop'].forEach(function(e){ d.addEventListener(e, function(ev){
    ev.preventDefault(); d.classList.remove('on'); }); });
  d.addEventListener('drop', function(ev){ vPick((ev.dataTransfer.files || [])[0]); });
})();

function vProg(msg, pct){
  $('upprog').style.display = '';
  $('upmsg').textContent = msg;
  $('upbar').style.width = (pct || 0) + '%';
}

/* PDF 를 쪽 이미지로 — 브라우저에서 한다. 서버가 필요 없다. */
async function vPdfToPages(file, onStep){
  var buf = await file.arrayBuffer();
  var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  var out = [];
  for (var i = 1; i <= pdf.numPages; i++) {
    var page = await pdf.getPage(i);
    var vp = page.getViewport({ scale: PAGE_SCALE });
    var cv = document.createElement('canvas');
    cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    var blob = await new Promise(function(res){ cv.toBlob(res, PAGE_TYPE, PAGE_Q); });
    out.push({ no: i, blob: blob, w: cv.width, h: cv.height });
    onStep(i, pdf.numPages);
  }
  return out;
}

async function vUpload(){
  if (!vPick_) { alert('파일을 골라주세요.'); return; }
  var title = ($('u-title').value || '').trim();
  if (!title) { alert('제목을 적어주세요.'); return; }
  var isPdf = /\.pdf$/i.test(vPick_.name);
  var isImg = /^image\//.test(vPick_.type);
  if (/\.hwpx?$/i.test(vPick_.name)) {
    alert('한글 파일은 아직 바로 못 읽습니다.\n한/글에서 [PDF로 저장] 한 뒤 그 파일을 올려주세요.');
    return;
  }
  if (!isPdf && !isImg) { alert('PDF 또는 이미지만 올릴 수 있습니다.'); return; }

  $('upgo').disabled = true;
  try {
    vProg('문서 등록 중…', 3);
    var ins = await db.from('variant_docs').insert({
      title: title,
      subject: $('u-subject').value || null,
      unit: ($('u-unit').value || '').trim() || null,
      grade: $('u-grade').value || null,
      source_type: $('u-src').value || null,
      school: ($('u-school').value || '').trim() || null,
      year: $('u-year').value ? Number($('u-year').value) : null,
      semester: $('u-sem').value ? Number($('u-sem').value) : null,
      round: $('u-round').value || null,
      file_kind: isPdf ? 'pdf' : 'image',
      status: '올림',
      branch_id: vUser.branch_id || null,
      created_by: vUser.id
    }).select('id').single();
    if (ins.error) throw ins.error;
    var docId = ins.data.id;

    /* 원본 파일 보관 */
    vProg('원본 파일 올리는 중…', 8);
    var ext = isPdf ? 'pdf' : (vPick_.name.split('.').pop() || 'png').toLowerCase();
    var srcPath = 'docs/' + docId + '.' + ext;
    var up = await db.storage.from(BUCKET).upload(srcPath, vPick_, { upsert: true });
    if (up.error) throw up.error;

    /* 쪽 이미지 만들기 */
    var pages = [];
    if (isPdf) {
      var made = await vPdfToPages(vPick_, function(i, n){
        vProg('쪽 그리는 중 ' + i + ' / ' + n, 10 + i / n * 45); });
      for (var k = 0; k < made.length; k++) {
        var p = made[k], path = 'pages/' + docId + '/' + p.no + '.' + PAGE_EXT;
        var r2 = await db.storage.from(BUCKET).upload(path, p.blob, { upsert: true, contentType: PAGE_TYPE });
        if (r2.error) throw r2.error;
        pages.push({ no: p.no, path: path, w: p.w, h: p.h });
        vProg('쪽 올리는 중 ' + (k + 1) + ' / ' + made.length, 55 + (k + 1) / made.length * 40);
      }
    } else {
      pages.push({ no: 1, path: srcPath, w: null, h: null });
      vProg('마무리…', 90);
    }

    var upd = await db.from('variant_docs').update({
      file_path: srcPath, page_count: pages.length,
      page_images: pages, status: '올림', updated_at: new Date().toISOString()
    }).eq('id', docId);
    if (upd.error) throw upd.error;

    vProg('끝났습니다.', 100);
    vCloseUpload();
    vPick_ = null; $('fileinfo').textContent = ''; $('upprog').style.display = 'none';
    await vLoadDocs(); vSelect(docId);
  } catch(e) {
    vProg('실패: ' + (e.message || e), 0);
    alert('올리기 실패\n\n' + (e.message || e));
  } finally { $('upgo').disabled = false; }
}
