<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>변형문제 — BMAPS v0.32.2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  :root{
    --maroon:#1b6e4d; --maroon-d:#134e37; --maroon-l:#e7f3ec;
    --ink:#1f2430; --mut:#6b7280; --line:#e6e8ec; --bg:#f5f6f8; --card:#ffffff;
    --ok:#0f766e; --warn:#b45309; --bad:#b91c1c;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  header.top{background:var(--maroon);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px}
  header.top h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.2px}
  header.top .badge{font-size:11px;font-weight:700;background:rgba(255,255,255,.18);
    padding:3px 9px;border-radius:999px;letter-spacing:.3px}
  header.top .sp{margin-left:auto;font-size:12px;opacity:.85}
  main{display:grid;grid-template-columns:264px 1fr;gap:16px;padding:16px 22px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px}
  .panel .ph{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .panel .ph h2{margin:0;font-size:13px;font-weight:800}
  .panel .pb{padding:12px 14px}
  button{font-family:inherit;font-size:13px;border-radius:9px;border:1px solid var(--line);
    background:#fff;color:var(--ink);padding:7px 12px;cursor:pointer}
  button:hover{background:#f3f4f6}
  button.pri{background:var(--maroon);border-color:var(--maroon);color:#fff;font-weight:700}
  button.pri:hover{background:var(--maroon-d)}
  button:disabled{opacity:.5;cursor:default}
  input,select,textarea{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink);width:100%}
  .mut{color:var(--mut)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .pill.ok{background:#ecfdf5;color:var(--ok)}
  .pill.warn{background:#fffbeb;color:var(--warn)}
  .pill.bad{background:#fef2f2;color:var(--bad)}
  .pill.mut{background:#f3f4f6;color:var(--mut)}

  .tree{display:flex;flex-direction:column;gap:2px;max-height:66vh;overflow-y:auto}
  .tree .grp{font-size:11px;font-weight:800;color:var(--mut);padding:8px 8px 3px;letter-spacing:.2px}
  .doc{padding:8px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
  .doc:hover{background:#f3f4f6}
  .doc.on{background:var(--maroon-l);border-color:#bfe0cf}
  .doc .t{font-weight:700;font-size:13px}
  .doc .s{font-size:11px;color:var(--mut);margin-top:2px}

  .tabs{display:flex;gap:4px;padding:10px 14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:9px 9px 0 0;cursor:pointer;font-weight:700;font-size:13px;
    color:var(--mut);border:1px solid transparent;border-bottom:none;margin-bottom:-1px}
  .tab.on{background:#fff;color:var(--maroon);border-color:var(--line);border-bottom-color:#fff}
  .tabbody{padding:14px}

  .plist{display:flex;flex-direction:column;gap:10px}
  .prob{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
  .prob .h{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .prob .n{font-weight:800;font-size:15px}
  .prob .stmt{margin:6px 0;line-height:1.9}
  .cond-box{border:1.2px solid #556;border-radius:4px;padding:6px 12px;margin:8px 0;max-width:520px}
  .prob .fig{max-width:340px;max-height:220px;border:1px solid var(--line);border-radius:6px;
    background:#fff;display:block;margin:6px 0}
  .prob .foot{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;font-size:12px}
  .katex{font-size:1.02em}
  .empty{padding:34px 14px;text-align:center;color:var(--mut);font-size:13px}
  .note{font-size:12px;color:var(--mut);background:#fafbfc;border:1px solid var(--line);
    border-radius:8px;padding:8px 12px;margin-bottom:10px}

  .mask{position:fixed;inset:0;background:rgba(15,20,28,.45);display:none;align-items:center;
    justify-content:center;z-index:50;padding:20px}
  .mask.on{display:flex}
  .modal{background:#fff;border-radius:14px;width:min(560px,100%);max-height:90vh;overflow-y:auto}
  .modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800}
  .modal .mb{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modal .mb .full{grid-column:1/-1}
  .modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  label.f{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:4px}
  .drop{border:2px dashed #cbd5e1;border-radius:10px;padding:20px;text-align:center;color:var(--mut);
    cursor:pointer;background:#fafbfc}
  .drop.on{border-color:var(--maroon);background:var(--maroon-l);color:var(--maroon-d)}

  .gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:80}
  .gate .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 30px;text-align:center;max-width:380px}
  .bar{height:6px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--maroon);width:0;transition:width .2s}
</style>
</head>
<body>

<header class="top">
  <h1>변형문제 · 포텐셜</h1>
  <span class="badge" id="ver">v0.32.2</span>
  <span class="sp" id="who">…</span>
</header>

<main>
  <!-- ── 왼쪽: 문서 목록 ─────────────────────────────── -->
  <section class="panel">
    <div class="ph">
      <h2>포텐셜 원본</h2>
      <button class="pri" style="margin-left:auto;padding:5px 10px" onclick="vOpenUpload()">＋ 올리기</button>
    </div>
    <div class="pb">
      <input id="q" placeholder="제목·단원 검색" oninput="vRenderTree()" style="margin-bottom:8px">
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-bottom:8px">
        <input type="checkbox" id="trash" style="width:auto" onchange="vLoadDocs()"> 휴지통 보기
      </label>
      <div class="tree" id="tree"><div class="empty">불러오는 중…</div></div>
    </div>
  </section>

  <!-- ── 오른쪽: 작업 화면 ───────────────────────────── -->
  <section class="panel">
    <div class="tabs">
      <div class="tab on" data-tab="read"   onclick="vTab('read')">1 · 읽기 · 검산</div>
      <div class="tab"    data-tab="make"   onclick="vTab('make')">2 · 변형 만들기</div>
      <div class="tab"    data-tab="export" onclick="vTab('export')">3 · 문제집 내보내기</div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:8px;padding-bottom:8px" id="dochead"></div>
    </div>
    <div class="tabbody" id="body"><div class="empty">왼쪽에서 문서를 고르세요.</div></div>
  </section>
</main>

<!-- ── 올리기 모달 ─────────────────────────────────── -->
<div class="mask" id="upmask">
  <div class="modal">
    <div class="mh">포텐셜 원본 올리기</div>
    <div class="mb">
      <div class="full">
        <label class="f">파일 (.hwpx)</label>
        <div class="drop" id="drop" onclick="document.getElementById('file').click()">
          여기를 누르거나 파일을 끌어다 놓으세요<br>
          <span style="font-size:11px">.hwp 는 한/글에서 [다른 이름으로 저장 → HWPX] 두 번 눌러 변환해 주세요</span>
        </div>
        <input type="file" id="file" accept=".hwpx" style="display:none" onchange="vPick(this.files[0])">
        <div id="fileinfo" class="mut" style="font-size:12px;margin-top:6px"></div>
      </div>
      <div class="full"><label class="f">제목</label><input id="u-title" placeholder="[중3][8월_2회] 3학년 2학기 1단원"></div>
      <div><label class="f">학년</label>
        <select id="u-grade"><option value="">—</option><option>중1</option><option>중2</option><option>중3</option></select></div>
      <div><label class="f">회차</label><input id="u-round" placeholder="8월 2회"></div>
      <div><label class="f">단원</label><input id="u-unit" placeholder="삼각비"></div>
      <div><label class="f">연도</label><input id="u-year" type="number" placeholder="2026"></div>
      <div class="full" id="upprog" style="display:none">
        <div class="mut" style="font-size:12px" id="upmsg"></div>
        <div class="bar"><i id="upbar"></i></div>
      </div>
    </div>
    <div class="mf">
      <button onclick="vCloseUpload()">취소</button>
      <button class="pri" id="upgo" onclick="vUpload()">올리기</button>
    </div>
  </div>
</div>

<!-- ── 인증 가림막 ─────────────────────────────────── -->
<div class="gate" id="gate">
  <div class="box">
    <div style="font-size:15px;font-weight:800;margin-bottom:6px">변형문제 · 포텐셜</div>
    <div class="mut" id="gatemsg">확인 중…</div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   변형문제 v0.20 — 포텐셜 전용 (1단계: 읽기 + 검산)
   · 입력이 PDF 비전에서 **hwpx 직접 파싱**으로 바뀌었다.
     미주(endNote)가 곧 문항이라 경계 추측이 없고, 정답은 미주·빠른답지
     두 곳을 교차검증한다 (실측 4개 파일 48/48 일치).
   · 검산: 본문 조건을 좌표로 풀어 코드가 답을 다시 구한다 (오탐 0 실측).
     서버 60초 제한 때문에 온도별 호출을 브라우저가 지휘한다.
   · 파싱·검산 결과는 Storage 의 parsed/<docId>.json 하나에 담는다 (DDL 불필요).
   · index.html 에는 손대지 않는다. BMAPS 메뉴에서 새 창으로 연다.
══════════════════════════════════════════════════════════════ */
window.VARIANT_VERSION = 'v0.32.2';

const SUPABASE_URL = 'https://qtpftloyumtffvgurvqv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XGP9n-2fuBQFuJlAA5MJ8w_R8JYIi9O';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = 'variants';
/* ⚠ 반드시 상대 경로 — 절대 주소를 박으면 프리뷰에서 출처가 달라져 CORS 사전요청에 막힌다 */
const API_PARSE = '/api/variant-parse';
const API_CHECK = '/api/variant-check';
const API_GEN   = '/api/variant-gen';
const API_BUILD = '/api/variant-build';

var vUser = null, vDocs = [], vDocId = null, vTabNow = 'read', vNames = {}, vPick_ = null;
var vParsed = null;            /* 지금 고른 문서의 parsed/<id>.json 내용 */
var vChecking = false;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function $(id){ return document.getElementById(id); }

/* ── 인증 — BMAPS 로그인(savedUserId)을 그대로 쓴다 ───────── */
var ALLOW = ['admin','vice_director','desk','teacher'];
async function vAuth(){
  var msg = $('gatemsg');
  try {
    var id = localStorage.getItem('savedUserId');
    if (!id) { msg.innerHTML = 'BMAPS에 먼저 로그인해주세요.'; return; }
    var r = await db.from('users').select('id,name,role,branch_id').eq('id', id).maybeSingle();
    if (r.error || !r.data) { msg.textContent = '사용자 정보를 찾을 수 없습니다.'; return; }
    if (ALLOW.indexOf(r.data.role) < 0) { msg.textContent = '권한이 없는 계정입니다.'; return; }
    vUser = r.data;
    $('who').textContent = r.data.name + ' 선생님';
    $('gate').style.display = 'none';
    vLoadNames();
    vLoadDocs();
  } catch(e) { msg.textContent = '오류: ' + (e.message || e); }
}

async function vLoadNames(){
  var r = await db.from('users').select('id,name').neq('role','student').limit(500);
  (r.data || []).forEach(function(u){ vNames[u.id] = u.name; });
}

/* ── 문서 목록 ───────────────────────────────────────────── */
async function vLoadDocs(){
  var trash = $('trash').checked;
  var q = db.from('variant_docs').select('*').order('created_at', { ascending:false }).limit(500);
  q = trash ? q.not('deleted_at','is',null) : q.is('deleted_at', null);
  var r = await q;
  if (r.error) { $('tree').innerHTML = '<div class="empty">불러오기 실패<br>' + esc(r.error.message) + '</div>'; return; }
  vDocs = r.data || [];
  vRenderTree();
}

function vRenderTree(){
  var kw = ($('q').value || '').trim();
  var list = vDocs.filter(function(d){
    if (!kw) return true;
    return (d.title + ' ' + (d.unit||'') + ' ' + (d.round||'')).indexOf(kw) >= 0;
  });
  if (!list.length) { $('tree').innerHTML = '<div class="empty">문서가 없습니다.</div>'; return; }
  var grp = {};
  list.forEach(function(d){
    var k = (d.grade || '학년 없음');
    (grp[k] = grp[k] || []).push(d);
  });
  var html = '';
  Object.keys(grp).sort().forEach(function(k){
    html += '<div class="grp">' + esc(k) + '</div>';
    grp[k].forEach(function(d){
      html += '<div class="doc' + (d.id === vDocId ? ' on' : '') + '" onclick="vSelect(\'' + d.id + '\')">'
           +    '<div class="t">' + esc(d.title) + '</div>'
           +    '<div class="s">' + [d.unit, d.round].filter(Boolean).map(esc).join(' · ')
           +      ' ' + vStatusPill(d) + '</div>'
           +  '</div>';
    });
  });
  $('tree').innerHTML = html;
}

function vStatusPill(d){
  var m = { '올림':'mut', '읽음':'ok', '실패':'bad' };
  return '<span class="pill ' + (m[d.status] || 'mut') + '">' + esc(d.status || '') + '</span>';
}

function vSelect(id){ vDocId = id; vParsed = null; vRenderTree(); vRenderBody(); }
function vTab(t){
  vTabNow = t;
  [].forEach.call(document.querySelectorAll('.tab'), function(el){
    el.classList.toggle('on', el.dataset.tab === t); });
  vRenderBody();
}
function vDoc(){ return vDocs.filter(function(d){ return d.id === vDocId; })[0]; }

function vRenderBody(){
  var d = vDoc();
  $('dochead').innerHTML = d
    ? '<span class="mut" style="font-size:12px">' + esc(vNames[d.created_by] || '') + '</span>'
      + (d.deleted_at
          ? '<button onclick="vRestore()">되살리기</button>'
          : '<button onclick="vTrash()">휴지통</button>')
    : '';
  if (!d) { $('body').innerHTML = '<div class="empty">왼쪽에서 문서를 고르세요.</div>'; return; }
  if (vTabNow === 'read') return vRenderRead(d);
  if (vTabNow === 'make') return vRenderMake(d);
  if (vTabNow === 'export') return vRenderExport(d);
}

/* 버킷이 비공개 — 한 시간짜리 서명 URL 을 받아 쓴다 */
async function vSignedUrl(path){
  var r = await db.storage.from(BUCKET).createSignedUrl(path, 3600);
  if (r.error) throw r.error;
  return r.data.signedUrl;
}

/* ══════════════════════════════════════════════════════════
   parsed/<docId>.json — 파싱·검산 결과를 한 파일에 담는다
════════════════════════════════════════════════════════════ */
async function vParsedLoad(d){
  try {
    var url = await vSignedUrl('parsed/' + d.id + '.json');
    var r = await fetch(url);
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { return null; }
}
async function vParsedSave(d){
  var blob = new Blob([JSON.stringify(vParsed)], { type:'application/json' });
  var r = await db.storage.from(BUCKET).upload('parsed/' + d.id + '.json', blob, { upsert:true });
  if (r.error) throw r.error;
}

/* ══════════════════════════════════════════════════════════
   1 · 읽기 — 서버가 hwpx 를 파싱한다 (미주 = 문항)
════════════════════════════════════════════════════════════ */
async function vRunParse(d){
  var btn = $('btn-parse') || $('btn-reparse');   /* 처음 읽기든 다시 읽기든 진행을 보여준다 */
  if (btn) { btn.disabled = true; btn.textContent = '읽는 중…'; }
  try {
    var url = await vSignedUrl(d.file_path);
    var r = await fetch(API_PARSE, { method:'POST',
      headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ url:url }) });
    var j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
    /* ⚠ 다시 읽기가 만들어 둔 변형(gen)을 지우면 안 된다 — 본문만 새로, 변형은 보존 */
    vParsed = { at: new Date().toISOString(), count: j.count,
                quick_count: j.quick_count, probs: j.probs,
                gen: (vParsed && vParsed.gen) || undefined };
    await vParsedSave(d);
    await db.from('variant_docs').update({ status:'읽음',
      updated_at: new Date().toISOString() }).eq('id', d.id);
    d.status = '읽음';
    vRenderTree(); vRenderRead(d);
  } catch(e) {
    alert('읽기 실패\n\n' + (e.message || e));
    if (btn) { btn.disabled = false;
               btn.textContent = (btn.id === 'btn-reparse') ? '다시 읽기' : '문항 읽기'; }
  }
}

async function vRenderRead(d){
  if (d.file_kind && d.file_kind !== 'hwpx') {
    $('body').innerHTML = '<div class="empty">이 문서는 이전(PDF) 방식으로 올린 것입니다.<br>'
      + '포텐셜 원본 hwpx 를 새로 올려주세요.</div>';
    return;
  }
  if (!vParsed) {
    $('body').innerHTML = '<div class="empty">불러오는 중…</div>';
    vParsed = await vParsedLoad(d);
    if (vDocId !== d.id) return;              /* 그 사이 다른 문서를 골랐다 */
  }
  if (!vParsed) {
    $('body').innerHTML =
      '<div class="note">hwpx 를 서버가 직접 읽습니다. 미주(해설) 하나가 문항 하나라 경계 추측이 없고,'
      + ' 정답은 미주와 빠른답지 두 곳을 교차검증합니다.</div>'
      + '<div style="text-align:center;padding:20px">'
      + '<button class="pri" id="btn-parse" onclick="vRunParse(vDoc())">문항 읽기</button></div>';
    return;
  }
  var cross = vParsed.probs.filter(function(p){ return p.answer_cross === '일치'; }).length;
  var html =
      '<div class="note">문항 <b>' + vParsed.count + '</b>개 · 정답 교차검증 <b>'
    + cross + '/' + vParsed.count + '</b> 일치'
    + ' &nbsp;·&nbsp; <b>검산</b>은 본문 조건을 좌표로 풀어 코드가 답을 다시 구하는 것입니다.'
    + ' 통과 = 코드가 같은 답에 이르렀음 · 못 함 = 판단하지 않았다는 뜻(틀렸다는 뜻이 아님)</div>'
    + '<div style="display:flex;gap:8px;margin-bottom:10px">'
    + '<button class="pri" id="btn-checkall" onclick="vCheckAll()"'
    + (vChecking ? ' disabled' : '') + '>전체 검산</button>'
    + '<button id="btn-reparse" onclick="vRunParse(vDoc())">다시 읽기</button>'
    + '<span class="mut" style="font-size:12px;align-self:center" id="checkmsg"></span></div>'
    + '<div class="plist">';
  vParsed.probs.forEach(function(p, i){ html += vProbCard(p, i); });
  $('body').innerHTML = html + '</div>';
  vKatexAll();
}

function vProbCard(p, i){
  var crossPill = p.answer_cross === '일치'
    ? '<span class="pill ok">정답 교차 일치</span>'
    : (p.answer_cross === '다름'
        ? '<span class="pill bad">미주·답지 다름</span>'
        : (p.answer_cross === '수동'
            ? '<span class="pill warn">정답 수동 교정</span>'
            : '<span class="pill mut">빠른답지 없음</span>'));
  var h = '<div class="prob" id="prob-' + i + '">'
    + '<div class="h"><span class="n">' + p.number + '번</span>'
    + (p.level ? '<span class="pill mut">' + esc(p.level) + '</span>' : '')
    + (p.type ? '<span class="pill mut">' + esc(p.type) + '</span>' : '')
    + crossPill
    + '<span style="margin-left:auto"></span>'
    + '<span id="chk-' + i + '">' + vCheckPill(p.check) + '</span>'
    + '<button style="padding:4px 10px" id="chkbtn-' + i + '" onclick="vCheckOne(' + i + ')">검산</button>'
    + '</div>'
    + '<div class="stmt">' + vStmtHtml(p) + '</div>';
  (p.figures || []).forEach(function(f){
    h += '<img class="fig" src="' + f.data + '" alt="문제 그림">';
  });
  h += '<div class="foot"><b>정답</b> <span class="ktx" data-ltx="'
    + esc(p.answer_latex || '') + '">' + esc(p.answer_script) + '</span>'
    + '<button style="padding:1px 8px;font-size:11px" onclick="vEditAns(' + i + ')"'
    + ' title="미주를 잘못 읽었을 때 정답을 직접 고칩니다">수정</button>'
    + (p.source ? '<span class="mut" style="margin-left:auto">출처) ' + esc(p.source) + '</span>' : '')
    + '</div></div>';
  return h;
}

/* 미주를 잘못 읽은 문항의 정답을 손으로 고친다.
   검산값(코드가 구한 답)은 정답과 무관하므로 그대로 두고, 대조(agree)만 다시 한다. */
async function vEditAns(i){
  var d = vDoc(), p = vParsed.probs[i];
  var v = prompt('정답을 한글 수식 스크립트로 입력하세요.\n예) 3over5 · {9} over {14} · 4',
                 p.answer_script || '');
  if (v == null) return;
  v = v.trim();
  if (!v) { alert('빈 정답은 저장하지 않습니다.'); return; }
  p.answer_script = v;
  p.answer_latex = '';                 /* 화면엔 스크립트 원문이 그대로 보인다 */
  p.answer_cross = '수동';
  if (p.check && p.check.value != null) {
    try {
      var r = await vApiCheck({ mode:'agree', value:p.check.value,
                                vars:(p.check.vars || {}), answer_script:v });
      p.check.agree = r.agree || '';
    } catch(e) { console.warn('재대조 실패', e); }
  }
  try { await vParsedSave(d); } catch(e) { alert('저장 실패: ' + (e.message || e)); }
  vRenderRead(d);
}

function vStmtHtml(p){
  return (p.parts || []).map(function(x){
    if (x.eq != null) return '<span class="ktx" data-ltx="' + esc(x.latex || '') + '">' + esc(x.eq) + '</span>';
    if (x.boxs) return '<div class="cond-box">';    /* 조건 상자 (가)(나)(다) */
    if (x.boxe) return '</div>';
    if (x.br) return '<br>';
    return esc(x.t)
      .replace(/\s*(?=\([가나다라마]\)\s)/g, '\n')   /* 이어 쓴 조건 줄 펴기 */
      .replace(/\s*(?=[ㄱㄴㄷㄹㅁ]\.\s)/g, '\n')
      .replace(/\n/g, '<br>');
  }).join('');
}

/* 수식 조각을 KaTeX 로 — 못 그리면 원문 스크립트가 그대로 남는다 */
function vKatexAll(){
  [].forEach.call(document.querySelectorAll('.ktx'), function(el){
    var ltx = el.dataset.ltx;
    if (!ltx) return;
    try { katex.render(ltx, el, { throwOnError:true, strict:false }); }
    catch(e) { /* 원문 유지 */ }
  });
}

/* ══════════════════════════════════════════════════════════
   검산 — 온도 둘을 따로 부르고(combine 은 서버가), 값이 하나뿐이면 셋째
════════════════════════════════════════════════════════════ */
function vCheckPill(c){
  if (!c) return '';
  if (c.running) return '<span class="pill warn">검산 중…</span>';
  var m = { '확인함':'ok', '조건 모순':'warn', '흔들림':'warn', '판정 보류':'warn',
            '검산 못 함':'mut', '명세 실패':'mut' };
  var txt = { '확인함':'검산 통과' }[c.verdict] || ('검산 ' + c.verdict);
  if (c.verdict === '확인함' && c.value != null) {
    var val = ' ' + (Math.round(c.value * 10000) / 10000);
    if (c.agree === '어긋남')                 /* 어긋났으면 '통과' 라는 말을 쓰지 않는다 */
      return '<span class="pill bad" title="' + esc(c.why || '') + '">검산 ✗' + val
        + ' · 출제 답과 어긋남 — 사람이 확인</span>';
    txt += val;
    if (c.agree === '일치') txt += ' · 출제 답과 일치';
    else txt += ' · 답이 문자식이라 대조 못 함';
  }
  return '<span class="pill ' + (m[c.verdict] || 'mut') + '" title="' + esc(c.why || '') + '">'
    + txt + '</span>';
}

/* 그림을 PNG base64 로 — 서버가 BMP 를 이미 PNG 로 바꿔 주므로 대부분 그대로 쓴다 */
function vFigB64(p){
  var f = (p.figures || [])[0];
  return new Promise(function(res){
    if (!f || !f.data) return res(null);
    var m = f.data.match(/^data:image\/(png|jpeg);base64,(.*)$/);
    if (m) return res(m[2]);
    var im = new Image();
    im.onload = function(){
      var c = document.createElement('canvas');
      c.width = im.naturalWidth; c.height = im.naturalHeight;
      c.getContext('2d').drawImage(im, 0, 0);
      res(c.toDataURL('image/png').split(',')[1]);
    };
    im.onerror = function(){ res(null); };
    im.src = f.data;
  });
}

async function vApiCheck(body){
  var r = await fetch(API_CHECK, { method:'POST',
    headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  var j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

async function vCheckOne(i){
  var d = vDoc(), p = vParsed.probs[i];
  var btn = $('chkbtn-' + i);
  if (btn) btn.disabled = true;
  p.check = { running: true };
  $('chk-' + i).innerHTML = vCheckPill(p.check);
  try {
    var png = await vFigB64(p);
    var mk = function(t){ return vApiCheck({ mode:'run', statement:p.statement,
      png_b64:png, temp:t }); };
    var runs = await Promise.all([mk(0.15), mk(0.55)]);
    var c = await vApiCheck({ mode:'combine', runs:runs, answer_script:p.answer_script });
    if (c.need_third) {
      runs.push(await mk(0.35));
      c = await vApiCheck({ mode:'combine', runs:runs, answer_script:p.answer_script });
    }
    p.check = { verdict:c.verdict, value:c.value, agree:c.agree,
                why:(c.why || '').slice(0, 160), vars:c.vars || {},
                at:new Date().toISOString() };
  } catch(e) {
    p.check = { verdict:'검산 못 함', value:null, agree:'',
                why:('호출 실패: ' + (e.message || e)).slice(0, 160) };
  }
  $('chk-' + i).innerHTML = vCheckPill(p.check);
  if (btn) btn.disabled = false;
  try { await vParsedSave(d); } catch(e) { console.warn('저장 실패', e); }
}

async function vCheckAll(){
  if (vChecking) return;
  vChecking = true;
  var all = $('btn-checkall');
  if (all) all.disabled = true;
  var n = vParsed.probs.length;
  for (var i = 0; i < n; i++) {
    if (!vDoc() || vTabNow !== 'read') break;      /* 화면을 떠나면 멈춘다 */
    var msg = $('checkmsg');
    if (msg) msg.textContent = (i + 1) + ' / ' + n + ' 검산 중… (문항당 10~60초)';
    await vCheckOne(i);
  }
  vChecking = false;
  var msg2 = $('checkmsg');
  if (msg2) {
    var ok = vParsed.probs.filter(function(p){ return p.check && p.check.verdict === '확인함'; }).length;
    var bad = vParsed.probs.filter(function(p){ return p.check && p.check.agree === '어긋남'; }).length;
    msg2.textContent = '끝 — 통과 ' + ok + ' / ' + n + (bad ? ' · 어긋남 ' + bad + ' ⚠' : '');
  }
  if (all) all.disabled = false;
}

/* ══════════════════════════════════════════════════════════
   2 · 변형 만들기 — 등급 하나씩: 생성 → 검산 → (걸리면 한 번 다시)
                     → 답 확인되면 헤맨 해설·범위 밖 도구 재작성
════════════════════════════════════════════════════════════ */
var LEVELS = ['V1', 'V2', 'V3'];
var LVDESC = { V1:'계산이 무거워짐', V2:'묻는 대상이 달라짐', V3:'조건이 간접적으로 바뀜' };
var vGenBusy = false;

function vGradeLabel(d){
  return [(d.grade || ''), (d.round || ''), (d.unit ? '(' + d.unit + ')' : '')]
    .filter(Boolean).join(' ');
}
function vGen(no){
  vParsed.gen = vParsed.gen || {};
  return vParsed.gen[no] = vParsed.gen[no] || { variants: [] };
}
function vSlot(no, lv){
  var g = (vParsed.gen || {})[no];
  if (!g) return null;
  return (g.variants || []).filter(function(v){ return v.level === lv; })[0] || null;
}

async function vRenderMake(d){
  if (!vParsed) { vParsed = await vParsedLoad(d); if (vDocId !== d.id) return; }
  if (!vParsed) {
    $('body').innerHTML = '<div class="empty">먼저 [1 · 읽기 · 검산] 에서 문항을 읽어주세요.</div>';
    return;
  }
  var html =
      '<div class="note">등급마다 <b>생성 → 검산 → (걸리면 한 번 다시) → 해설 다듬기</b> 를 거칩니다.'
    + ' 등급 하나에 1~3분 — <b>전체 생성은 30분 이상</b> 걸리니 화면을 켜 두세요.'
    + ' 만든 것은 그때그때 저장됩니다.</div>'
    + '<div style="display:flex;gap:8px;margin-bottom:10px">'
    + '<button class="pri" onclick="vGenAll()"' + (vGenBusy ? ' disabled' : '') + '>전체 생성</button>'
    + '<span class="mut" style="font-size:12px;align-self:center" id="genmsg"></span></div>'
    + '<div class="plist">';
  vParsed.probs.forEach(function(p){
    var no = String(p.number);
    html += '<div class="prob"><div class="h"><span class="n">' + no + '번</span>'
      + (p.type ? '<span class="pill mut">' + esc(p.type) + '</span>' : '')
      + '<span class="mut" style="font-size:12px">정답 ' + esc(p.answer_script) + '</span>'
      + '</div>';
    LEVELS.forEach(function(lv){ html += vSlotHtml(no, lv); });
    html += '</div>';
  });
  $('body').innerHTML = html + '</div>';
  vKatexAll();
}

function vSlotHtml(no, lv){
  var v = vSlot(no, lv);
  var id = 'slot-' + no + '-' + lv;
  var h = '<div id="' + id + '" style="border-top:1px solid var(--line);padding:8px 0 4px">';
  if (!v) {
    return h + '<span class="pill mut">' + lv + '</span> <span class="mut" style="font-size:12px">'
      + LVDESC[lv] + '</span> <button style="padding:3px 10px;margin-left:8px"'
      + ' onclick="vGenLevel(\'' + no + '\',\'' + lv + '\')">만들기</button></div>';
  }
  if (v.running) {
    return h + '<span class="pill mut">' + lv + '</span> '
      + '<span class="pill warn">' + esc(v.running) + '</span></div>';
  }
  if (v.impossible) {
    return h + '<span class="pill mut">' + lv + '</span> '
      + '<span class="pill mut">만들 수 없음</span> <span class="mut" style="font-size:12px">'
      + esc(v.impossible) + '</span> <button style="padding:3px 10px"'
      + ' onclick="vGenLevel(\'' + no + '\',\'' + lv + '\')">다시</button></div>';
  }
  h += '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px">'
    + '<span class="pill mut">' + lv + '</span>'
    + vCheckPill(v.check)
    + (v.sol_flag ? '<span class="pill warn">⚑ ' + esc(v.sol_flag) + '</span>' : '')
    + ((v.over || []).length ? '<span class="pill warn">범위 밖: ' + esc(v.over.join('·')) + '</span>' : '')
    + (v.retried ? '<span class="pill mut">↻ 다시 만듦</span>' : '')
    + '<span style="margin-left:auto"></span>'
    + '<button style="padding:3px 10px" onclick="vGenLevel(\'' + no + '\',\'' + lv + '\')">다시 만들기</button>'
    + '</div>'
    + '<div class="stmt" style="font-size:13px">' + vStmtHtml(v) + '</div>'
    + '<div class="foot"><b>정답</b> <span>' + esc(v.answer || '') + '</span>'
    + (v.figure_need && v.figure_need !== 'none'
        ? '<span class="mut">▣ 그림 ' + (v.figure_need === 'edit' ? '수정' : '새로') + ': '
          + esc((v.figure_note || '').slice(0, 80)) + '</span>' : '')
    + '</div>';
  return h + '</div>';
}

function vSlotRefresh(no, lv){
  var el = $('slot-' + no + '-' + lv);
  if (el) { el.outerHTML = vSlotHtml(no, lv); vKatexAll(); }
}

async function vApiGen(body){
  var r = await fetch(API_GEN, { method:'POST',
    headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  var j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

/* 변형 본문($ … $)을 검산한다 — 그림은 주지 않는다: 본문만으로 풀려야 한다 */
async function vCheckVariant(v){
  var mk = function(t){ return vApiCheck({ mode:'run', statement:v.statement, temp:t }); };
  var runs = await Promise.all([mk(0.15), mk(0.55)]);
  var c = await vApiCheck({ mode:'combine', runs:runs, answer_script:v.answer });
  if (c.need_third) {
    runs.push(await mk(0.35));
    c = await vApiCheck({ mode:'combine', runs:runs, answer_script:v.answer });
  }
  return { verdict:c.verdict, value:c.value, agree:c.agree,
           why:(c.why || '').slice(0, 160) };
}

function vBad(v){
  var c = v.check || {};
  return c.agree === '어긋남' || c.verdict === '조건 모순';
}

async function vGenLevel(no, lv){
  var d = vDoc();
  var p = vParsed.probs.filter(function(x){ return String(x.number) === String(no); })[0];
  if (!p) return;
  var g = vGen(no);
  var put = function(v){
    g.variants = (g.variants || []).filter(function(x){ return x.level !== lv; });
    g.variants.push(v);
    g.variants.sort(function(a, b){ return a.level < b.level ? -1 : 1; });
  };
  put({ level: lv, running: '생성 중…' });
  vSlotRefresh(no, lv);
  try {
    var png = await vFigB64(p);
    var prob = { statement: p.statement, answer_script: p.answer_script,
                 type: p.type, points: p.points };
    var label = vGradeLabel(d);
    var v = await vApiGen({ mode:'gen', prob:prob, grade_label:label, level:lv, png_b64:png });
    if (!v.impossible) {
      put(Object.assign(v, { running: '검산 중…' })); vSlotRefresh(no, lv);
      v.check = await vCheckVariant(v);

      /* 걸리면 사유를 알려 주고 한 번만 다시 — 원판(pt_full3)의 재시도 규칙 */
      if (vBad(v)) {
        put(Object.assign(v, { running: '걸림 — 다시 만드는 중…' })); vSlotRefresh(no, lv);
        var note = '  · ' + lv + ' 로 만든 문제 — '
          + (v.check.agree === '어긋남'
              ? ('네가 쓴 답은 ' + v.answer + ' 인데 검산은 ' + v.check.value + ' 가 나왔다')
              : '조건을 만족하는 도형이 아예 없다 (조건 모순)');
        try {
          var v2 = await vApiGen({ mode:'gen', prob:prob, grade_label:label, level:lv,
                                   png_b64:png, retry_note:note, temp:0.5 });
          if (!v2.impossible) {
            v2.check = await vCheckVariant(v2);
            if (!vBad(v2) || v2.check.agree === '일치') { v = v2; v.retried = true; }
          }
        } catch(e) { /* 재시도 실패 — 1차 것을 둔다 */ }
      }

      /* 답이 확인된 것만 해설을 다듬는다 — 아니면 '그럴듯하지만 틀린 해설' 이 된다 */
      if ((v.check || {}).agree === '일치') {
        if (v.sol_flag) {
          put(Object.assign(v, { running: '해설 다듬는 중…' })); vSlotRefresh(no, lv);
          try {
            var r1 = await vApiGen({ mode:'resol', statement:v.statement,
                                     answer:v.answer, grade_label:label });
            if (!r1.kept) { v.insight = r1.insight; v.solution = r1.solution; v.sol_flag = ''; }
          } catch(e) {}
        }
        if ((v.over || []).length) {
          put(Object.assign(v, { running: '학년 도구로 다시 쓰는 중…' })); vSlotRefresh(no, lv);
          try {
            var r2 = await vApiGen({ mode:'resol2', statement:v.statement, answer:v.answer,
                                     over:v.over, grade_label:label });
            if (!r2.kept) { v.insight = r2.insight; v.solution = r2.solution;
                            v.sol_flag = ''; v.over = []; }
          } catch(e) {}
        }
      }
    }
    delete v.running;
    put(v);
    if (v.base_think != null) { g.base_think = v.base_think; g.base_calc = v.base_calc; }
  } catch(e) {
    put({ level: lv, impossible: '호출 실패: ' + (e.message || e) });
  }
  vSlotRefresh(no, lv);
  try { await vParsedSave(d); } catch(e) { console.warn('저장 실패', e); }
}

async function vGenAll(){
  if (vGenBusy) return;
  vGenBusy = true;
  var list = vParsed.probs.map(function(p){ return String(p.number); });
  var total = list.length * LEVELS.length, done = 0;
  outer:
  for (var i = 0; i < list.length; i++) {
    for (var j = 0; j < LEVELS.length; j++) {
      if (!vDoc() || vTabNow !== 'make') break outer;
      var no = list[i], lv = LEVELS[j];
      done++;
      var v = vSlot(no, lv);
      if (v && !v.impossible && !v.running) continue;   /* 이미 있으면 건너뜀 */
      var msg = $('genmsg');
      if (msg) msg.textContent = no + '번 ' + lv + ' (' + done + '/' + total + ') 작업 중…';
      await vGenLevel(no, lv);
    }
  }
  vGenBusy = false;
  var msg2 = $('genmsg');
  if (msg2) msg2.textContent = '끝났습니다.';
}

/* ══════════════════════════════════════════════════════════
   3 · 문제집 내보내기
════════════════════════════════════════════════════════════ */
async function vRenderExport(d){
  if (!vParsed) { vParsed = await vParsedLoad(d); if (vDocId !== d.id) return; }
  var gen = (vParsed || {}).gen || {};
  var rows = [], nv = 0, nok = 0, nfig = 0;
  Object.keys(gen).sort(function(a, b){ return a - b; }).forEach(function(no){
    var vs = (gen[no].variants || []).filter(function(v){
      return (v.statement || '').trim() && !v.impossible; });
    var ok = vs.filter(function(v){ return (v.check || {}).agree === '일치'; }).length;
    var fig = vs.filter(function(v){ return v.figure_need && v.figure_need !== 'none'; }).length;
    nv += vs.length; nok += ok; nfig += fig;
    rows.push('<tr><td style="padding:3px 10px">' + no + '번</td><td>' + vs.length
      + '개</td><td>' + ok + '</td><td>' + fig + '</td></tr>');
  });
  if (!nv) {
    $('body').innerHTML = '<div class="empty">아직 만든 변형이 없습니다 — [2 · 변형 만들기] 부터.</div>';
    return;
  }
  $('body').innerHTML =
      '<div class="note">원문과 변형을 2단으로 놓고 해설·검산 결과를 미주로 붙인 hwpx 를 만듭니다.'
    + ' 원문 그림·해설 그림은 원본에서 그대로 가져옵니다. 내려받아 한/글에서 열면 됩니다.</div>'
    + '<div style="font-size:13px;margin-bottom:10px">변형 <b>' + nv + '</b>개 · 검산 일치 <b>'
    + nok + '</b>개 · 그림 손 필요 <b>' + nfig + '</b>곳</div>'
    + '<table style="font-size:12px;border-collapse:collapse;margin-bottom:14px">'
    + '<tr style="color:var(--mut)"><td style="padding:3px 10px">문항</td><td>변형</td>'
    + '<td>일치</td><td>그림</td></tr>' + rows.join('') + '</table>'
    + '<button class="pri" id="btn-build" onclick="vBuild()">문제집 만들기 (hwpx)</button>'
    + ' <span class="mut" style="font-size:12px" id="buildmsg"></span>';
}

async function vBuild(){
  var d = vDoc();
  var btn = $('btn-build'), msg = $('buildmsg');
  btn.disabled = true; msg.textContent = '만드는 중… (10초 안팎)';
  try {
    var url = await vSignedUrl(d.file_path);
    var title = (d.title || '포텐셜') + ' — 변형문제집';
    var r = await fetch(API_BUILD, { method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ url:url, title:title, gen:vParsed.gen }) });
    var j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
    var bin = atob(j.hwpx_b64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var blob = new Blob([arr], { type:'application/haansofthwpx' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = title.replace(/[\\/:*?"<>|]/g, '') + '.hwpx';
    a.click();
    URL.revokeObjectURL(a.href);
    msg.textContent = '내려받았습니다 — ' + Math.round(j.size / 1024) + ' KB · 문항 '
      + j.stats.items + ' · 미주 ' + j.stats.notes + ' · 그림 ' + j.stats.pics;
  } catch(e) {
    msg.textContent = '실패: ' + (e.message || e);
  } finally { btn.disabled = false; }
}

/* ── 휴지통 ─────────────────────────────────────────────── */
async function vTrash(){
  if (!confirm('휴지통으로 옮길까요? 나중에 되살릴 수 있습니다.')) return;
  await db.from('variant_docs').update({ deleted_at: new Date().toISOString() }).eq('id', vDocId);
  vDocId = null; vLoadDocs(); vRenderBody();
}
async function vRestore(){
  await db.from('variant_docs').update({ deleted_at: null }).eq('id', vDocId);
  vLoadDocs(); vRenderBody();
}

/* ── 올리기 ─────────────────────────────────────────────── */
function vOpenUpload(){ $('upmask').classList.add('on'); }
function vCloseUpload(){ $('upmask').classList.remove('on'); }

function vPick(f){
  vPick_ = f || null;
  $('fileinfo').textContent = f ? (f.name + ' · ' + (f.size / 1048576).toFixed(1) + ' MB') : '';
  if (f && !$('u-title').value) $('u-title').value = f.name.replace(/\.[^.]+$/, '');
  /* [중3][8월_2회] 같은 제목이면 학년·회차를 미리 채운다 */
  if (f) {
    var g = f.name.match(/중\s*([123])/);
    if (g && !$('u-grade').value) $('u-grade').value = '중' + g[1];
    var r = f.name.match(/(\d{1,2})월[_\s]*(\d)회/);
    if (r && !$('u-round').value) $('u-round').value = r[1] + '월 ' + r[2] + '회';
  }
}
(function(){
  var d = $('drop');
  ['dragenter','dragover'].forEach(function(e){ d.addEventListener(e, function(ev){
    ev.preventDefault(); d.classList.add('on'); }); });
  ['dragleave','drop'].forEach(function(e){ d.addEventListener(e, function(ev){
    ev.preventDefault(); d.classList.remove('on'); }); });
  d.addEventListener('drop', function(ev){ vPick((ev.dataTransfer.files || [])[0]); });
})();

function vProg(msg, pct){
  $('upprog').style.display = '';
  $('upmsg').textContent = msg;
  $('upbar').style.width = (pct || 0) + '%';
}

async function vUpload(){
  if (!vPick_) { alert('파일을 골라주세요.'); return; }
  if (!/\.hwpx$/i.test(vPick_.name)) {
    alert(/\.hwp$/i.test(vPick_.name)
      ? '.hwp 는 한/글에서 [다른 이름으로 저장 → HWPX] 로 변환해서 올려주세요.'
      : 'hwpx 파일만 올릴 수 있습니다.');
    return;
  }
  var title = ($('u-title').value || '').trim();
  if (!title) { alert('제목을 적어주세요.'); return; }

  $('upgo').disabled = true;
  try {
    vProg('문서 등록 중…', 5);
    var ins = await db.from('variant_docs').insert({
      title: title,
      subject: '포텐셜',
      unit: ($('u-unit').value || '').trim() || null,
      grade: $('u-grade').value || null,
      round: ($('u-round').value || '').trim() || null,
      year: $('u-year').value ? Number($('u-year').value) : null,
      source_type: '교재',
      file_kind: 'hwpx',
      status: '올림',
      branch_id: vUser.branch_id || null,
      created_by: vUser.id
    }).select('id').single();
    if (ins.error) throw ins.error;
    var docId = ins.data.id;

    vProg('원본 올리는 중…', 40);
    var srcPath = 'docs/' + docId + '.hwpx';
    var up = await db.storage.from(BUCKET).upload(srcPath, vPick_, { upsert: true });
    if (up.error) throw up.error;

    var upd = await db.from('variant_docs').update({
      file_path: srcPath, updated_at: new Date().toISOString() }).eq('id', docId);
    if (upd.error) throw upd.error;

    vProg('끝났습니다.', 100);
    vCloseUpload();
    vPick_ = null; $('fileinfo').textContent = ''; $('upprog').style.display = 'none';
    await vLoadDocs(); vSelect(docId);
  } catch(e) {
    vProg('실패: ' + (e.message || e), 0);
    alert('올리기 실패\n\n' + (e.message || e));
  } finally { $('upgo').disabled = false; }
}

vAuth();
</script>
