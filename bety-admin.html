<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BMAPS · 베티 OMR 관리 [v0.1-setup]</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif;
         background: #f1f5f9; color: #1e293b; -webkit-text-size-adjust: 100%; }
  button { font-family: inherit; touch-action: manipulation; cursor: pointer; }
  input, select, textarea { font-family: inherit; }

  /* ===== 상단바 ===== */
  .ba-top { position: sticky; top: 0; z-index: 50; background: linear-gradient(135deg,#1e3a5f,#0369a1);
            color: #fff; display: flex; align-items: center; gap: 12px; padding: 11px 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .ba-title { font-size: 16px; font-weight: 800; }
  .ba-ver { font-size: 11px; background: rgba(255,255,255,.2); padding: 2px 8px; border-radius: 100px; font-weight: 700; }
  .ba-who { margin-left: auto; font-size: 12px; opacity: .9; }
  .ba-back { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); color: #fff;
             border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; }

  .ba-wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card-t { font-size: 14px; font-weight: 800; color: #0f172a; margin-bottom: 10px; display: flex;
            align-items: center; gap: 8px; flex-wrap: wrap; }
  .hint { font-size: 12px; color: #64748b; line-height: 1.6; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .btn { border: 1.5px solid #cbd5e1; background: #fff; color: #334155; border-radius: 8px;
         padding: 7px 13px; font-size: 13px; font-weight: 700; }
  .btn:hover { background: #f8fafc; }
  .btn-primary { background: #0369a1; border-color: #0369a1; color: #fff; }
  .btn-primary:hover { background: #075985; }
  .btn-danger { background: #fef2f2; border-color: #fca5a5; color: #dc2626; }
  .btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 7px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .inp { padding: 7px 10px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none; }
  .inp:focus { border-color: #0369a1; }

  /* ===== 시험지 카드 ===== */
  .ex-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(232px,1fr)); gap: 10px; }
  .ex-card { border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 12px; background: #fff; }
  .ex-card.on { border-color: #0369a1; box-shadow: 0 0 0 2px rgba(3,105,161,.15); }
  .ex-name { font-size: 14px; font-weight: 800; color: #0f172a; }
  .ex-meta { font-size: 11.5px; color: #64748b; margin-top: 3px; line-height: 1.6; }
  .ex-badge { font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 5px; }
  .bg-pub { background: #dcfce7; color: #15803d; }
  .bg-draft { background: #fef3c7; color: #92400e; }
  .bg-warn { background: #fee2e2; color: #dc2626; }

  /* ===== 탭 ===== */
  .tabs { display: flex; gap: 4px; background: #f1f5f9; padding: 4px; border-radius: 10px; margin-bottom: 12px; }
  .tabs button { flex: 1; border: none; background: transparent; color: #64748b; font-size: 13px;
                 font-weight: 700; padding: 8px; border-radius: 7px; }
  .tabs button.on { background: #fff; color: #0369a1; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  /* ===== 문항 표 ===== */
  .qt-wrap { max-height: 460px; overflow: auto; border: 1px solid #e2e8f0; border-radius: 10px; }
  table.qt { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.qt th { position: sticky; top: 0; background: #f8fafc; z-index: 1; font-size: 12px;
                font-weight: 800; color: #475569; padding: 8px 6px; border-bottom: 1.5px solid #e2e8f0; }
  table.qt td { padding: 5px 6px; border-bottom: 1px solid #f1f5f9; text-align: center; }
  table.qt tr.ex-off td { background: #f8fafc; color: #94a3b8; }
  .qt-no { font-weight: 800; color: #334155; width: 52px; }
  .qt-inp { width: 68px; padding: 5px 7px; border: 1.5px solid #cbd5e1; border-radius: 6px;
            font-size: 13px; text-align: center; outline: none; }
  .qt-inp:focus { border-color: #0369a1; }
  .qt-sel { padding: 5px 6px; border: 1.5px solid #cbd5e1; border-radius: 6px; font-size: 12.5px; outline: none; }
  .qt-url { width: 100%; max-width: 340px; padding: 5px 7px; border: 1.5px solid #cbd5e1;
            border-radius: 6px; font-size: 12px; outline: none; }

  .sum-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 12px;
             border-radius: 9px; font-size: 13px; font-weight: 700; margin-top: 10px; }
  .sum-ok { background: #f0fdf4; color: #15803d; border: 1.5px solid #86efac; }
  .sum-bad { background: #fef2f2; color: #dc2626; border: 1.5px solid #fca5a5; }

  textarea.paste { width: 100%; min-height: 110px; padding: 10px; border: 1.5px solid #cbd5e1;
                   border-radius: 9px; font-size: 13px; font-family: ui-monospace, Menlo, monospace;
                   outline: none; resize: vertical; }

  /* ===== 모달 ===== */
  .ov { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none;
        align-items: center; justify-content: center; z-index: 9999; padding: 16px; }
  .ov.open { display: flex; }
  .ov-card { background: #fff; border-radius: 14px; padding: 20px 22px; width: 400px; max-width: 100%;
             max-height: 90vh; overflow: auto; box-shadow: 0 18px 50px rgba(0,0,0,.25); }
  .ov-card h3 { font-size: 16px; margin-bottom: 4px; }
  .frow { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .frow label { width: 78px; font-size: 13px; font-weight: 700; color: #334155; flex-shrink: 0; }
  .frow .inp, .frow select { flex: 1; }
  .msg { font-size: 12.5px; font-weight: 700; min-height: 18px; margin: 4px 0 10px; color: #0369a1; }
  .msg.err { color: #dc2626; }

  /* ===== 인증 차단 ===== */
  .blocker { position: fixed; inset: 0; background: #0f172a; display: none;
             align-items: center; justify-content: center; z-index: 99999; padding: 16px; }
  .blocker.open { display: flex; }
  .bk { background: #fff; border-radius: 14px; padding: 28px 26px; max-width: 380px; text-align: center; }
  .bk h3 { font-size: 17px; margin-bottom: 10px; }
  .bk p { font-size: 13px; color: #475569; line-height: 1.7; margin-bottom: 16px; }

  .empty { padding: 30px; text-align: center; color: #94a3b8; font-size: 13px; }
</style>
</head>
<body>

<div class="ba-top">
  <span class="ba-title">📝 베티 OMR 관리</span>
  <span class="ba-ver" id="ba-ver">v0.1-setup</span>
  <span class="ba-who" id="ba-who"></span>
  <button class="ba-back" onclick="location.href='index.html'">← BMAPS</button>
</div>

<div class="ba-wrap">

  <!-- 회차 선택 -->
  <div class="card">
    <div class="card-t">1️⃣ 회차 선택</div>
    <div class="row">
      <select class="inp" id="ba-session" onchange="baOnSessionPick()" style="min-width:220px">
        <option value="">회차를 선택하세요</option>
      </select>
      <span class="hint">또는 날짜 직접 입력</span>
      <input type="date" class="inp" id="ba-date" onchange="baLoadExams()">
      <button class="btn" onclick="baLoadExams()">🔄 불러오기</button>
    </div>
  </div>

  <!-- 시험지 목록 -->
  <div class="card">
    <div class="card-t">2️⃣ 시험지
      <button class="btn btn-primary btn-sm" onclick="baOpenExamModal(null)">+ 시험지 추가</button>
    </div>
    <div id="ba-exams"><div class="empty">회차를 먼저 선택해주세요</div></div>
  </div>

  <!-- 세팅 -->
  <div class="card" id="ba-editor" style="display:none">
    <div class="card-t">3️⃣ <span id="ba-editor-title">세팅</span>
      <span id="ba-editor-badge"></span>
      <button class="btn btn-sm" onclick="baOpenExamModal(_ba.exam)">⚙ 시험지 정보</button>
      <button class="btn btn-sm btn-danger" onclick="baDeleteExam()">🗑 삭제</button>
    </div>

    <div class="tabs">
      <button id="ba-tab-q" class="on" onclick="baTab('q')">문항 · 정답 · 배점</button>
      <button id="ba-tab-y" onclick="baTab('y')">해설 링크</button>
      <button id="ba-tab-s" onclick="baTab('s')">응시 현황</button>
    </div>

    <!-- 문항 탭 -->
    <div id="ba-pane-q">
      <div class="row" style="margin-bottom:10px">
        <button class="btn btn-sm" onclick="baBulkType('short')">선택 범위 → 주관식</button>
        <button class="btn btn-sm" onclick="baBulkType('choice')">선택 범위 → 객관식</button>
        <button class="btn btn-sm" onclick="baBulkPoints()">배점 일괄</button>
        <button class="btn btn-sm" onclick="baBulkExclude()">제외 일괄</button>
        <button class="btn btn-sm" onclick="baCopyFrom()">📋 다른 회차에서 복사</button>
      </div>
      <div class="qt-wrap"><table class="qt" id="ba-qt"></table></div>
      <div class="sum-bar" id="ba-sum"></div>

      <div style="margin-top:12px">
        <div class="hint" style="margin-bottom:6px">
          <b>엑셀 붙여넣기</b> — 한 줄에 <code>번호 ⇥ 정답 ⇥ 배점</code> (4번째 칸에 <code>객</code>/<code>주</code> 선택)<br>
          정답이 <b>6 이상</b>이면 주관식으로 자동 전환됩니다. 빈 칸은 기존 값을 유지합니다.
        </div>
        <textarea class="paste" id="ba-paste-q" placeholder="1&#9;3&#9;2&#10;2&#9;5&#9;3&#10;22&#9;144&#9;4&#9;주"></textarea>
        <div class="row" style="margin-top:8px">
          <button class="btn" onclick="baPasteQuestions()">📥 표에 적용</button>
          <button class="btn btn-primary" onclick="baSaveQuestions()">💾 문항 저장</button>
          <span class="msg" id="ba-msg-q"></span>
        </div>
      </div>
    </div>

    <!-- 해설 탭 -->
    <div id="ba-pane-y" style="display:none">
      <div class="qt-wrap"><table class="qt" id="ba-yt"></table></div>
      <div style="margin-top:12px">
        <div class="hint" style="margin-bottom:6px">
          <b>붙여넣기</b> — 한 줄에 <code>번호 ⇥ 유튜브URL</code>
        </div>
        <textarea class="paste" id="ba-paste-y" placeholder="1&#9;https://youtu.be/xxxxx&#10;2&#9;https://youtu.be/yyyyy"></textarea>
        <div class="row" style="margin-top:8px">
          <button class="btn" onclick="baPasteYoutube()">📥 표에 적용</button>
          <button class="btn btn-primary" onclick="baSaveYoutube()">💾 해설 링크 저장</button>
          <span class="msg" id="ba-msg-y"></span>
        </div>
      </div>
    </div>

    <!-- 응시 현황 탭 -->
    <div id="ba-pane-s" style="display:none">
      <div class="row" style="margin-bottom:10px">
        <button class="btn btn-sm" onclick="baLoadSubs()">🔄 새로고침</button>
        <span class="hint" id="ba-sub-sum"></span>
      </div>
      <div class="qt-wrap"><table class="qt" id="ba-st"></table></div>
    </div>
  </div>
</div>

<!-- 시험지 추가/수정 모달 -->
<div class="ov" id="ba-ex-ov" onclick="if(event.target===this)baCloseExamModal()">
  <div class="ov-card">
    <h3 id="ba-ex-title">시험지 추가</h3>
    <div class="hint" style="margin-bottom:12px">레벨을 고르면 기본값이 자동으로 채워집니다</div>
    <div class="frow"><label>레벨</label>
      <select class="inp" id="ba-ex-level" onchange="baLevelDefaults()">
        <option value="실전모고">실전모고</option>
        <option value="준킬러">준킬러</option>
        <option value="80점">80점</option>
      </select>
    </div>
    <div class="frow"><label>학교급</label>
      <select class="inp" id="ba-ex-slevel">
        <option value="high">고등</option>
        <option value="middle">중등</option>
        <option value="">무관</option>
      </select>
    </div>
    <div class="frow"><label>학년</label>
      <select class="inp" id="ba-ex-grade">
        <option value="">무관 (전 학년)</option>
        <option value="1">1학년</option>
        <option value="2">2학년</option>
        <option value="3">3학년</option>
      </select>
    </div>
    <div class="frow"><label>문항 수</label><input type="number" class="inp" id="ba-ex-qcnt" min="1" max="100"></div>
    <div class="frow"><label>만점</label><input type="number" class="inp" id="ba-ex-total" min="1"></div>
    <div class="frow"><label>가산점</label><input type="number" class="inp" id="ba-ex-bonus" min="0"></div>
    <div class="frow"><label>발행</label>
      <select class="inp" id="ba-ex-pub">
        <option value="false">미발행 (학생 응시 불가)</option>
        <option value="true">발행 (학생 응시 가능)</option>
      </select>
    </div>
    <div class="msg" id="ba-ex-msg"></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" onclick="baCloseExamModal()">닫기</button>
      <button class="btn btn-primary" id="ba-ex-save" onclick="baSaveExam()">저장</button>
    </div>
  </div>
</div>

<!-- 인증 차단 -->
<div class="blocker" id="ba-blocker">
  <div class="bk">
    <h3>🔒 관리자 인증</h3>
    <p id="ba-bk-msg">베티 OMR 관리는 <b>관리자·데스크 계정</b>만 사용할 수 있습니다.<br>BMAPS에 로그인한 뒤 다시 들어와주세요.</p>
    <button class="btn btn-primary" onclick="location.href='index.html'">← BMAPS로 이동</button>
  </div>
</div>

<script>
/* ============================================================
   [BETY OMR ADMIN] 정답·배점·해설 세팅 + 응시 현황
   ─ 모든 DB 접근은 RPC 경유 (bety_omr_* 테이블은 RLS로 직접 접근 차단)
   ─ 인증: localStorage.savedUserId → users.role (admin | desk)
============================================================ */
const SUPABASE_URL = 'https://qtpftloyumtffvgurvqv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XGP9n-2fuBQFuJlAA5MJ8w_R8JYIi9O';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

window.BETY_ADMIN_VERSION = 'v0.1-setup';
console.log('BETY-ADMIN build:', window.BETY_ADMIN_VERSION);

/* 레벨별 기본값 */
const LV_DEFAULTS = {
  '실전모고': { qcnt:30, total:100, bonus:0,  slevel:'high',   excluded:[] },
  '준킬러':   { qcnt:18, total:100, bonus:28, slevel:'high',   excluded:[] },
  '80점':     { qcnt:30, total:80,  bonus:0,  slevel:'middle', excluded:[20,21,28,29,30] }
};

var _ba = { user:null, date:'', exams:[], exam:null, questions:[], tab:'q' };

function baEsc(v){ return String(v==null?'':v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function baMsg(id, text, isErr){
  var el=document.getElementById(id); if(!el) return;
  el.textContent=text||''; el.classList.toggle('err', !!isErr);
}

/* ── 인증 ───────────────────────────────────────────────── */
async function baBoot(){
  var savedId=null;
  try { savedId = localStorage.getItem('savedUserId'); } catch(e){}
  if(!savedId){ baBlock('로그인 정보가 없습니다. BMAPS에 먼저 로그인해주세요.'); return; }
  try {
    var r = await db.from('users').select('id,name,role').eq('id', savedId).maybeSingle();
    if(r.error || !r.data){ baBlock('계정을 확인할 수 없습니다.'); return; }
    if(r.data.role !== 'admin' && r.data.role !== 'desk'){
      baBlock('관리자·데스크 계정만 사용할 수 있습니다. (현재: ' + baEsc(r.data.role) + ')'); return;
    }
    _ba.user = r.data;
    document.getElementById('ba-blocker').classList.remove('open');
    document.getElementById('ba-who').textContent = (r.data.name||'') + ' · ' + r.data.role;
    await baLoadSessions();
  } catch(e){ baBlock('인증 중 오류: ' + (e.message||e)); }
}
function baBlock(msg){
  var m=document.getElementById('ba-bk-msg'); if(m && msg) m.innerHTML = baEsc(msg);
  document.getElementById('ba-blocker').classList.add('open');
}

/* ── 회차 목록 ──────────────────────────────────────────── */
async function baLoadSessions(){
  try {
    var r = await db.from('weekend_sessions').select('*').eq('program','bety');
    if(r.error) throw r.error;
    var rows = (r.data||[]).slice().sort(function(a,b){
      return String(b.session_date||'').localeCompare(String(a.session_date||''));
    });
    var sel = document.getElementById('ba-session');
    sel.innerHTML = '<option value="">회차를 선택하세요</option>' + rows.map(function(s){
      var label = s.session_date + (s.round_no ? ('  ·  ' + s.round_no + '회차') : '')
                + (s.is_closed ? '  (휴강)' : '');
      return '<option value="'+baEsc(s.session_date)+'">'+baEsc(label)+'</option>';
    }).join('');
  } catch(e){ console.error('회차 로드 실패:', e); }
}
function baOnSessionPick(){
  var v = document.getElementById('ba-session').value;
  if(v){ document.getElementById('ba-date').value = v; baLoadExams(); }
}

/* ── 시험지 목록 ────────────────────────────────────────── */
async function baLoadExams(){
  var date = document.getElementById('ba-date').value;
  var box = document.getElementById('ba-exams');
  if(!date){ box.innerHTML='<div class="empty">회차를 먼저 선택해주세요</div>'; return; }
  _ba.date = date;
  box.innerHTML = '<div class="empty">불러오는 중...</div>';
  try {
    var r = await db.rpc('bety_omr_list_exams', { p_actor_id:_ba.user.id, p_session_date:date });
    if(r.error) throw r.error;
    _ba.exams = r.data || [];
    baRenderExams();
  } catch(e){
    box.innerHTML = '<div class="empty" style="color:#dc2626">불러오기 실패: '+baEsc(e.message||e)+'</div>';
  }
}
function baExamName(e){
  var g = (e.grade==null) ? '전학년' : (e.grade + '학년');
  var sl = e.school_level==='middle' ? '중등' : (e.school_level==='high' ? '고등' : '');
  return (sl?sl+' ':'') + g + ' · ' + e.level;
}
function baRenderExams(){
  var box = document.getElementById('ba-exams');
  if(!_ba.exams.length){
    box.innerHTML = '<div class="empty">이 회차에 등록된 시험지가 없습니다. [+ 시험지 추가]를 눌러주세요</div>';
    document.getElementById('ba-editor').style.display='none';
    return;
  }
  box.innerHTML = '<div class="ex-grid">' + _ba.exams.map(function(e){
    var need = e.total_score - e.bonus_points;
    var ok = (e.saved_q > 0) && (e.points_sum === need);
    var badge = e.is_published
      ? '<span class="ex-badge bg-pub">발행</span>'
      : '<span class="ex-badge bg-draft">미발행</span>';
    var warn = ok ? '' : ' <span class="ex-badge bg-warn">배점 확인</span>';
    return '<div class="ex-card '+(_ba.exam && _ba.exam.id===e.id?'on':'')+'" onclick="baOpenExam(\''+e.id+'\')">'
      + '<div class="ex-name">'+baEsc(baExamName(e))+'</div>'
      + '<div class="ex-meta">'+badge+warn+'</div>'
      + '<div class="ex-meta">문항 '+e.saved_q+'/'+e.question_count+' · 배점합 '+e.points_sum
        + (e.bonus_points?(' + 가산 '+e.bonus_points):'') + ' / 만점 '+e.total_score+'</div>'
      + '<div class="ex-meta">해설 '+e.youtube_cnt+'개 · 응시 '+e.submit_cnt+'명</div>'
      + '</div>';
  }).join('') + '</div>';
}

/* ── 시험지 추가/수정 모달 ──────────────────────────────── */
function baLevelDefaults(){
  var lv = document.getElementById('ba-ex-level').value;
  var d = LV_DEFAULTS[lv]; if(!d) return;
  document.getElementById('ba-ex-qcnt').value  = d.qcnt;
  document.getElementById('ba-ex-total').value = d.total;
  document.getElementById('ba-ex-bonus').value = d.bonus;
  document.getElementById('ba-ex-slevel').value = d.slevel;
  if(lv === '80점') document.getElementById('ba-ex-grade').value = '';
}
function baOpenExamModal(exam){
  if(!_ba.date){ alert('회차를 먼저 선택해주세요'); return; }
  baMsg('ba-ex-msg','');
  document.getElementById('ba-ex-title').textContent = exam ? '시험지 정보 수정' : '시험지 추가';
  if(exam){
    document.getElementById('ba-ex-level').value  = exam.level;
    document.getElementById('ba-ex-slevel').value = exam.school_level || '';
    document.getElementById('ba-ex-grade').value  = (exam.grade==null) ? '' : String(exam.grade);
    document.getElementById('ba-ex-qcnt').value   = exam.question_count;
    document.getElementById('ba-ex-total').value  = exam.total_score;
    document.getElementById('ba-ex-bonus').value  = exam.bonus_points;
    document.getElementById('ba-ex-pub').value    = exam.is_published ? 'true' : 'false';
  } else {
    document.getElementById('ba-ex-level').value = '실전모고';
    document.getElementById('ba-ex-grade').value = '1';
    document.getElementById('ba-ex-pub').value   = 'false';
    baLevelDefaults();
  }
  document.getElementById('ba-ex-ov').classList.add('open');
}
function baCloseExamModal(){ document.getElementById('ba-ex-ov').classList.remove('open'); }

async function baSaveExam(){
  var lv    = document.getElementById('ba-ex-level').value;
  var sl    = document.getElementById('ba-ex-slevel').value;
  var gRaw  = document.getElementById('ba-ex-grade').value;
  var qcnt  = parseInt(document.getElementById('ba-ex-qcnt').value, 10);
  var total = parseInt(document.getElementById('ba-ex-total').value, 10);
  var bonus = parseInt(document.getElementById('ba-ex-bonus').value, 10);
  var pub   = document.getElementById('ba-ex-pub').value === 'true';
  if(!qcnt || qcnt < 1){ baMsg('ba-ex-msg','문항 수를 입력하세요', true); return; }
  if(!total || total < 1){ baMsg('ba-ex-msg','만점을 입력하세요', true); return; }
  if(isNaN(bonus) || bonus < 0) bonus = 0;

  var btn = document.getElementById('ba-ex-save');
  btn.disabled = true; btn.textContent = '저장중...';
  try {
    var r = await db.rpc('bety_omr_upsert_exam', {
      p_actor_id: _ba.user.id, p_session_date: _ba.date,
      p_grade: gRaw === '' ? null : parseInt(gRaw,10),
      p_school_level: sl === '' ? null : sl,
      p_level: lv, p_question_count: qcnt, p_total_score: total,
      p_bonus_points: bonus, p_is_published: pub
    });
    if(r.error) throw r.error;
    baCloseExamModal();
    await baLoadExams();
    await baOpenExam(r.data);
  } catch(e){
    baMsg('ba-ex-msg','저장 실패: ' + (e.message||e), true);
  } finally {
    btn.disabled = false; btn.textContent = '저장';
  }
}

async function baDeleteExam(){
  if(!_ba.exam) return;
  if(!confirm(baExamName(_ba.exam) + ' 시험지를 삭제할까요?\n(문항·해설 링크가 모두 삭제됩니다)')) return;
  try {
    var r = await db.rpc('bety_omr_delete_exam', { p_actor_id:_ba.user.id, p_exam_id:_ba.exam.id });
    if(r.error) throw r.error;
    if(!r.data || r.data.ok === false){
      alert(r.data && r.data.reason === 'has_submissions'
        ? '이미 응시한 학생이 있어 삭제할 수 없습니다.\n먼저 응시 현황에서 제출을 초기화하세요.'
        : '삭제하지 못했습니다.');
      return;
    }
    _ba.exam = null;
    document.getElementById('ba-editor').style.display = 'none';
    await baLoadExams();
  } catch(e){ alert('삭제 실패: ' + (e.message||e)); }
}

/* ── 시험지 열기 ────────────────────────────────────────── */
async function baOpenExam(examId){
  var ex = _ba.exams.find(function(x){ return x.id === examId; });
  if(!ex) return;
  _ba.exam = ex;
  baRenderExams();
  document.getElementById('ba-editor').style.display = '';
  document.getElementById('ba-editor-title').textContent = baExamName(ex) + ' 세팅';
  document.getElementById('ba-editor-badge').innerHTML = ex.is_published
    ? '<span class="ex-badge bg-pub">발행</span>' : '<span class="ex-badge bg-draft">미발행</span>';
  baMsg('ba-msg-q',''); baMsg('ba-msg-y','');
  await baLoadQuestions();
  baTab('q');
}

async function baLoadQuestions(){
  try {
    var r = await db.rpc('bety_omr_get_questions', { p_actor_id:_ba.user.id, p_exam_id:_ba.exam.id });
    if(r.error) throw r.error;
    var saved = {};
    (r.data||[]).forEach(function(q){ saved[q.q_no] = q; });
    var d = LV_DEFAULTS[_ba.exam.level] || { excluded:[] };
    var isNew = !(r.data||[]).length;
    _ba.questions = [];
    for(var i=1; i<=_ba.exam.question_count; i++){
      var s = saved[i];
      _ba.questions.push({
        q_no: i,
        q_type: s ? s.q_type : 'choice',
        answer: s ? (s.answer||'') : '',
        points: s ? s.points : 0,
        is_excluded: s ? !!s.is_excluded : (isNew && d.excluded.indexOf(i) !== -1),
        youtube_url: s ? (s.youtube_url||'') : ''
      });
    }
    baRenderQT(); baRenderYT();
  } catch(e){
    baMsg('ba-msg-q','문항 로드 실패: ' + (e.message||e), true);
  }
}

/* ── 문항 표 ────────────────────────────────────────────── */
function baRenderQT(){
  var t = document.getElementById('ba-qt');
  var head = '<thead><tr><th class="qt-no">번호</th><th>유형</th><th>정답</th><th>배점</th><th>제외</th></tr></thead>';
  var body = _ba.questions.map(function(q, i){
    var ansCell;
    if(q.q_type === 'choice'){
      var opts = ['','1','2','3','4','5'].map(function(v){
        return '<option value="'+v+'"'+(String(q.answer)===v?' selected':'')+'>'+(v||'-')+'</option>';
      }).join('');
      ansCell = '<select class="qt-sel" onchange="baQEdit('+i+',\'answer\',this.value)"'
              + (q.is_excluded?' disabled':'') + '>' + opts + '</select>';
    } else {
      ansCell = '<input class="qt-inp" inputmode="numeric" maxlength="3" value="'+baEsc(q.answer)+'"'
              + (q.is_excluded?' disabled':'')
              + ' oninput="baQEdit('+i+',\'answer\',this.value)" placeholder="0~999">';
    }
    return '<tr class="'+(q.is_excluded?'ex-off':'')+'">'
      + '<td class="qt-no">'+q.q_no+'</td>'
      + '<td><select class="qt-sel" onchange="baQEdit('+i+',\'q_type\',this.value)"'+(q.is_excluded?' disabled':'')+'>'
        + '<option value="choice"'+(q.q_type==='choice'?' selected':'')+'>객관식</option>'
        + '<option value="short"'+(q.q_type==='short'?' selected':'')+'>주관식</option></select></td>'
      + '<td>'+ansCell+'</td>'
      + '<td><input class="qt-inp" type="number" min="0" value="'+(q.points||0)+'"'
        + (q.is_excluded?' disabled':'') + ' oninput="baQEdit('+i+',\'points\',this.value)"></td>'
      + '<td><input type="checkbox" '+(q.is_excluded?'checked':'')
        + ' onchange="baQEdit('+i+',\'is_excluded\',this.checked)"></td>'
      + '</tr>';
  }).join('');
  t.innerHTML = head + '<tbody>' + body + '</tbody>';
  baRenderSum();
}
function baQEdit(i, field, val){
  var q = _ba.questions[i]; if(!q) return;
  if(field === 'points') q.points = parseInt(val,10) || 0;
  else if(field === 'is_excluded'){ q.is_excluded = !!val; baRenderQT(); return; }
  else if(field === 'q_type'){ q.q_type = val; q.answer = ''; baRenderQT(); return; }
  else q[field] = val;
  baRenderSum();
}
function baRenderSum(){
  var ex = _ba.exam; if(!ex) return;
  var sum = _ba.questions.reduce(function(a,q){ return a + (q.is_excluded ? 0 : (q.points||0)); }, 0);
  var computed = sum + (ex.bonus_points||0);
  var ok = computed === ex.total_score;
  var noAns = _ba.questions.filter(function(q){ return !q.is_excluded && !String(q.answer||'').trim(); }).length;
  var el = document.getElementById('ba-sum');
  el.className = 'sum-bar ' + (ok ? 'sum-ok' : 'sum-bad');
  el.innerHTML = (ok ? '✅' : '⚠️')
    + ' 배점합 <b>' + sum + '</b>'
    + (ex.bonus_points ? (' + 가산 <b>' + ex.bonus_points + '</b>') : '')
    + ' = <b>' + computed + '</b> / 만점 <b>' + ex.total_score + '</b>'
    + (ok ? '' : ' — 일치하지 않습니다')
    + (noAns ? ('<span style="color:#b45309"> · 정답 미입력 ' + noAns + '문항</span>') : '');
}

/* ── 일괄 도구 ──────────────────────────────────────────── */
function baAskRange(msg){
  var v = prompt(msg + '\n예: 22-30  또는  20,21,28');
  if(!v) return null;
  var set = [];
  v.split(',').forEach(function(chunk){
    chunk = chunk.trim(); if(!chunk) return;
    var m = chunk.match(/^(\d+)\s*-\s*(\d+)$/);
    if(m){ for(var i=parseInt(m[1],10); i<=parseInt(m[2],10); i++) set.push(i); }
    else if(/^\d+$/.test(chunk)) set.push(parseInt(chunk,10));
  });
  return set.length ? set : null;
}
function baBulkType(type){
  var nos = baAskRange((type==='short'?'주관식':'객관식')+'으로 바꿀 문항 번호'); if(!nos) return;
  _ba.questions.forEach(function(q){ if(nos.indexOf(q.q_no)!==-1 && q.q_type!==type){ q.q_type=type; q.answer=''; } });
  baRenderQT();
}
function baBulkPoints(){
  var nos = baAskRange('배점을 바꿀 문항 번호'); if(!nos) return;
  var p = prompt('배점을 입력하세요 (예: 3)');
  var pv = parseInt(p,10); if(isNaN(pv) || pv<0) return;
  _ba.questions.forEach(function(q){ if(nos.indexOf(q.q_no)!==-1) q.points = pv; });
  baRenderQT();
}
function baBulkExclude(){
  var nos = baAskRange('제외할 문항 번호 (다시 실행하면 해제)'); if(!nos) return;
  _ba.questions.forEach(function(q){ if(nos.indexOf(q.q_no)!==-1) q.is_excluded = !q.is_excluded; });
  baRenderQT();
}

/* ── 붙여넣기: 문항 ─────────────────────────────────────── */
function baPasteQuestions(){
  var ta = document.getElementById('ba-paste-q');
  var lines = (ta.value||'').split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
  if(!lines.length){ baMsg('ba-msg-q','붙여넣은 내용이 없습니다', true); return; }
  var applied = 0, skipped = [];
  lines.forEach(function(line){
    var p = line.split(/[\t ]+/);
    var no = parseInt(p[0],10);
    if(!no){ return; }
    var q = _ba.questions.find(function(x){ return x.q_no === no; });
    if(!q){ skipped.push(no); return; }
    var ans = (p[1]||'').trim();
    var pts = (p[2]||'').trim();
    var typ = (p[3]||'').trim();
    if(typ){ q.q_type = /^(주|주관식|short)$/i.test(typ) ? 'short' : 'choice'; }
    if(ans){
      // 정답이 6 이상이면 주관식으로 자동 전환
      if(/^\d+$/.test(ans) && parseInt(ans,10) > 5 && !typ) q.q_type = 'short';
      q.answer = ans;
    }
    if(pts && /^\d+$/.test(pts)) q.points = parseInt(pts,10);
    applied++;
  });
  baRenderQT();
  baMsg('ba-msg-q', applied + '개 문항 적용됨'
    + (skipped.length ? (' · 범위 밖 무시: ' + skipped.join(',')) : '')
    + ' (아직 저장 전입니다)', false);
  ta.value = '';
}

async function baSaveQuestions(){
  if(!_ba.exam) return;
  var rows = _ba.questions.map(function(q){
    return { q_no:q.q_no, q_type:q.q_type, answer:String(q.answer||'').trim(),
             points:q.points||0, is_excluded:!!q.is_excluded };
  });
  baMsg('ba-msg-q','저장중...');
  try {
    var r = await db.rpc('bety_omr_save_questions',
      { p_actor_id:_ba.user.id, p_exam_id:_ba.exam.id, p_rows:rows });
    if(r.error) throw r.error;
    var d = r.data || {};
    baMsg('ba-msg-q', d.valid
      ? ('✓ 저장 완료 — 배점 ' + d.computed + '/' + d.expected)
      : ('저장됨 · ⚠️ 배점 불일치 ' + d.computed + '/' + d.expected), !d.valid);
    await baLoadExams();
    _ba.exam = _ba.exams.find(function(x){ return x.id === _ba.exam.id; }) || _ba.exam;
    baRenderSum();
  } catch(e){ baMsg('ba-msg-q','저장 실패: ' + (e.message||e), true); }
}

/* ── 해설 링크 ──────────────────────────────────────────── */
function baRenderYT(){
  var t = document.getElementById('ba-yt');
  var head = '<thead><tr><th class="qt-no">번호</th><th>유튜브 URL</th></tr></thead>';
  var body = _ba.questions.map(function(q,i){
    return '<tr class="'+(q.is_excluded?'ex-off':'')+'"><td class="qt-no">'+q.q_no+'</td>'
      + '<td><input class="qt-url" value="'+baEsc(q.youtube_url)+'" placeholder="https://youtu.be/..."'
      + ' oninput="_ba.questions['+i+'].youtube_url=this.value"></td></tr>';
  }).join('');
  t.innerHTML = head + '<tbody>' + body + '</tbody>';
}
function baPasteYoutube(){
  var ta = document.getElementById('ba-paste-y');
  var lines = (ta.value||'').split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
  if(!lines.length){ baMsg('ba-msg-y','붙여넣은 내용이 없습니다', true); return; }
  var applied = 0;
  lines.forEach(function(line){
    var p = line.split(/[\t ]+/);
    var no = parseInt(p[0],10); if(!no) return;
    var url = p.slice(1).join(' ').trim(); if(!url) return;
    var q = _ba.questions.find(function(x){ return x.q_no === no; });
    if(q){ q.youtube_url = url; applied++; }
  });
  baRenderYT();
  baMsg('ba-msg-y', applied + '개 적용됨 (아직 저장 전입니다)');
  ta.value = '';
}
async function baSaveYoutube(){
  if(!_ba.exam) return;
  var rows = _ba.questions.map(function(q){
    return { q_no:q.q_no, youtube_url:String(q.youtube_url||'').trim() };
  });
  baMsg('ba-msg-y','저장중...');
  try {
    var r = await db.rpc('bety_omr_save_youtube',
      { p_actor_id:_ba.user.id, p_exam_id:_ba.exam.id, p_rows:rows });
    if(r.error) throw r.error;
    baMsg('ba-msg-y','✓ ' + (r.data||0) + '개 문항 갱신됨');
    await baLoadExams();
  } catch(e){ baMsg('ba-msg-y','저장 실패: ' + (e.message||e), true); }
}

/* ── 다른 회차에서 복사 ─────────────────────────────────── */
async function baCopyFrom(){
  if(!_ba.exam) return;
  var d = prompt('복사해올 회차 날짜를 입력하세요 (YYYY-MM-DD)');
  if(!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)){ return; }
  try {
    var r = await db.rpc('bety_omr_list_exams', { p_actor_id:_ba.user.id, p_session_date:d });
    if(r.error) throw r.error;
    var src = (r.data||[]).find(function(x){
      return x.level === _ba.exam.level
          && String(x.grade) === String(_ba.exam.grade)
          && String(x.school_level||'') === String(_ba.exam.school_level||'');
    });
    if(!src){ alert(d + ' 회차에 같은 조건(' + baExamName(_ba.exam) + ')의 시험지가 없습니다.'); return; }
    var q = await db.rpc('bety_omr_get_questions', { p_actor_id:_ba.user.id, p_exam_id:src.id });
    if(q.error) throw q.error;
    if(!(q.data||[]).length){ alert('복사할 문항이 없습니다.'); return; }
    if(!confirm(d + ' 회차의 문항 ' + q.data.length + '개를 현재 표에 덮어씁니다. 계속할까요?')) return;
    var map = {}; q.data.forEach(function(x){ map[x.q_no] = x; });
    _ba.questions.forEach(function(x){
      var s = map[x.q_no]; if(!s) return;
      x.q_type = s.q_type; x.answer = s.answer||''; x.points = s.points;
      x.is_excluded = !!s.is_excluded; x.youtube_url = s.youtube_url||'';
    });
    baRenderQT(); baRenderYT();
    baMsg('ba-msg-q','복사 완료 (아직 저장 전입니다 — [문항 저장]과 [해설 링크 저장]을 눌러주세요)');
  } catch(e){ alert('복사 실패: ' + (e.message||e)); }
}

/* ── 응시 현황 ──────────────────────────────────────────── */
async function baLoadSubs(){
  if(!_ba.exam) return;
  var t = document.getElementById('ba-st');
  t.innerHTML = '<tbody><tr><td class="empty">불러오는 중...</td></tr></tbody>';
  try {
    var r = await db.rpc('bety_omr_list_submissions', { p_actor_id:_ba.user.id, p_exam_id:_ba.exam.id });
    if(r.error) throw r.error;
    var rows = r.data || [];
    document.getElementById('ba-sub-sum').textContent = '응시 ' + rows.length + '명';
    if(!rows.length){ t.innerHTML = '<tbody><tr><td class="empty">아직 제출한 학생이 없습니다</td></tr></tbody>'; return; }
    t.innerHTML = '<thead><tr><th>이름</th><th>학년</th><th>점수</th><th>맞은 문항</th><th>제출 시각</th><th>초기화</th></tr></thead>'
      + '<tbody>' + rows.map(function(s){
        var at = s.submitted_at ? String(s.submitted_at).replace('T',' ').slice(0,16) : '';
        return '<tr><td><b>'+baEsc(s.name)+'</b></td><td>'+baEsc(s.grade||'')+'</td>'
          + '<td><b>'+s.score+'</b></td><td>'+s.correct_count+'</td><td>'+baEsc(at)+'</td>'
          + '<td><button class="btn btn-sm btn-danger" onclick="baReset(\''+s.student_id+'\',\''
            + baEsc(s.name).replace(/'/g,"\\'")+'\')">초기화</button></td></tr>';
      }).join('') + '</tbody>';
  } catch(e){
    t.innerHTML = '<tbody><tr><td class="empty" style="color:#dc2626">불러오기 실패: '+baEsc(e.message||e)+'</td></tr></tbody>';
  }
}
async function baReset(studentId, name){
  var reason = prompt(name + ' 학생의 제출을 초기화합니다.\n사유를 입력하세요 (기록에 남습니다)');
  if(reason === null) return;
  try {
    var r = await db.rpc('bety_omr_reset', {
      p_actor_id:_ba.user.id, p_exam_id:_ba.exam.id, p_student_id:studentId, p_reason:reason });
    if(r.error) throw r.error;
    if(!r.data || r.data.ok === false){ alert('초기화할 제출 기록이 없습니다.'); return; }
    await baLoadSubs();
    await baLoadExams();
  } catch(e){ alert('초기화 실패: ' + (e.message||e)); }
}

/* ── 탭 ─────────────────────────────────────────────────── */
function baTab(t){
  _ba.tab = t;
  ['q','y','s'].forEach(function(k){
    document.getElementById('ba-tab-'+k).classList.toggle('on', k===t);
    document.getElementById('ba-pane-'+k).style.display = (k===t) ? '' : 'none';
  });
  if(t === 's') baLoadSubs();
}

baBoot();
</script>
