<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMAPS Codex 연결</title><style>
body{font:15px/1.7 'Malgun Gothic',sans-serif;margin:30px;color:#173b43;background:#edf4f5}main{padding:25px;background:white;border-radius:12px}h1{font-size:22px}button{padding:12px 18px;border:0;border-radius:7px;background:#157969;color:white;cursor:pointer;margin:7px 8px 7px 0}button:disabled{opacity:.5;cursor:default}code{overflow-wrap:anywhere}#stop{background:#6d5555}.hint{color:#56737a;font-size:13px}
</style><main><h1>Codex 연결 프로그램</h1><p id="status">프로그램이 실행 중입니다. BMAPS에서 ‘Codex 연결’을 누르세요.</p><p>연결 요청 사이트: <code id="site">없음</code></p><button id="approve" disabled>이 사이트 연결 허용</button><button id="disconnect" disabled>연결 해제</button><p class="hint">허용하면 해당 사이트가 이 PC에서 PDF 분석과 Codex 검토를 요청할 수 있습니다. 주소를 확인하세요. 연결 후 이 창은 최소화해 두세요. 코드를 복사할 필요가 없습니다.</p><hr><button id="stop">처리 프로그램 종료</button><p class="hint">PC가 켜져 있어야 처리됩니다. 이 창을 닫으면 사이트 연결은 끊기지만 프로그램은 계속 실행됩니다.</p></main><script nonce="__NONCE__">
const TOKEN=__TOKEN__;let parentWindow=null,parentOrigin=null,connected=false;const $=id=>document.getElementById(id);
function send(value){if(parentWindow)parentWindow.postMessage(value,parentOrigin)}
async function local(path,method='GET',body){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);try{const r=await fetch(path,{method,headers:{Authorization:'Bearer '+TOKEN,...(body?{'Content-Type':'application/pdf'}:{})},body,signal:controller.signal});const value=await r.json();if(!r.ok)throw Error(value.error||'연결 오류');return value}finally{clearTimeout(timer)}}
addEventListener('message',async e=>{
 if(e.source!==opener||!e.source||!e.data||!e.origin.startsWith('https://'))return;
 const m=e.data;
 if(m.type==='bmaps-connect'){
   if(parentOrigin&&parentOrigin!==e.origin)return;
   parentWindow=e.source;parentOrigin=e.origin;$('site').textContent=e.origin;
   if(connected){send({type:'bmaps-ready'});return}
   $('approve').disabled=false;$('status').textContent='아래 주소가 사용 중인 BMAPS인지 확인한 뒤 연결을 허용하세요.';return;
 }
 if(!connected||e.source!==parentWindow||e.origin!==parentOrigin||m.type!=='bmaps-request'||typeof m.id!=='string')return;
 let path=m.path,method=m.method||'GET';
 const permitted=(method==='GET'&&(path==='/health'||/^\/jobs\/[a-f0-9]{32}$/.test(path)))||(method==='POST'&&/^\/jobs\?from=\d{1,2}&to=\d{1,2}$/.test(path));
 if(!permitted){send({type:'bmaps-response',id:m.id,error:'허용되지 않은 요청'});return}
 if(method==='POST'&&(!(m.body instanceof Blob)||m.body.size>30*1024*1024)){send({type:'bmaps-response',id:m.id,error:'30MB 이하 PDF만 지원합니다.'});return}
 try{const value=await local(path,method,m.body);send({type:'bmaps-response',id:m.id,value})}catch(err){send({type:'bmaps-response',id:m.id,error:err.message})}
});
$('approve').onclick=async()=>{try{await local('/health');connected=true;$('approve').disabled=true;$('disconnect').disabled=false;$('status').textContent='연결됨. BMAPS로 돌아가 Codex 분석을 누르세요.';send({type:'bmaps-ready'})}catch(e){$('status').textContent=e.message}};
$('disconnect').onclick=()=>{send({type:'bmaps-disconnected'});connected=false;$('approve').disabled=false;$('disconnect').disabled=true;$('status').textContent='연결을 해제했습니다.'};
$('stop').onclick=async()=>{if(!confirm('실행 중인 분석도 중단됩니다. 처리 프로그램을 종료할까요?'))return;try{await local('/shutdown','POST');send({type:'bmaps-disconnected'});connected=false;$('status').textContent='프로그램을 종료했습니다.';$('approve').disabled=true;$('disconnect').disabled=true;$('stop').disabled=true}catch(e){$('status').textContent=e.message}};
addEventListener('beforeunload',()=>send({type:'bmaps-disconnected'}));
</script></html>
