<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMAPS 입학 상담 관리 v1.1</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --navy:#1F3A51; --navy-dark:#162c3e; --navy-light:#2a4f6e;
      --gold:#c8a96e; --gold-light:#d9bf91; --violet:#7c3aed;
      --bg:#f4f6f9; --surface:#ffffff; --border:#e2e8f0;
      --text:#1e293b; --text-sub:#64748b; --red:#ef4444; --green:#22c55e; --amber:#d97706;
      --radius:10px; --shadow:0 2px 10px rgba(0,0,0,0.08);
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      font-family:'Pretendard','Noto Sans KR',sans-serif;
      background:var(--bg); color:var(--text);
      -webkit-text-size-adjust:100%;
    }
    button{cursor:pointer;font-family:inherit;}
    input,select,textarea{font-family:inherit;font-size:14px;}
    .hidden{display:none !important;}

    /* ---------- 로그인 / 권한없음 화면 ---------- */
    .center-screen{
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    }
    .auth-card{
      width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);
      border-radius:16px;box-shadow:var(--shadow);padding:32px 28px;
    }
    .auth-card h1{font-size:18px;margin:0 0 4px;color:var(--navy);}
    .auth-card .sub{font-size:13px;color:var(--text-sub);margin:0 0 22px;}
    .auth-card label{display:block;font-size:12px;color:var(--text-sub);margin:14px 0 5px;font-weight:600;}
    .auth-card input{
      width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--radius);
      outline:none;background:#fff;
    }
    .auth-card input:focus{border-color:var(--navy-light);}
    .auth-card .btn-primary{width:100%;margin-top:20px;}
    .auth-err{color:var(--red);font-size:12.5px;min-height:16px;margin-top:10px;}
    .deny-icon{font-size:34px;text-align:center;margin-bottom:8px;}

    /* ---------- 공통 버튼 ---------- */
    .btn-primary{
      background:var(--navy);color:#fff;border:none;border-radius:var(--radius);
      padding:11px 16px;font-size:14px;font-weight:600;
    }
    .btn-primary:hover{background:var(--navy-dark);}
    .btn-ghost{
      background:#fff;color:var(--navy);border:1.5px solid var(--border);
      border-radius:var(--radius);padding:8px 13px;font-size:13px;font-weight:600;
    }
    .btn-ghost:hover{border-color:var(--navy-light);}
    .btn-danger{background:#fff;color:var(--red);border:1.5px solid #fecaca;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;}
    .btn-danger:hover{background:#fef2f2;}
    .btn-edit{background:#fff;color:var(--navy);border:1.5px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;}
    .btn-edit:hover{border-color:var(--navy-light);}
    .btn-view{background:var(--navy);color:#fff;border:1.5px solid var(--navy);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;}
    .btn-view:hover{background:var(--navy-dark);}

    /* ---------- 상단바 ---------- */
    .topbar{
      height:56px;background:var(--navy);color:#fff;display:flex;align-items:center;
      padding:0 18px;gap:12px;position:sticky;top:0;z-index:20;
    }
    .topbar .brand{font-size:15px;font-weight:700;letter-spacing:-0.2px;}
    .topbar .brand .accent{color:var(--gold-light);}
    .topbar .branch-chip{
      font-size:11.5px;background:rgba(255,255,255,0.14);padding:3px 9px;border-radius:999px;
    }
    .topbar .spacer{flex:1;}
    .topbar .who{font-size:12.5px;color:#cbd5e1;}
    .topbar .who b{color:#fff;}
    .topbar .logout{
      background:rgba(255,255,255,0.10);color:#fff;border:1px solid rgba(255,255,255,0.22);
      border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;
    }
    .topbar .logout:hover{background:rgba(255,255,255,0.2);}

    .wrap{max-width:1760px;margin:0 auto;padding:22px 28px 64px;}

    /* ---------- 툴바 ---------- */
    .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
    .toolbar h2{font-size:16px;margin:0;color:var(--navy);}
    .toolbar .count{font-size:12.5px;color:var(--text-sub);background:#fff;border:1px solid var(--border);padding:3px 10px;border-radius:999px;}
    .toolbar .spacer{flex:1;}
    .sort-btn{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:13px;font-weight:600;color:var(--text);display:inline-flex;align-items:center;gap:5px;}
    .sort-btn:hover{border-color:var(--navy-light);}
    .branch-select{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer;}
    .branch-select:hover{border-color:var(--navy-light);}

    /* ---------- 테이블 ---------- */
    .table-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:visible;}
    thead tr th:first-child{border-top-left-radius:13px;}
    thead tr th:last-child{border-top-right-radius:13px;}
    table{width:100%;border-collapse:collapse;font-size:13.5px;}
    thead th{
      background:#f1f5f9;color:var(--text-sub);font-weight:700;text-align:left;
      padding:11px 12px;border-bottom:1.5px solid var(--border);white-space:nowrap;font-size:12px;
      position:sticky;top:56px;z-index:5;box-shadow:0 2px 6px -3px rgba(15,23,42,0.25);
    }
    tbody td{padding:14px 14px;border-bottom:1px solid #eef2f6;vertical-align:top;}
    tbody tr:last-child td{border-bottom:none;}
    tbody tr:hover{background:#fafbfc;}
    td.name{font-weight:700;color:var(--navy);white-space:nowrap;}
    td.seq{color:var(--text-sub);text-align:center;white-space:nowrap;}
    td.content{max-width:760px;color:var(--text-sub);}
    td.note{max-width:340px;color:var(--text-sub);}
    td.content .ellip,td.note .ellip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;line-height:1.5;}
    td.date{white-space:nowrap;color:var(--text-sub);}
    td.actions{white-space:nowrap;text-align:right;}
    td.actions .btn-view,td.actions .btn-edit{margin-right:6px;}

    .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
    .badge.reg{background:#dcfce7;color:#15803d;}
    .badge.hold{background:#fef3c7;color:#b45309;}
    .badge.reject{background:#fee2e2;color:#b91c1c;}
    .badge.none{background:#f1f5f9;color:#64748b;}
    .badge.talk{background:#e0e7ff;color:#4338ca;}

    .empty{padding:54px 20px;text-align:center;color:var(--text-sub);}
    .empty .big{font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px;}

    /* ---------- 모달 ---------- */
    .modal-overlay{
      position:fixed;inset:0;background:rgba(15,23,42,0.5);display:flex;align-items:flex-start;
      justify-content:center;padding:34px 16px;z-index:50;overflow-y:auto;
    }
    .modal{
      width:100%;max-width:620px;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,0.25);
      overflow:hidden;
    }
    .modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;}
    .modal-head h3{margin:0;font-size:16px;color:var(--navy);}
    .modal-head .x{margin-left:auto;background:none;border:none;font-size:22px;line-height:1;color:var(--text-sub);}
    .modal-body{padding:20px 22px;}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .fg{display:flex;flex-direction:column;}
    .fg.full{grid-column:1 / -1;}
    .fg label{font-size:12px;color:var(--text-sub);font-weight:600;margin-bottom:5px;}
    .fg input,.fg select,.fg textarea{
      width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius);
      outline:none;background:#fff;
    }
    .fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--navy-light);}
    .fg textarea{min-height:92px;resize:vertical;line-height:1.5;}
    .fg .manual{margin-top:7px;}
    .fg .branch-fixed{padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius);background:#f8fafc;color:var(--navy);font-weight:600;}
    .section-label{grid-column:1 / -1;font-size:11.5px;font-weight:800;color:var(--gold);letter-spacing:0.4px;text-transform:uppercase;margin:6px 0 -4px;}
    .modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;}
    .save-err{color:var(--red);font-size:12.5px;margin-right:auto;align-self:center;}

    /* 상세보기(읽기전용) */
    .vrow{display:flex;gap:12px;padding:9px 2px;border-bottom:1px solid #f1f5f9;}
    .vrow:last-child{border-bottom:none;}
    .vlabel{flex:0 0 122px;font-size:12px;color:var(--text-sub);font-weight:700;padding-top:2px;}
    .vval{flex:1;font-size:13.5px;color:var(--text);line-height:1.55;word-break:break-word;}
    .vpre{white-space:pre-wrap;line-height:1.6;}

    @media (max-width:640px){
      .form-grid{grid-template-columns:1fr;}
      td.content{max-width:160px;}
      td.note{max-width:110px;}
      .topbar .who{display:none;}
    }
  </style>
</head>
<body>

  <!-- ====== 로그인 화면 ====== -->
  <div id="loginScreen" class="center-screen hidden">
    <div class="auth-card">
      <h1>BMAPS 입학 상담</h1>
      <p class="sub">입학 상담 관리 · 부원장/관리자 전용</p>
      <label for="login-username">아이디</label>
      <input id="login-username" type="text" autocomplete="username" />
      <label for="login-password">비밀번호</label>
      <input id="login-password" type="password" autocomplete="current-password" />
      <div id="login-error" class="auth-err"></div>
      <button class="btn-primary" onclick="doLogin()">로그인</button>
    </div>
  </div>

  <!-- ====== 권한 없음 화면 ====== -->
  <div id="denyScreen" class="center-screen hidden">
    <div class="auth-card" style="text-align:center;">
      <div class="deny-icon">🔒</div>
      <h1>접근 권한이 없습니다</h1>
      <p class="sub" id="deny-msg" style="margin-bottom:20px;">이 페이지는 입퇴원 상담 권한이 있는 부원장과 관리자만 이용할 수 있습니다.</p>
      <button class="btn-ghost" onclick="doLogout()" style="width:100%;">다른 계정으로 로그인</button>
    </div>
  </div>

  <!-- ====== 메인 앱 ====== -->
  <div id="appScreen" class="hidden">
    <div class="topbar">
      <span class="brand">BMAPS <span class="accent">입학 상담</span></span>
      <span class="branch-chip" id="branch-chip"></span>
      <span class="spacer"></span>
      <span class="who"><b id="user-name"></b> 님</span>
      <button class="logout" onclick="doLogout()">로그아웃</button>
    </div>

    <div class="wrap">
      <div class="toolbar">
        <h2>입학 상담 현황</h2>
        <span class="count" id="row-count">0건</span>
        <select class="branch-select" id="branch-select" onchange="onBranchChange()" style="display:none;"></select>
        <span class="spacer"></span>
        <button class="sort-btn" id="sort-btn" onclick="toggleSort()">접수일 ↑ 오름차순</button>
        <button class="btn-primary" onclick="openAddModal()">+ 상담 추가</button>
      </div>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th style="width:42px">연번</th>
              <th>최초접수일</th>
              <th>등록여부</th>
              <th>학교/학년</th>
              <th>이름</th>
              <th>내용</th>
              <th>등록일</th>
              <th>비고</th>
              <th style="text-align:right;">관리</th>
            </tr>
          </thead>
          <tbody id="consult-body"></tbody>
        </table>
        <div id="empty-state" class="empty hidden">
          <div class="big">아직 등록된 상담이 없습니다</div>
          <div>오른쪽 위 “+ 상담 추가”로 첫 상담을 기록해 보세요.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== 추가/수정 모달 ====== -->
  <div id="formModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modal-title">상담 추가</h3>
        <button class="x" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="fg" id="fg-branch">
            <label for="f-branch">분원</label>
            <select id="f-branch"></select>
            <div id="f-branch-fixed" class="branch-fixed hidden"></div>
          </div>
          <div class="fg">
            <label for="f-inquiry">최초 접수일</label>
            <input id="f-inquiry" type="date" />
          </div>
          <div class="fg">
            <label for="f-status">등록여부</label>
            <select id="f-status" onchange="onStatusChange()"></select>
            <input id="f-status-manual" class="manual hidden" type="text" placeholder="직접 입력" />
          </div>
          <div class="fg">
            <label for="f-school">학교/학년</label>
            <input id="f-school" type="text" placeholder="예: 청라중3" />
          </div>
          <div class="fg">
            <label for="f-name">학생 이름</label>
            <input id="f-name" type="text" placeholder="미정이면 - 입력" />
          </div>
          <div class="fg full">
            <label for="f-content">상담내용</label>
            <textarea id="f-content" placeholder="상담 내용을 입력하세요"></textarea>
          </div>

          <div class="section-label">시범수업 / 테스트</div>
          <div class="fg">
            <label for="f-testdate">TEST(상담)일</label>
            <input id="f-testdate" type="date" />
          </div>
          <div class="fg">
            <label for="f-testscore">TEST 점수</label>
            <input id="f-testscore" type="text" placeholder="예: 2~3등급 / 78점" />
          </div>
          <div class="fg">
            <label for="f-teacher">시범수업 담당T</label>
            <select id="f-teacher" onchange="onTeacherChange()"></select>
            <input id="f-teacher-manual" class="manual hidden" type="text" placeholder="담당T 직접 입력" />
          </div>
          <div class="fg">
            <label for="f-demodate">시범수업일</label>
            <input id="f-demodate" type="date" />
          </div>
          <div class="fg">
            <label for="f-demofollow">시범수업 후 상담일</label>
            <input id="f-demofollow" type="date" />
          </div>
          <div class="fg">
            <label for="f-regdate">등록일</label>
            <input id="f-regdate" type="date" />
          </div>
          <div class="fg full">
            <label for="f-note">비고</label>
            <textarea id="f-note" placeholder="참고 사항"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <span id="save-error" class="save-err"></span>
        <button class="btn-ghost" onclick="closeModal()">취소</button>
        <button class="btn-primary" id="save-btn" onclick="saveConsult()">저장</button>
      </div>
    </div>
  </div>

  <!-- ====== 상세보기 모달 (읽기전용) ====== -->
  <div id="viewModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <h3 id="view-title">상담 상세</h3>
        <button class="x" onclick="closeViewModal()">&times;</button>
      </div>
      <div class="modal-body" id="view-body"></div>
      <div class="modal-foot">
        <button class="btn-ghost" onclick="closeViewModal()">닫기</button>
        <button class="btn-primary" onclick="viewToEdit()">수정하기</button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       BMAPS 입학 상담 관리 (consult.html)
       - 별도 페이지 / index.html 과 동일 anon 클라이언트 + savedUserId 공유
       - 접근: admin 또는 (vice_director && permissions.consult_manage)
       ========================================================= */
    window.CONSULT_VERSION = 'v1.1';

    const SUPABASE_URL = 'https://qtpftloyumtffvgurvqv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_XGP9n-2fuBQFuJlAA5MJ8w_R8JYIi9O';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    const REG_STATUS_OPTIONS = ['등록','상담중','보류','거절','미등록','취소'];

    const BR_ALL = '__all__';     // 관리자: 전체 분원
    const BR_MINE = '__mine__';   // 부원장: 내 담당 전체

    let currentUser = null;
    let _teachers = [];
    let _consults = [];
    let _allowedBranches = [];    // [{id,name}] 사용자가 조회 가능한 분원
    let _branchMap = {};          // id -> name
    let _currentBranchId = null;  // BR_ALL | BR_MINE | 특정 branch id
    let _sortDir = 'asc';     // inquiry_date 정렬 방향
    let _editingId = null;

    /* ---------- 유틸 ---------- */
    function $(id){ return document.getElementById(id); }
    function val(id){ var el=$(id); return el ? el.value : ''; }
    function esc(s){
      return String(s==null?'':s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }
    // 로컬 기준 YYYY-MM-DD (toISOString UTC 시프트 회피)
    function _localYMD(d){
      d = d || new Date();
      var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), da=String(d.getDate()).padStart(2,'0');
      return y+'-'+m+'-'+da;
    }
    // 'YYYY-MM-DD' -> 'YY년M월D일'
    function fmtKDate(ymd){
      if(!ymd) return '<span style="color:#cbd5e1">—</span>';
      var p=String(ymd).split('-');
      if(p.length<3) return esc(ymd);
      return p[0].slice(2)+'년'+Number(p[1])+'월'+Number(p[2])+'일';
    }
    function statusBadge(s){
      if(!s) return '<span class="badge none">미입력</span>';
      var cls='none';
      if(s==='등록') cls='reg';
      else if(s==='상담중') cls='talk';
      else if(s==='보류') cls='hold';
      else if(s==='거절'||s==='취소') cls='reject';
      else if(s==='미등록') cls='none';
      return '<span class="badge '+cls+'">'+esc(s)+'</span>';
    }

    /* ---------- 화면 전환 ---------- */
    function showScreen(name){
      ['loginScreen','denyScreen','appScreen'].forEach(function(id){
        $(id).classList.toggle('hidden', id !== name);
      });
    }

    /* ---------- 권한 ---------- */
    function canAccess(u){
      if(!u) return false;
      if(u.role==='admin') return true;
      if(u.role==='vice_director'){
        var p=u.permissions;
        if(!p) return false;
        if(Array.isArray(p)) return p.indexOf('consult_manage')!==-1;
        if(typeof p==='object') return p.consult_manage===true;
      }
      return false;
    }

    /* ---------- 인증 ---------- */
    async function init(){
      var savedId = localStorage.getItem('savedUserId');
      if(!savedId){ showScreen('loginScreen'); return; }
      try{
        var res = await db.from('users').select('*').eq('id', savedId).single();
        var data = res.data;
        if(res.error || !data || data.status==='inactive' || data.status==='pending' || data.deleted_at){
          localStorage.removeItem('savedUserId');
          showScreen('loginScreen');
          return;
        }
        currentUser = data;
        if(!canAccess(data)){ showDeny(); return; }
        await enterApp();
      }catch(e){
        console.error(e);
        showScreen('loginScreen');
      }
    }

    async function doLogin(){
      var u = val('login-username').trim();
      var p = val('login-password').trim();
      var err = $('login-error');
      err.textContent='';
      if(!u || !p){ err.textContent='아이디와 비밀번호를 입력해 주세요.'; return; }
      try{
        var res = await db.from('users').select('*').eq('username',u).eq('password',p).single();
        var data = res.data;
        if(res.error || !data){ err.textContent='아이디 또는 비밀번호가 올바르지 않습니다.'; return; }
        if(data.status==='inactive' || data.deleted_at){ err.textContent='비활성화된 계정입니다.'; return; }
        if(data.status==='pending'){ err.textContent='승인 대기 중인 계정입니다.'; return; }
        currentUser = data;
        localStorage.setItem('savedUserId', data.id);
        if(!canAccess(data)){ showDeny(); return; }
        await enterApp();
      }catch(e){
        err.textContent='네트워크 오류가 발생했습니다.';
        console.error(e);
      }
    }

    function showDeny(){
      if(currentUser){
        $('deny-msg').textContent =
          (currentUser.name||'') + ' 님은 입퇴원 상담 권한이 없습니다. 권한이 필요하면 관리자에게 문의하세요.';
      }
      showScreen('denyScreen');
    }

    function doLogout(){
      if(!confirm('로그아웃 하시겠습니까? (BMAPS 공용 로그인에서도 함께 로그아웃됩니다)')) return;
      currentUser = null;
      localStorage.removeItem('savedUserId');
      $('login-username').value='';
      $('login-password').value='';
      $('login-error').textContent='';
      showScreen('loginScreen');
    }

    /* ---------- 앱 진입 ---------- */
    async function enterApp(){
      showScreen('appScreen');
      $('user-name').textContent = currentUser.name || '';
      buildStatusOptions();
      await loadBranches();
      buildBranchUI();
      await loadTeachers();
      await loadConsults();
    }

    /* ---------- 분원 ---------- */
    // 부원장 배정 분원 id 목록 (branch_ids 우선, 없으면 단일 branch_id)
    function viceBranchIds(){
      var ids = (currentUser && Array.isArray(currentUser.branch_ids)) ? currentUser.branch_ids.slice() : [];
      if(ids.length===0 && currentUser && currentUser.branch_id) ids = [currentUser.branch_id];
      return ids;
    }

    async function loadBranches(){
      _allowedBranches = []; _branchMap = {}; _currentBranchId = null;
      try{
        var res = await db.from('branches').select('id,name,active').order('name');
        var rows = (res.data||[]);
        rows.forEach(function(b){ _branchMap[b.id] = b.name; });   // 라벨용: 전체 분원
        var all = rows.filter(function(b){ return b.active !== false; });  // 선택용: 활성 분원
        if(currentUser.role==='admin'){
          _allowedBranches = all;
          _currentBranchId = BR_ALL;
        } else {
          var ids = viceBranchIds();
          _allowedBranches = all.filter(function(b){ return ids.indexOf(b.id)!==-1; });
          if(_allowedBranches.length>1) _currentBranchId = BR_MINE;
          else if(_allowedBranches.length===1) _currentBranchId = _allowedBranches[0].id;
          else _currentBranchId = null;
        }
      }catch(e){ console.error(e); }
    }

    // 현재 조회 범위 라벨
    function currentScopeLabel(){
      if(_currentBranchId===BR_ALL) return '전체 분원';
      if(_currentBranchId===BR_MINE) return '내 담당';
      if(_currentBranchId && _branchMap[_currentBranchId]) return _branchMap[_currentBranchId];
      return '';
    }

    function buildBranchUI(){
      var sel = $('branch-select');
      var opts = [];
      if(currentUser.role==='admin'){
        opts.push('<option value="'+BR_ALL+'">전체 분원</option>');
        _allowedBranches.forEach(function(b){ opts.push('<option value="'+b.id+'">'+esc(b.name)+'</option>'); });
      } else {
        if(_allowedBranches.length>1){
          opts.push('<option value="'+BR_MINE+'">내 담당 전체</option>');
        }
        _allowedBranches.forEach(function(b){ opts.push('<option value="'+b.id+'">'+esc(b.name)+'</option>'); });
      }
      sel.innerHTML = opts.join('');
      sel.value = _currentBranchId || '';
      // 옵션이 2개 이상일 때만 드롭다운 노출 (단일 분원 부원장은 숨김)
      sel.style.display = (sel.options.length>1) ? '' : 'none';
      updateBranchChip();
    }

    function updateBranchChip(){
      var chip = $('branch-chip');
      if(chip) chip.textContent = currentScopeLabel();
    }

    function onBranchChange(){
      var v = $('branch-select').value;
      // 권한 방어: 부원장은 허용 분원/내담당만 허용
      if(currentUser.role!=='admin'){
        var allowedVals = _allowedBranches.map(function(b){ return b.id; });
        if(_allowedBranches.length>1) allowedVals.push(BR_MINE);
        if(allowedVals.indexOf(v)===-1){ v = _currentBranchId; $('branch-select').value=v; }
      }
      _currentBranchId = v;
      updateBranchChip();
      loadConsults();
    }

    async function loadTeachers(){
      try{
        var res = await db.from('users')
          .select('id,name,branch_id,role,status,deleted_at')
          .in('role',['teacher','vice_director']);
        var list = (res.data||[]).filter(function(t){ return t.status!=='inactive' && !t.deleted_at; });
        list.sort(function(a,b){ return (a.name||'').localeCompare(b.name||'','ko'); });
        _teachers = list;
      }catch(e){ console.error(e); _teachers=[]; }
      buildTeacherOptions();
    }

    async function loadConsults(){
      try{
        var q = db.from('admission_consultations').select('*');
        if(_currentBranchId===BR_ALL){
          // 관리자 전체: 분원 필터 없음
        } else if(_currentBranchId===BR_MINE){
          var ids = _allowedBranches.map(function(b){ return b.id; });
          if(ids.length===0){ _consults=[]; renderTable(); return; }
          q = q.in('branch_id', ids);
        } else if(_currentBranchId){
          q = q.eq('branch_id', _currentBranchId);
        } else {
          // 조회 가능한 분원 없음
          _consults=[]; renderTable(); return;
        }
        var res = await q;
        if(res.error){ console.error(res.error); _consults=[]; }
        else _consults = res.data || [];
      }catch(e){ console.error(e); _consults=[]; }
      renderTable();
    }

    /* ---------- 렌더 ---------- */
    function toggleSort(){
      _sortDir = (_sortDir==='asc') ? 'desc' : 'asc';
      $('sort-btn').textContent = (_sortDir==='asc') ? '접수일 ↑ 오름차순' : '접수일 ↓ 내림차순';
      renderTable();
    }

    function renderTable(){
      var rows = _consults.slice().sort(function(a,b){
        var av=a.inquiry_date||'', bv=b.inquiry_date||'';
        if(!av && !bv) return (a.created_at||'').localeCompare(b.created_at||'');
        if(!av) return 1;            // 접수일 없는 행은 항상 마지막
        if(!bv) return -1;
        if(av===bv) return (a.created_at||'').localeCompare(b.created_at||'');
        return _sortDir==='asc' ? av.localeCompare(bv) : bv.localeCompare(av);
      });

      $('row-count').textContent = rows.length + '건';
      var body = $('consult-body');
      var empty = $('empty-state');

      if(rows.length===0){
        body.innerHTML='';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      body.innerHTML = rows.map(function(r, i){
        var content = r.content ? esc(r.content) : '';
        var note = r.note ? esc(r.note) : '';
        return ''+
          '<tr>'+
            '<td class="seq">'+(i+1)+'</td>'+
            '<td class="date">'+fmtKDate(r.inquiry_date)+'</td>'+
            '<td>'+statusBadge(r.reg_status)+'</td>'+
            '<td style="white-space:nowrap">'+(r.school_grade?esc(r.school_grade):'<span style="color:#cbd5e1">—</span>')+'</td>'+
            '<td class="name">'+(r.student_name?esc(r.student_name):'—')+'</td>'+
            '<td class="content"><span class="ellip" title="'+content+'">'+(content||'<span style="color:#cbd5e1">—</span>')+'</span></td>'+
            '<td class="date">'+fmtKDate(r.reg_date)+'</td>'+
            '<td class="note"><span class="ellip" title="'+note+'">'+(note||'<span style="color:#cbd5e1">—</span>')+'</span></td>'+
            '<td class="actions">'+
              '<button class="btn-view" onclick="openViewModal(\''+r.id+'\')">보기</button>'+
              '<button class="btn-edit" onclick="openEditModal(\''+r.id+'\')">수정</button>'+
              '<button class="btn-danger" onclick="deleteConsult(\''+r.id+'\')">삭제</button>'+
            '</td>'+
          '</tr>';
      }).join('');
    }

    /* ---------- 폼 옵션 빌드 ---------- */
    function buildStatusOptions(){
      var sel = $('f-status');
      var opts = ['<option value="">선택 안 함</option>'];
      REG_STATUS_OPTIONS.forEach(function(s){ opts.push('<option value="'+esc(s)+'">'+esc(s)+'</option>'); });
      opts.push('<option value="__manual__">직접입력…</option>');
      sel.innerHTML = opts.join('');
    }
    function buildTeacherOptions(){
      var sel = $('f-teacher');
      if(!sel) return;
      var opts = ['<option value="">선택 안 함</option>'];
      _teachers.forEach(function(t){
        opts.push('<option value="'+esc(t.id)+'">'+esc(t.name||'(이름없음)')+'</option>');
      });
      opts.push('<option value="__manual__">직접입력…</option>');
      sel.innerHTML = opts.join('');
    }
    function onStatusChange(){
      $('f-status-manual').classList.toggle('hidden', val('f-status')!=='__manual__');
    }
    function onTeacherChange(){
      $('f-teacher-manual').classList.toggle('hidden', val('f-teacher')!=='__manual__');
    }

    /* ---------- 모달 ---------- */
    function clearForm(){
      ['f-inquiry','f-school','f-name','f-content','f-testdate','f-testscore',
       'f-demodate','f-demofollow','f-regdate','f-note','f-status-manual','f-teacher-manual'
      ].forEach(function(id){ if($(id)) $(id).value=''; });
      $('f-status').value='';
      $('f-teacher').value='';
      onStatusChange(); onTeacherChange();
      $('save-error').textContent='';
    }

    /* ---------- 모달 분원 필드 ---------- */
    function buildModalBranch(editRec){
      var sel=$('f-branch'), fixed=$('f-branch-fixed');
      if(editRec){
        // 수정: 기존 분원 고정 (변경 불가, 보존)
        sel.style.display='none'; sel.innerHTML=''; sel.dataset.fixedId = editRec.branch_id || '';
        fixed.classList.remove('hidden');
        fixed.textContent = _branchMap[editRec.branch_id] || '(분원)';
        return;
      }
      var list = _allowedBranches; // 역할별 허용 분원 (관리자=전체, 부원장=배정)
      // 기본값: 현재 조회가 특정 분원이면 그 분원, 아니면 첫 분원
      var def = (_currentBranchId && _currentBranchId!==BR_ALL && _currentBranchId!==BR_MINE) ? _currentBranchId : (list[0] ? list[0].id : '');
      if(currentUser.role!=='admin' && list.length<=1){
        // 단일 분원 부원장: 고정 표시
        sel.style.display='none'; sel.dataset.fixedId = list[0] ? list[0].id : '';
        fixed.classList.remove('hidden');
        fixed.textContent = list[0] ? list[0].name : '(분원 없음)';
        return;
      }
      // 선택 가능 (관리자 전체 / 부원장 2개+)
      fixed.classList.add('hidden'); sel.style.display=''; sel.dataset.fixedId='';
      sel.innerHTML = list.map(function(b){ return '<option value="'+b.id+'">'+esc(b.name)+'</option>'; }).join('');
      sel.value = def;
    }
    function getModalBranchId(){
      var sel=$('f-branch');
      if(sel.dataset.fixedId) return sel.dataset.fixedId;
      return sel.value || null;
    }

    function openAddModal(){
      _editingId = null;
      $('modal-title').textContent='상담 추가';
      clearForm();
      buildModalBranch(null);
      $('formModal').classList.remove('hidden');
    }

    function openEditModal(id){
      var r = _consults.find(function(x){ return x.id===id; });
      if(!r){ alert('해당 상담을 찾을 수 없습니다.'); return; }
      _editingId = id;
      $('modal-title').textContent='상담 수정';
      clearForm();
      buildModalBranch(r);
      $('f-inquiry').value   = r.inquiry_date || '';
      $('f-school').value    = r.school_grade || '';
      $('f-name').value      = r.student_name || '';
      $('f-content').value   = r.content || '';
      $('f-testdate').value  = r.test_date || '';
      $('f-testscore').value = r.test_score || '';
      $('f-demodate').value  = r.demo_date || '';
      $('f-demofollow').value= r.demo_followup_date || '';
      $('f-regdate').value   = r.reg_date || '';
      $('f-note').value      = r.note || '';

      // 등록여부: 표준값이면 select, 아니면 직접입력
      if(r.reg_status && REG_STATUS_OPTIONS.indexOf(r.reg_status)===-1){
        $('f-status').value='__manual__';
        $('f-status-manual').value=r.reg_status;
      } else {
        $('f-status').value = r.reg_status || '';
      }
      onStatusChange();

      // 담당T: id 매칭되면 select, 이름만 있으면 직접입력
      if(r.demo_teacher_id && _teachers.some(function(t){return t.id===r.demo_teacher_id;})){
        $('f-teacher').value=r.demo_teacher_id;
      } else if(r.demo_teacher_name){
        $('f-teacher').value='__manual__';
        $('f-teacher-manual').value=r.demo_teacher_name;
      } else {
        $('f-teacher').value='';
      }
      onTeacherChange();

      $('formModal').classList.remove('hidden');
    }

    function closeModal(){
      $('formModal').classList.add('hidden');
      _editingId = null;
    }

    /* ---------- 상세보기 (읽기전용) ---------- */
    var _viewingId = null;
    // 'YYYY-MM-DD' -> 'YY년M월D일' (빈 값은 빈 문자열, row()에서 — 처리)
    function fmtKDateRaw(ymd){
      if(!ymd) return '';
      var p=String(ymd).split('-');
      if(p.length<3) return ymd;
      return p[0].slice(2)+'년'+Number(p[1])+'월'+Number(p[2])+'일';
    }
    function openViewModal(id){
      var r=_consults.find(function(x){ return x.id===id; });
      if(!r){ alert('해당 상담을 찾을 수 없습니다.'); return; }
      _viewingId=id;
      function vrow(label,val,pre){
        var v=(val==null||val==='')
          ? '<span style="color:#cbd5e1">—</span>'
          : (pre ? '<div class="vpre">'+esc(val)+'</div>' : esc(val));
        return '<div class="vrow"><div class="vlabel">'+label+'</div><div class="vval">'+v+'</div></div>';
      }
      var html='';
      html+=vrow('최초 접수일', fmtKDateRaw(r.inquiry_date));
      html+=vrow('등록여부', r.reg_status);
      html+=vrow('학교/학년', r.school_grade);
      html+=vrow('이름', r.student_name);
      html+=vrow('내용', r.content, true);
      html+=vrow('TEST(상담)일', fmtKDateRaw(r.test_date));
      html+=vrow('TEST 점수', r.test_score);
      html+=vrow('시범수업 담당T', r.demo_teacher_name);
      html+=vrow('시범수업일', fmtKDateRaw(r.demo_date));
      html+=vrow('시범수업 후 상담일', fmtKDateRaw(r.demo_followup_date));
      html+=vrow('등록일', fmtKDateRaw(r.reg_date));
      html+=vrow('비고', r.note, true);
      $('view-body').innerHTML=html;
      $('viewModal').classList.remove('hidden');
    }
    function closeViewModal(){
      $('viewModal').classList.add('hidden');
      _viewingId=null;
    }
    function viewToEdit(){
      var id=_viewingId;
      closeViewModal();
      if(id) openEditModal(id);
    }

    /* ---------- 저장 / 삭제 ---------- */
    function getRegStatus(){
      var v = val('f-status');
      if(v==='__manual__') return val('f-status-manual').trim();
      return v;
    }

    async function saveConsult(){
      var err = $('save-error'); err.textContent='';
      var name = val('f-name').trim();
      if(!name){ err.textContent='학생 이름을 입력해 주세요. (미정이면 - 입력)'; return; }

      var branchId = getModalBranchId();
      if(!branchId){ err.textContent='분원을 선택해 주세요.'; return; }

      var payload = {
        branch_id: branchId,
        inquiry_date: val('f-inquiry') || null,
        reg_status:   getRegStatus() || null,
        school_grade: val('f-school').trim() || null,
        student_name: name,
        content:      val('f-content') || null,
        test_date:    val('f-testdate') || null,
        test_score:   val('f-testscore').trim() || null,
        demo_date:    val('f-demodate') || null,
        demo_followup_date: val('f-demofollow') || null,
        reg_date:     val('f-regdate') || null,
        note:         val('f-note').trim() || null
      };

      // 담당T
      var tsel = val('f-teacher');
      if(tsel==='__manual__'){
        payload.demo_teacher_id = null;
        payload.demo_teacher_name = val('f-teacher-manual').trim() || null;
      } else if(tsel){
        var t = _teachers.find(function(x){ return x.id===tsel; });
        payload.demo_teacher_id = tsel;
        payload.demo_teacher_name = t ? (t.name||null) : null;
      } else {
        payload.demo_teacher_id = null;
        payload.demo_teacher_name = null;
      }

      var btn = $('save-btn');
      btn.disabled = true; btn.textContent='저장 중…';
      try{
        var res;
        if(_editingId){
          res = await db.from('admission_consultations').update(payload).eq('id', _editingId);
        } else {
          payload.created_by = currentUser.id;
          res = await db.from('admission_consultations').insert(payload);
        }
        if(res.error){ err.textContent='저장 실패: '+res.error.message; return; }
        closeModal();
        await loadConsults();
      }catch(e){
        err.textContent='저장 중 오류가 발생했습니다.';
        console.error(e);
      }finally{
        btn.disabled=false; btn.textContent='저장';
      }
    }

    async function deleteConsult(id){
      var r = _consults.find(function(x){ return x.id===id; });
      var nm = r && r.student_name ? r.student_name : '이 상담';
      if(!confirm('['+nm+'] 상담 기록을 삭제할까요? 되돌릴 수 없습니다.')) return;
      try{
        var res = await db.from('admission_consultations').delete().eq('id', id);
        if(res.error){ alert('삭제 실패: '+res.error.message); return; }
        await loadConsults();
      }catch(e){
        alert('삭제 중 오류가 발생했습니다.');
        console.error(e);
      }
    }

    /* ---------- 시작 ---------- */
    init();
  </script>
</body>
</html>
