<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BMAPS · 독서실 출결 [v0.1-skeleton]</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif; background: #0f172a; color: #1e293b; }

  /* ===== 키오스크 셸 ===== */
  .sc-app { min-height: 100vh; display: flex; flex-direction: column; }

  /* 상단 바 (관리자에게만 의미, 키오스크에선 최소화) */
  .sc-topbar {
    position: sticky; top: 0; z-index: 50;
    background: linear-gradient(135deg, #075985, #0369a1); color: #fff;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .sc-topbar .tb-title { font-size: 15px; font-weight: 800; letter-spacing: 0.3px; }
  .sc-topbar .tb-ver { font-size: 10.5px; background: rgba(255,255,255,0.18); padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .sc-topbar .tb-spacer { flex: 1; }
  .sc-topbar .tb-mode-btn {
    font-size: 12px; font-weight: 700; color: #fff; background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  .sc-topbar .tb-mode-btn:hover { background: rgba(255,255,255,0.28); }

  /* 본문 영역 */
  .sc-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }

  /* 화면 모드 (kiosk / admin) — display 토글 */
  .sc-screen { display: none; width: 100%; }
  .sc-screen.active { display: block; }

  /* 키오스크 기본 화면 (Phase 0 placeholder) */
  .kiosk-wrap { max-width: 480px; margin: 0 auto; text-align: center; }
  .kiosk-card {
    background: #fff; border-radius: 24px; padding: 40px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .kiosk-title { font-size: 26px; font-weight: 800; color: #075985; margin-bottom: 8px; }
  .kiosk-sub { font-size: 14px; color: #64748b; margin-bottom: 24px; }
  .kiosk-placeholder { font-size: 14px; color: #94a3b8; padding: 40px 0; }

  /* 관리자 화면 (Phase 0 placeholder) */
  .admin-wrap { max-width: 1000px; margin: 0 auto; width: 100%; background: #fff; border-radius: 16px; padding: 28px; min-height: 60vh; }
  .admin-title { font-size: 20px; font-weight: 800; color: #075985; margin-bottom: 6px; }
  .admin-sub { font-size: 13px; color: #64748b; margin-bottom: 20px; }

  /* 인증 차단 오버레이 (관리자 모드 진입 시) */
  .sc-blocker {
    position: fixed; inset: 0; z-index: 200; display: none;
    background: rgba(15,23,42,0.96); flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center;
  }
  .sc-blocker.show { display: flex; }
  .sc-blocker .bk-card { background: #fff; border-radius: 18px; padding: 32px 28px; max-width: 380px; width: 100%; }
  .sc-blocker .bk-title { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
  .sc-blocker .bk-msg { font-size: 13.5px; color: #64748b; line-height: 1.6; margin-bottom: 18px; }
  .sc-blocker input {
    width: 100%; padding: 11px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px;
    font-size: 14px; outline: none; margin-bottom: 10px;
  }
  .sc-blocker input:focus { border-color: #0369a1; }
  .sc-blocker button {
    width: 100%; padding: 11px; background: #0369a1; color: #fff; border: none;
    border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .sc-blocker button:hover { background: #075985; }
  .sc-blocker .bk-err { font-size: 12.5px; color: #dc2626; min-height: 18px; margin-bottom: 6px; }
  .sc-blocker .bk-back { background: none; color: #94a3b8; font-size: 12px; margin-top: 8px; text-decoration: underline; cursor: pointer; padding: 4px; width: auto; }
</style>
</head>
<body>
<div class="sc-app">
  <!-- 상단 바 -->
  <div class="sc-topbar">
    <span class="tb-title">🏫 독서실 출결</span>
    <span class="tb-ver" id="sc-ver">v0.1-skeleton</span>
    <span class="tb-spacer"></span>
    <button class="tb-mode-btn" id="sc-mode-kiosk" onclick="scShowKiosk()" style="display:none">📱 키오스크</button>
    <button class="tb-mode-btn" id="sc-mode-admin" onclick="scRequestAdmin()">⚙️ 관리</button>
  </div>

  <div class="sc-body">
    <!-- 키오스크 화면 -->
    <div class="sc-screen active" id="sc-kiosk">
      <div class="kiosk-wrap">
        <div class="kiosk-card">
          <div class="kiosk-title">독서실 출결</div>
          <div class="kiosk-sub">학생 코드를 입력해주세요</div>
          <div class="kiosk-placeholder" id="kiosk-placeholder">
            (Phase 2에서 코드 입력 화면이 들어갑니다)
          </div>
        </div>
      </div>
    </div>

    <!-- 관리자 화면 -->
    <div class="sc-screen" id="sc-admin">
      <div class="admin-wrap">
        <div class="admin-title">⚙️ 독서실 관리</div>
        <div class="admin-sub">독서실 학생 일괄 등록 · 코드 관리 (관리자 전용)</div>
        <div class="kiosk-placeholder">
          (Phase 1에서 일괄 등록 기능이 들어갑니다)
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 관리자 인증 차단 오버레이 -->
<div class="sc-blocker" id="sc-blocker">
  <div class="bk-card">
    <div class="bk-title">🔒 관리자 인증</div>
    <div class="bk-msg">독서실 관리 기능은 관리자만 사용할 수 있습니다.<br>BMAPS 관리자 계정으로 로그인되어 있어야 합니다.</div>
    <div class="bk-err" id="sc-auth-err"></div>
    <button onclick="scCheckAdminAuth()">관리자 확인</button>
    <button class="bk-back" onclick="scCloseBlocker()">← 키오스크로 돌아가기</button>
  </div>
</div>

<script>
  /* ============================================================
     [SUPABASE] BMAPS 공유 인스턴스
  ============================================================ */
  const SUPABASE_URL = 'https://qtpftloyumtffvgurvqv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_XGP9n-2fuBQFuJlAA5MJ8w_R8JYIi9O';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  window.STUDYCENTER_VERSION = 'v0.1-skeleton';
  console.log('STUDYCENTER build:', window.STUDYCENTER_VERSION);

  /* ============================================================
     [STATE] 전역 상태
  ============================================================ */
  var scCurrentUser = null;   // 관리자 인증된 사용자 (kiosk는 인증 불필요)

  /* ============================================================
     [MODE] 화면 전환 — 키오스크(무인, 기본) ↔ 관리자(인증 필요)
  ============================================================ */
  function scShowKiosk(){
    document.getElementById('sc-kiosk').classList.add('active');
    document.getElementById('sc-admin').classList.remove('active');
    document.getElementById('sc-mode-kiosk').style.display = 'none';
    document.getElementById('sc-mode-admin').style.display = '';
  }

  function scShowAdmin(){
    document.getElementById('sc-admin').classList.add('active');
    document.getElementById('sc-kiosk').classList.remove('active');
    document.getElementById('sc-mode-kiosk').style.display = '';
    document.getElementById('sc-mode-admin').style.display = 'none';
  }

  // 관리 버튼 클릭 → 인증 차단 오버레이 표시
  function scRequestAdmin(){
    var errEl = document.getElementById('sc-auth-err');
    if(errEl) errEl.textContent = '';
    document.getElementById('sc-blocker').classList.add('show');
  }

  function scCloseBlocker(){
    document.getElementById('sc-blocker').classList.remove('show');
  }

  /* ============================================================
     [AUTH] 관리자 인증 — localStorage savedUserId → users → role
     키오스크는 인증 불필요. 관리 모드 진입 시에만 검사.
  ============================================================ */
  async function scCheckAdminAuth(){
    var errEl = document.getElementById('sc-auth-err');
    if(errEl) errEl.textContent = '확인 중...';
    try {
      var savedId = localStorage.getItem('savedUserId');
      if(!savedId){
        if(errEl) errEl.textContent = 'BMAPS에 먼저 로그인해주세요.';
        return;
      }
      var res = await db.from('users').select('id, name, role').eq('id', savedId).maybeSingle();
      if(res.error || !res.data){
        if(errEl) errEl.textContent = '사용자 정보를 찾을 수 없습니다.';
        return;
      }
      if(res.data.role !== 'admin'){
        if(errEl) errEl.textContent = '관리자 권한이 없는 계정입니다.';
        return;
      }
      // 인증 성공
      scCurrentUser = res.data;
      scCloseBlocker();
      scShowAdmin();
    } catch(e){
      if(errEl) errEl.textContent = '인증 오류: ' + (e.message || e);
    }
  }

  /* ============================================================
     [INIT]
  ============================================================ */
  window.addEventListener('DOMContentLoaded', function(){
    // 기본은 키오스크 모드 (학생 무인용)
    scShowKiosk();
  });
</script>
</body>
</html>
