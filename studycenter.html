<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BMAPS · 독서실 출결 [v0.3-kiosk-code]</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif; background: #0f172a; color: #1e293b; }

  /* ===== 키오스크 셸 ===== */
  .sc-app { min-height: 100vh; display: flex; flex-direction: column; }

  /* 상단 바 (관리자에게만 의미, 키오스크에선 최소화) */
  .sc-topbar {
    position: sticky; top: 0; z-index: 50;
    background: linear-gradient(135deg, #075985, #0369a1); color: #fff;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .sc-topbar .tb-title { font-size: 15px; font-weight: 800; letter-spacing: 0.3px; }
  .sc-topbar .tb-ver { font-size: 10.5px; background: rgba(255,255,255,0.18); padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .sc-topbar .tb-spacer { flex: 1; }
  .sc-topbar .tb-mode-btn {
    font-size: 12px; font-weight: 700; color: #fff; background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  .sc-topbar .tb-mode-btn:hover { background: rgba(255,255,255,0.28); }

  /* 본문 영역 */
  .sc-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }

  /* 화면 모드 (kiosk / admin) — display 토글 */
  .sc-screen { display: none; width: 100%; }
  .sc-screen.active { display: block; }

  /* 키오스크 기본 화면 (Phase 0 placeholder) */
  .kiosk-wrap { max-width: 480px; margin: 0 auto; text-align: center; }
  .kiosk-card {
    background: #fff; border-radius: 24px; padding: 40px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .kiosk-title { font-size: 26px; font-weight: 800; color: #075985; margin-bottom: 8px; }
  .kiosk-sub { font-size: 14px; color: #64748b; margin-bottom: 24px; }
  .kiosk-placeholder { font-size: 14px; color: #94a3b8; padding: 40px 0; }
  /* 키오스크 키패드 */
  .kp-display { font-size: 38px; font-weight: 800; letter-spacing: 10px; color: #0f172a; min-height: 56px; padding: 8px 0 16px; font-family: "SF Mono","Menlo","Consolas",monospace; }
  .kp-display .kp-placeholder { color: #cbd5e1; letter-spacing: 10px; }
  .kp-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 8px auto 0; max-width: 320px; }
  .kp-key { aspect-ratio: 1.4 / 1; font-size: 26px; font-weight: 700; color: #1e293b; background: #f1f5f9; border: none; border-radius: 14px; cursor: pointer; transition: background 0.12s, transform 0.05s; -webkit-tap-highlight-color: transparent; }
  .kp-key:hover { background: #e2e8f0; }
  .kp-key:active { background: #cbd5e1; transform: scale(0.96); }
  .kp-key.kp-del { background: #fef2f2; color: #dc2626; font-size: 24px; }
  .kp-key.kp-del:hover { background: #fee2e2; }
  .kp-key.kp-enter { background: #16a34a; color: #fff; font-size: 28px; }
  .kp-key.kp-enter:hover { background: #15803d; }
  .kp-err { min-height: 22px; margin-top: 14px; font-size: 14px; color: #dc2626; font-weight: 700; }
  /* 본인 확인 화면 */
  .cf-label { font-size: 15px; color: #64748b; margin-bottom: 18px; }
  .cf-name { font-size: 40px; font-weight: 800; color: #0369a1; margin-bottom: 10px; }
  .cf-info { font-size: 17px; color: #475569; margin-bottom: 32px; }
  .cf-btn-row { display: flex; gap: 12px; }
  .cf-btn { flex: 1; padding: 20px; font-size: 19px; font-weight: 800; border: none; border-radius: 16px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .cf-btn:active { transform: scale(0.97); }
  .cf-yes { background: #16a34a; color: #fff; }
  .cf-yes:hover { background: #15803d; }
  .cf-no { background: #f1f5f9; color: #64748b; border: 1.5px solid #cbd5e1; }
  .cf-no:hover { background: #e2e8f0; }

  /* 관리자 화면 (Phase 0 placeholder) */
  .admin-wrap { max-width: 1000px; margin: 0 auto; width: 100%; background: #fff; border-radius: 16px; padding: 28px; min-height: 60vh; }
  .admin-title { font-size: 20px; font-weight: 800; color: #075985; margin-bottom: 6px; }
  .admin-sub { font-size: 13px; color: #64748b; margin-bottom: 20px; }
  /* 일괄 등록 UI */
  .reg-section { margin-bottom: 24px; }
  .reg-step-title { font-size: 15px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
  .reg-hint { font-size: 12.5px; color: #64748b; line-height: 1.6; margin-bottom: 10px; }
  .reg-textarea { width: 100%; min-height: 140px; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 13px; font-family: "SF Mono","Menlo","Consolas",monospace; line-height: 1.6; outline: none; resize: vertical; box-sizing: border-box; }
  .reg-textarea:focus { border-color: #0369a1; }
  .reg-btn-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .reg-btn { padding: 10px 18px; border: none; border-radius: 9px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .reg-btn-parse { background: #0369a1; color: #fff; }
  .reg-btn-parse:hover { background: #075985; }
  .reg-btn-clear { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; }
  .reg-btn-clear:hover { background: #e2e8f0; }
  .reg-btn-save { background: #16a34a; color: #fff; }
  .reg-btn-save:hover { background: #15803d; }
  .reg-btn-save:disabled { background: #94a3b8; cursor: not-allowed; }
  .reg-btn-copy { background: #7c3aed; color: #fff; }
  .reg-btn-copy:hover { background: #6d28d9; }
  .reg-table-wrap { overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 4px; }
  .reg-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .reg-tbl th { background: #0369a1; color: #fff; padding: 8px 10px; text-align: left; font-weight: 700; white-space: nowrap; }
  .reg-tbl td { padding: 7px 10px; border-top: 1px solid #eef2f6; white-space: nowrap; }
  .reg-tbl tr:nth-child(even) td { background: #f8fafc; }
  .reg-tbl .code-cell { font-family: "SF Mono","Menlo","Consolas",monospace; font-weight: 700; color: #0369a1; }
  .reg-tbl .code-5 { color: #b45309; }
  .reg-tbl .err-cell { color: #dc2626; font-weight: 700; }
  .reg-tbl .warn-row td { background: #fef2f2 !important; }

  /* 인증 차단 오버레이 (관리자 모드 진입 시) */
  .sc-blocker {
    position: fixed; inset: 0; z-index: 200; display: none;
    background: rgba(15,23,42,0.96); flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center;
  }
  .sc-blocker.show { display: flex; }
  .sc-blocker .bk-card { background: #fff; border-radius: 18px; padding: 32px 28px; max-width: 380px; width: 100%; }
  .sc-blocker .bk-title { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
  .sc-blocker .bk-msg { font-size: 13.5px; color: #64748b; line-height: 1.6; margin-bottom: 18px; }
  .sc-blocker input {
    width: 100%; padding: 11px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px;
    font-size: 14px; outline: none; margin-bottom: 10px;
  }
  .sc-blocker input:focus { border-color: #0369a1; }
  .sc-blocker button {
    width: 100%; padding: 11px; background: #0369a1; color: #fff; border: none;
    border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .sc-blocker button:hover { background: #075985; }
  .sc-blocker .bk-err { font-size: 12.5px; color: #dc2626; min-height: 18px; margin-bottom: 6px; }
  .sc-blocker .bk-back { background: none; color: #94a3b8; font-size: 12px; margin-top: 8px; text-decoration: underline; cursor: pointer; padding: 4px; width: auto; }
</style>
</head>
<body>
<div class="sc-app">
  <!-- 상단 바 -->
  <div class="sc-topbar">
    <span class="tb-title">🏫 독서실 출결</span>
    <span class="tb-ver" id="sc-ver">v0.3-kiosk-code</span>
    <span class="tb-spacer"></span>
    <button class="tb-mode-btn" id="sc-mode-kiosk" onclick="scShowKiosk()" style="display:none">📱 키오스크</button>
    <button class="tb-mode-btn" id="sc-mode-admin" onclick="scRequestAdmin()">⚙️ 관리</button>
  </div>

  <div class="sc-body">
    <!-- 키오스크 화면 -->
    <div class="sc-screen active" id="sc-kiosk">
      <div class="kiosk-wrap">
        <!-- [키오스크 1] 코드 입력 화면 -->
        <div class="kiosk-card" id="kiosk-code-screen">
          <div class="kiosk-title">독서실 출결</div>
          <div class="kiosk-sub">학생 코드를 입력해주세요</div>
          <div class="kp-display" id="kp-display"><span class="kp-placeholder">····</span></div>
          <div class="kp-pad">
            <button class="kp-key" onclick="scKpPress('1')">1</button>
            <button class="kp-key" onclick="scKpPress('2')">2</button>
            <button class="kp-key" onclick="scKpPress('3')">3</button>
            <button class="kp-key" onclick="scKpPress('4')">4</button>
            <button class="kp-key" onclick="scKpPress('5')">5</button>
            <button class="kp-key" onclick="scKpPress('6')">6</button>
            <button class="kp-key" onclick="scKpPress('7')">7</button>
            <button class="kp-key" onclick="scKpPress('8')">8</button>
            <button class="kp-key" onclick="scKpPress('9')">9</button>
            <button class="kp-key kp-del" onclick="scKpDelete()">⌫</button>
            <button class="kp-key" onclick="scKpPress('0')">0</button>
            <button class="kp-key kp-enter" onclick="scKpSubmit()">✓</button>
          </div>
          <div class="kp-err" id="kp-err"></div>
        </div>

        <!-- [키오스크 2] 본인 확인 화면 -->
        <div class="kiosk-card" id="kiosk-confirm-screen" style="display:none">
          <div class="cf-label">본인이 맞나요?</div>
          <div class="cf-name" id="cf-name">—</div>
          <div class="cf-info" id="cf-info">—</div>
          <div class="cf-btn-row">
            <button class="cf-btn cf-yes" onclick="scConfirmYes()">네, 맞아요</button>
            <button class="cf-btn cf-no" onclick="scConfirmNo()">아니에요</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 관리자 화면 -->
    <div class="sc-screen" id="sc-admin">
      <div class="admin-wrap">
        <div class="admin-title">⚙️ 독서실 관리</div>
        <div class="admin-sub">독서실 학생 일괄 등록 · 코드 관리 (관리자 전용)</div>
        <div class="reg-section">
          <div class="reg-step-title">&#49;&#65039;&#8419; 데이터 붙여넣기</div>
          <div class="reg-hint">엑셀/시트에서 <b>학교 / 학년 / 이름 / 반명 / 핸드폰</b> 순서로 복사해 아래에 붙여넣으세요. (탭 또는 여러 칸 구분)</div>
          <textarea id="reg-paste" class="reg-textarea" placeholder="예시:&#10;개봉고&#9;1학년&#9;고준수&#9;독서실 원생&#9;010-1234-5678&#10;개봉고&#9;2학년&#9;김철수&#9;독서실 비원생&#9;010-9876-5432"></textarea>
          <div class="reg-btn-row">
            <button class="reg-btn reg-btn-parse" onclick="scParsePaste()">&#128269; 미리보기</button>
            <button class="reg-btn reg-btn-clear" onclick="scClearPaste()">지우기</button>
          </div>
        </div>

        <div class="reg-section" id="reg-preview-section" style="display:none">
          <div class="reg-step-title">&#50;&#65039;&#8419; 미리보기 · 코드 확인</div>
          <div class="reg-hint" id="reg-preview-summary"></div>
          <div class="reg-table-wrap" id="reg-preview-wrap"></div>
          <div class="reg-btn-row">
            <button class="reg-btn reg-btn-save" id="reg-save-btn" onclick="scRegisterAll()">&#128190; 전체 등록</button>
          </div>
        </div>

        <div class="reg-section" id="reg-result-section" style="display:none">
          <div class="reg-step-title">&#51;&#65039;&#8419; 등록 완료 · 코드 공지</div>
          <div class="reg-hint" id="reg-result-summary"></div>
          <div class="reg-table-wrap" id="reg-result-wrap"></div>
          <div class="reg-btn-row">
            <button class="reg-btn reg-btn-copy" onclick="scCopyCodes()">&#128203; 코드 전체 복사 (카톡 공지용)</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 관리자 인증 차단 오버레이 -->
<div class="sc-blocker" id="sc-blocker">
  <div class="bk-card">
    <div class="bk-title">🔒 관리자 인증</div>
    <div class="bk-msg">독서실 관리 기능은 관리자만 사용할 수 있습니다.<br>BMAPS 관리자 계정으로 로그인되어 있어야 합니다.</div>
    <div class="bk-err" id="sc-auth-err"></div>
    <button onclick="scCheckAdminAuth()">관리자 확인</button>
    <button class="bk-back" onclick="scCloseBlocker()">← 키오스크로 돌아가기</button>
  </div>
</div>

<script>
  /* ============================================================
     [SUPABASE] BMAPS 공유 인스턴스
  ============================================================ */
  const SUPABASE_URL = 'https://qtpftloyumtffvgurvqv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_XGP9n-2fuBQFuJlAA5MJ8w_R8JYIi9O';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  window.STUDYCENTER_VERSION = 'v0.3-kiosk-code';
  console.log('STUDYCENTER build:', window.STUDYCENTER_VERSION);

  /* ============================================================
     [STATE] 전역 상태
  ============================================================ */
  var scCurrentUser = null;   // 관리자 인증된 사용자 (kiosk는 인증 불필요)

  /* ============================================================
     [MODE] 화면 전환 — 키오스크(무인, 기본) ↔ 관리자(인증 필요)
  ============================================================ */
  /* ============================================================
     [KIOSK] 코드 입력 + 본인 확인 (Phase 2)
     숫자 키패드로 코드 입력 → reading_room_code 조회 → 이름·학교·학년 본인 확인.
     // code is 4-digit default, 5-digit on collision. input max 5.
  ============================================================ */
  var _scKpValue = "";          // 현재 입력 중인 코드
  var _scKioskStudent = null;   // 본인 확인 대상 학생
  var SC_KP_MAX = 5;            // 코드 최대 자릿수(5자리 승격 대응)

  function scKpRender(){
    var el = document.getElementById("kp-display");
    if(!el) return;
    if(!_scKpValue){
      el.innerHTML = '<span class="kp-placeholder">\u00b7\u00b7\u00b7\u00b7</span>';
    } else {
      el.textContent = _scKpValue;
    }
  }

  function scKpPress(d){
    var err = document.getElementById("kp-err"); if(err) err.textContent = "";
    if(_scKpValue.length >= SC_KP_MAX) return;
    _scKpValue += d;
    scKpRender();
  }

  function scKpDelete(){
    var err = document.getElementById("kp-err"); if(err) err.textContent = "";
    _scKpValue = _scKpValue.slice(0, -1);
    scKpRender();
  }

  function scKpClear(){
    _scKpValue = "";
    scKpRender();
  }

  // [확인] 버튼 → 코드로 학생 조회
  async function scKpSubmit(){
    var err = document.getElementById("kp-err");
    var code = _scKpValue.trim();
    if(code.length < 4){
      if(err) err.textContent = "코드는 4자리 이상입니다.";
      return;
    }
    if(err) err.textContent = "확인 중...";
    try {
      // reading_room_code 정확 매칭 (탈퇴/삭제 제외)
      var res = await db.from("users")
        .select("id, name, school, grade, reading_room_code, reading_room_class, required_study_minutes, status, deleted_at")
        .eq("reading_room_code", code)
        .eq("reading_room_yn", true);
      if(res.error) throw res.error;
      var rows = (res.data || []).filter(function(u){ return u.status !== "inactive" && !u.deleted_at; });
      if(rows.length === 0){
        if(err) err.textContent = "해당 코드의 학생을 찾을 수 없습니다.";
        return;
      }
      if(rows.length > 1){
        // 이론상 reading_room_code는 고유해야 함. 혹시 중복이면 안전하게 안내.
        if(err) err.textContent = "코드가 중복됩니다. 데스크에 문의하세요.";
        return;
      }
      // 본인 확인 화면으로
      _scKioskStudent = rows[0];
      scShowConfirm(rows[0]);
      if(err) err.textContent = "";
    } catch(e){
      console.error("코드 조회 실패:", e);
      if(err) err.textContent = "조회 오류. 다시 시도해주세요.";
    }
  }

  // 본인 확인 화면 표시
  function scShowConfirm(stu){
    document.getElementById("kiosk-code-screen").style.display = "none";
    document.getElementById("kiosk-confirm-screen").style.display = "";
    document.getElementById("cf-name").textContent = stu.name || "(이름없음)";
    var info = [];
    if(stu.school) info.push(stu.school);
    if(stu.grade) info.push(stu.grade);
    if(stu.reading_room_class) info.push(stu.reading_room_class);
    document.getElementById("cf-info").textContent = info.length ? info.join(" · ") : "—";
  }

  // [네, 맞아요] → (Phase 3에서 상태머신 동작 화면으로 연결)
  function scConfirmYes(){
    if(!_scKioskStudent) return;
    // Phase 3 placeholder: 일단 확인 완료 안내 후 초기 화면 복귀
    alert(_scKioskStudent.name + "님 확인되었습니다.\n(다음 단계에서 입실/외출/복귀/하원 버튼이 들어갑니다.)");
    scKioskReset();
  }

  // [아니에요] → 코드 입력으로 복귀
  function scConfirmNo(){
    scKioskReset();
  }

  // 키오스크 초기화 (코드 입력 화면으로)
  function scKioskReset(){
    _scKpValue = "";
    _scKioskStudent = null;
    var cs = document.getElementById("kiosk-confirm-screen"); if(cs) cs.style.display = "none";
    var ds = document.getElementById("kiosk-code-screen"); if(ds) ds.style.display = "";
    var err = document.getElementById("kp-err"); if(err) err.textContent = "";
    scKpRender();
  }

  /* ============================================================
     [REGISTER] 독서실 학생 일괄 등록 (Phase 1)
     붙여넣기: 학교 / 학년 / 이름 / 반명 / 핸드폰
     코드: 핸드폰 숫자 듷4자리, 충돌 시 이름 가나다순 후순위 5자리 승격.
  ============================================================ */
  var _scParsedRows = [];   // 미리보기 단계 데이터 [{school,grade,name,rrClass,phone,code,is5,err}]
  var _scResultRows = [];   // 등록 완료 데이터 [{name, code}]

  // 핸드폰 → 숫자만 추출
  function scPhoneDigits(phone){
    return String(phone || "").replace(/[^0-9]/g, "");
  }
  // 숫자만 추출한 핸드폰 → 듷4자리 (4자리 미만이면 null)
  function scLast4(phone){
    var d = scPhoneDigits(phone);
    if(d.length < 4) return null;
    return d.slice(-4);
  }
  // HTML escape
  function scEsc(v){
    return String(v == null ? "" : v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // 붙여넣기 텍스트 파싱 → 행 배열. 탭 우선, 없으면 2칸+ 공백 구분.
  function scSplitCells(line){
    if(line.indexOf("\t") !== -1) return line.split("\t");
    return line.split(/\s{2,}/);   // 2칸 이상 공백
  }

  // 기존 DB 코드 + 이번 배치를 합쳐 충돌 없는 코드 생성
  async function scGenerateCodes(rows){
    // 기존 DB의 모든 reading_room_code 수집 (충돌 방지)
    var existing = {};
    try {
      var res = await db.from("users").select("reading_room_code").not("reading_room_code","is",null);
      (res.data || []).forEach(function(u){ if(u.reading_room_code) existing[u.reading_room_code] = true; });
    } catch(e){ console.warn("기존 코드 조회 실패(무시 진행):", e); }

    // 듷4자리별 그룹핑 (이번 배치 내)
    var byLast4 = {};
    rows.forEach(function(r){
      r.last4 = scLast4(r.phone);
      if(r.last4 == null){ r.err = "핸드폰 오류"; r.code = null; return; }
      if(!byLast4[r.last4]) byLast4[r.last4] = [];
      byLast4[r.last4].push(r);
    });

    Object.keys(byLast4).forEach(function(last4){
      var group = byLast4[last4];
      // 이름 가나다순 정렬 (후순위가 5자리)
      group.sort(function(a,b){ return (a.name||"").localeCompare(b.name||"", "ko"); });
      // 기존 DB에 이미 같은 4자리가 있으면 첫번째도 승격 필요
      var baseConflict = !!existing[last4];
      group.forEach(function(r, idx){
        var needBump = baseConflict || idx > 0;
        if(!needBump){
          r.code = last4; r.is5 = false;
        } else {
          // 5자리 승격: last4 + suffix, 이미 쓰인 코드 피해 증가
          var suffix = 1;
          var cand = last4 + suffix;
          while(existing[cand]){ suffix++; cand = last4 + suffix; }
          r.code = cand; r.is5 = true;
        }
        existing[r.code] = true;   // 이번 배치 내에서도 충돌 방지
      });
    });
    return rows;
  }

  // [미리보기] 버튼
  async function scParsePaste(){
    var ta = document.getElementById("reg-paste");
    var raw = (ta && ta.value || "").trim();
    if(!raw){ alert("붙여넣은 데이터가 없습니다."); return; }
    var lines = raw.split(/\r?\n/).filter(function(l){ return l.trim(); });
    var rows = lines.map(function(line){
      var c = scSplitCells(line).map(function(x){ return (x||"").trim(); });
      // 학교/학년/이름/반명/핸드폰
      return {
        school: c[0] || "", grade: c[1] || "", name: c[2] || "",
        rrClass: c[3] || "", phone: c[4] || "",
        code: null, is5: false, err: ""
      };
    });
    // 필수값(이름/핸드폰) 검증
    rows.forEach(function(r){
      if(!r.name) r.err = "이름 없음";
      else if(scLast4(r.phone) == null) r.err = "핸드폰 오류";
    });
    // 코드 생성 (오류 없는 행만)
    var valid = rows.filter(function(r){ return !r.err; });
    await scGenerateCodes(valid);
    _scParsedRows = rows;
    scRenderPreview();
  }

  function scRenderPreview(){
    var sec = document.getElementById("reg-preview-section");
    var wrap = document.getElementById("reg-preview-wrap");
    var sum = document.getElementById("reg-preview-summary");
    if(!_scParsedRows.length){ sec.style.display = "none"; return; }
    var okCount = _scParsedRows.filter(function(r){ return !r.err; }).length;
    var errCount = _scParsedRows.length - okCount;
    var fiveCount = _scParsedRows.filter(function(r){ return r.is5; }).length;
    sum.innerHTML = "총 " + _scParsedRows.length + "명 · 정상 <b style=\"color:#16a34a\">" + okCount + "</b>명"
      + (errCount ? " · 오류 <b style=\"color:#dc2626\">" + errCount + "</b>명" : "")
      + (fiveCount ? " · 5자리 코드 <b style=\"color:#b45309\">" + fiveCount + "</b>명(충돌)" : "");
    var h = "<table class=\"reg-tbl\"><thead><tr><th>#</th><th>이름</th><th>학교</th><th>학년</th><th>반명</th><th>핸드폰</th><th>코드</th></tr></thead><tbody>";
    _scParsedRows.forEach(function(r, i){
      var codeCell = r.err
        ? "<span class=\"err-cell\">" + scEsc(r.err) + "</span>"
        : "<span class=\"code-cell" + (r.is5 ? " code-5" : "") + "\">" + scEsc(r.code) + "</span>";
      h += "<tr" + (r.err ? " class=\"warn-row\"" : "") + ">"
        + "<td>" + (i+1) + "</td>"
        + "<td><b>" + scEsc(r.name) + "</b></td>"
        + "<td>" + scEsc(r.school) + "</td>"
        + "<td>" + scEsc(r.grade) + "</td>"
        + "<td>" + scEsc(r.rrClass) + "</td>"
        + "<td>" + scEsc(r.phone) + "</td>"
        + "<td>" + codeCell + "</td></tr>";
    });
    h += "</tbody></table>";
    wrap.innerHTML = h;
    sec.style.display = "";
    document.getElementById("reg-result-section").style.display = "none";
  }

  function scClearPaste(){
    var ta = document.getElementById("reg-paste"); if(ta) ta.value = "";
    _scParsedRows = [];
    document.getElementById("reg-preview-section").style.display = "none";
    document.getElementById("reg-result-section").style.display = "none";
  }

  // [전체 등록] 버튼 → Supabase insert
  async function scRegisterAll(){
    var valid = _scParsedRows.filter(function(r){ return !r.err && r.code; });
    if(!valid.length){ alert("등록할 정상 데이터가 없습니다."); return; }
    if(!confirm(valid.length + "명을 독서실 학생으로 등록합니다.\n계속하시겠습니까?")) return;
    var btn = document.getElementById("reg-save-btn");
    if(btn){ btn.disabled = true; btn.textContent = "⏳ 등록 중..."; }
    try {
      var payload = valid.map(function(r){
        return {
          name: r.name, school: r.school || null, grade: r.grade || null,
          phone: r.phone || null, reading_room_class: r.rrClass || null,
          reading_room_code: r.code, reading_room_yn: true,
          role: "student", status: "active"
        };
      });
      var res = await db.from("users").insert(payload).select("id, name, reading_room_code");
      if(res.error) throw res.error;
      _scResultRows = (res.data || []).map(function(u){ return { name: u.name, code: u.reading_room_code }; });
      scRenderResult();
      if(btn){ btn.disabled = false; btn.textContent = "💾 전체 등록"; }
    } catch(e){
      console.error("등록 실패:", e);
      alert("등록 실패: " + (e.message || e));
      if(btn){ btn.disabled = false; btn.textContent = "💾 전체 등록"; }
    }
  }

  function scRenderResult(){
    var sec = document.getElementById("reg-result-section");
    var wrap = document.getElementById("reg-result-wrap");
    var sum = document.getElementById("reg-result-summary");
    sum.innerHTML = "✅ <b style=\"color:#16a34a\">" + _scResultRows.length + "명</b> 등록 완료! 아래 코드를 복사해 공지하세요.";
    var h = "<table class=\"reg-tbl\"><thead><tr><th>이름</th><th>코드</th></tr></thead><tbody>";
    _scResultRows.forEach(function(r){
      h += "<tr><td><b>" + scEsc(r.name) + "</b></td><td><span class=\"code-cell\">" + scEsc(r.code) + "</span></td></tr>";
    });
    h += "</tbody></table>";
    wrap.innerHTML = h;
    sec.style.display = "";
    document.getElementById("reg-preview-section").style.display = "none";
  }

  // [코드 전체 복사] 카톡 공지용 텍스트
  async function scCopyCodes(){
    if(!_scResultRows.length){ alert("복사할 코드가 없습니다."); return; }
    var text = _scResultRows.map(function(r){ return r.name + ": " + r.code; }).join("\n");
    try {
      await navigator.clipboard.writeText(text);
      alert("✅ 코드 " + _scResultRows.length + "개를 복사했습니다!\n카톡에 붙여넣기 하세요.");
    } catch(e){
      alert("복사 실패. 수동으로 복사하세요:\n\n" + text);
    }
  }

  function scShowKiosk(){
    document.getElementById('sc-kiosk').classList.add('active');
    document.getElementById('sc-admin').classList.remove('active');
    document.getElementById('sc-mode-kiosk').style.display = 'none';
    document.getElementById('sc-mode-admin').style.display = '';
  }

  function scShowAdmin(){
    document.getElementById('sc-admin').classList.add('active');
    document.getElementById('sc-kiosk').classList.remove('active');
    document.getElementById('sc-mode-kiosk').style.display = '';
    document.getElementById('sc-mode-admin').style.display = 'none';
  }

  // 관리 버튼 클릭 → 인증 차단 오버레이 표시
  function scRequestAdmin(){
    var errEl = document.getElementById('sc-auth-err');
    if(errEl) errEl.textContent = '';
    document.getElementById('sc-blocker').classList.add('show');
  }

  function scCloseBlocker(){
    document.getElementById('sc-blocker').classList.remove('show');
  }

  /* ============================================================
     [AUTH] 관리자 인증 — localStorage savedUserId → users → role
     키오스크는 인증 불필요. 관리 모드 진입 시에만 검사.
  ============================================================ */
  async function scCheckAdminAuth(){
    var errEl = document.getElementById('sc-auth-err');
    if(errEl) errEl.textContent = '확인 중...';
    try {
      var savedId = localStorage.getItem('savedUserId');
      if(!savedId){
        if(errEl) errEl.textContent = 'BMAPS에 먼저 로그인해주세요.';
        return;
      }
      var res = await db.from('users').select('id, name, role').eq('id', savedId).maybeSingle();
      if(res.error || !res.data){
        if(errEl) errEl.textContent = '사용자 정보를 찾을 수 없습니다.';
        return;
      }
      if(res.data.role !== 'admin'){
        if(errEl) errEl.textContent = '관리자 권한이 없는 계정입니다.';
        return;
      }
      // 인증 성공
      scCurrentUser = res.data;
      scCloseBlocker();
      scShowAdmin();
    } catch(e){
      if(errEl) errEl.textContent = '인증 오류: ' + (e.message || e);
    }
  }

  /* ============================================================
     [INIT]
  ============================================================ */
  window.addEventListener('DOMContentLoaded', function(){
    // 기본은 키오스크 모드 (학생 무인용)
    scShowKiosk();
  });
</script>
