<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMAPS · 국어 시험</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172c43;font:16px/1.6 system-ui,sans-serif}header{background:#123953;color:white;padding:14px 22px;display:flex;gap:20px;align-items:center}header a{color:white}main{max-width:1400px;margin:auto;padding:20px}section,.paper{background:white;padding:20px;border-radius:12px;margin-bottom:16px}button,input{font:inherit;padding:10px;border-radius:8px;border:1px solid #a9bac8}button{cursor:pointer;background:white;color:#123953}button:disabled{opacity:.5;cursor:default}.primary,.chosen{background:#086b9b;color:white}input{max-width:100%}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:#f1f5f9;padding:12px 0;z-index:2}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.paper img{display:block;width:100%;height:auto;cursor:zoom-in}.choices{display:flex;gap:10px;margin:18px 0}.choices button{flex:1;font-size:22px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.nav button[aria-current="true"]{outline:3px solid #0c668c}.saved{background:#d9f5e5}.hint{font-size:14px;color:#627589}#msg{white-space:pre-wrap}dialog{max-width:96vw;max-height:95vh}dialog img{max-width:none;width:1100px}dialog::backdrop{background:#0009}@media(max-width:760px){main{padding:10px}.layout{grid-template-columns:1fr}.paper{padding:10px}header{font-size:14px}.choices button{padding:8px}}
</style></head><body><header><strong>BMAPS · 국어 시험</strong><span id="who"></span><a href="index.html">BMAPS</a><button id="logout" hidden>로그아웃</button></header><main>
<section id="login"><h1>국어 시험 응시</h1><p>본인의 BMAPS 학생 계정으로 로그인하세요.</p><input id="username" autocomplete="username" placeholder="아이디" aria-label="아이디"> <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호"> <button id="login-button" class="primary">로그인</button></section>
<p id="msg" role="status"></p><section id="list" hidden><h2>배정된 국어 시험</h2><button id="refresh">새로고침</button><div id="exams"></div></section>
<div id="exam" hidden><div class="bar"><strong id="title"></strong><span id="timer" role="timer"></span><span id="save-state" class="hint"></span><button id="submit" class="primary">답안 제출</button></div><div id="navigator" class="nav"></div><div class="layout"><article class="paper"><h2>공통 지문</h2><div id="passage"></div></article><article class="paper"><h2 id="question-title"></h2><div id="question"></div><div id="choices" class="choices"></div><button id="clear">답 지우기</button><p><button id="prev">이전 문항</button> <button id="next">다음 문항</button></p></article></div></div>
<section id="result" hidden></section><dialog id="zoom"><button id="zoom-close">확대 닫기</button><div><img id="zoom-image" alt="원본 확대"></div></dialog>
</main><script src="assets/ko-student.js"></script></body></html>
