<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>베스티안 스터디센터 · 실시간 학습 현황 [lobby v1.0]</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg-0:#0a1525; --bg-1:#102036; --card:#152844; --card-2:#1b3358;
    --line:#26426b; --ink:#eaf1fb; --ink-dim:#8ba6cc;
    --gold:#f6c95a; --gold-deep:#e0a52c; --teal:#54d6c6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Pretendard',system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 720px at 50% -12%, #16294a 0%, var(--bg-0) 60%);
    color:var(--ink); overflow:hidden;
    height:100vh; display:flex; flex-direction:column;
    padding:clamp(16px,2vw,34px);
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:clamp(12px,1.5vw,24px); margin-bottom:clamp(12px,1.5vw,24px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:baseline; gap:clamp(8px,0.9vw,16px); flex-wrap:wrap;}
  .brand .logo{
    font-size:clamp(22px,2.3vw,42px); font-weight:800; letter-spacing:-0.02em;
    background:linear-gradient(92deg,var(--gold),#fce8b0);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand .sub{font-size:clamp(13px,1.1vw,21px); color:var(--ink-dim); font-weight:600;}
  .clock{text-align:right; flex-shrink:0;}
  .clock .date{font-size:clamp(13px,1vw,19px); color:var(--ink-dim); font-weight:600;}
  .clock .time{font-size:clamp(20px,2vw,38px); font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:0.02em;}
  .boards{flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(12px,1.3vw,24px); min-height:0;}
  .board{
    background:linear-gradient(180deg,var(--card),var(--bg-1));
    border:1px solid var(--line); border-radius:18px;
    padding:clamp(14px,1.4vw,28px); display:flex; flex-direction:column; min-height:0;
    box-shadow:0 18px 44px -22px rgba(0,0,0,0.65);
  }
  .board-head{margin-bottom:clamp(10px,1vw,18px); flex-shrink:0;}
  .board-title{font-size:clamp(17px,1.55vw,30px); font-weight:800; letter-spacing:-0.01em;}
  .board-range{font-size:clamp(12px,0.95vw,18px); color:var(--ink-dim); font-weight:600; margin-top:4px;}
  .list{flex:1; display:flex; flex-direction:column; gap:clamp(5px,0.55vw,10px); min-height:0; overflow:hidden;}
  .row{
    display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:clamp(8px,0.8vw,16px);
    padding:clamp(7px,0.7vw,13px) clamp(9px,0.9vw,16px);
    background:rgba(255,255,255,0.025); border:1px solid transparent; border-radius:12px;
    animation:rise 0.5s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
  .medal{
    width:clamp(28px,2.4vw,48px); height:clamp(28px,2.4vw,48px); border-radius:50%;
    display:grid; place-items:center; font-weight:800; font-size:clamp(14px,1.2vw,23px);
    background:var(--card-2); color:var(--ink-dim); font-variant-numeric:tabular-nums; flex-shrink:0;
  }
  .name{font-size:clamp(15px,1.32vw,26px); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .time{font-size:clamp(15px,1.36vw,27px); font-weight:800; color:var(--teal); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .row.r1{background:linear-gradient(95deg,rgba(246,201,90,0.17),rgba(246,201,90,0.04)); border-color:rgba(246,201,90,0.38);}
  .row.r1 .medal{background:linear-gradient(150deg,var(--gold),var(--gold-deep)); color:#3a2700; animation:glow 2.6s ease-in-out infinite;}
  .row.r1 .time{color:var(--gold);}
  @keyframes glow{0%,100%{box-shadow:0 0 13px rgba(246,201,90,0.34);}50%{box-shadow:0 0 26px rgba(246,201,90,0.62);}}
  .row.r2 .medal{background:linear-gradient(150deg,#e6eef8,#aab9cf); color:#2b3a4d;}
  .row.r3 .medal{background:linear-gradient(150deg,#e0a877,#b9743f); color:#3a1e0a;}
  .empty{flex:1; display:grid; place-items:center; color:var(--ink-dim); font-size:clamp(14px,1.1vw,21px); text-align:center; line-height:1.7;}
  footer{margin-top:clamp(10px,1vw,18px); text-align:center; color:var(--ink-dim); font-size:clamp(11px,0.85vw,16px); font-weight:600;}
  .dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--teal); margin-right:8px; vertical-align:middle; animation:pulse 1.9s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
</style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">베스티안 스터디센터</span>
      <span class="sub">실시간 학습 현황</span>
    </div>
    <div class="clock">
      <div class="date" id="clk-date">—</div>
      <div class="time" id="clk-time">--:--:--</div>
    </div>
  </header>
  <div class="boards">
    <section class="board">
      <div class="board-head"><div class="board-title">어제의 학습왕</div><div class="board-range" id="rng-y">—</div></div>
      <div class="list" id="board-y"></div>
    </section>
    <section class="board">
      <div class="board-head"><div class="board-title">지난주 누적</div><div class="board-range" id="rng-w">—</div></div>
      <div class="list" id="board-w"></div>
    </section>
    <section class="board">
      <div class="board-head"><div class="board-title">이번 달 누적</div><div class="board-range" id="rng-m">—</div></div>
      <div class="list" id="board-m"></div>
    </section>
  </div>
  <footer><span class="dot"></span><span id="foot">불러오는 중…</span></footer>
<script>
  const SUPABASE_URL='https://qtpftloyumtffvgurvqv.supabase.co';
  const SUPABASE_KEY='sb_publishable_XGP9n-2fuBQFuJlAA5MJ8w_R8JYIi9O';
  const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const WD=['일','월','화','수','목','금','토'];

  function t2m(t){ if(!t) return null; var p=String(t).split(':'); if(p.length<2) return null; return parseInt(p[0],10)*60+parseInt(p[1],10); }
  function calcDaily(row){
    if(!row||!row.check_in_time||!row.check_out_time) return null;
    var ci=t2m(row.check_in_time), co=t2m(row.check_out_time);
    if(row.check_out_is_next_day) co+=1440; if(co<ci) co+=1440;
    var total=co-ci;
    if(row.out_1_start&&row.out_1_end){ var s1=t2m(row.out_1_start),e1=t2m(row.out_1_end); if(row.out_1_end_is_next_day)e1+=1440; if(e1<s1)e1+=1440; total-=(e1-s1); }
    if(row.out_2_start&&row.out_2_end){ var s2=t2m(row.out_2_start),e2=t2m(row.out_2_end); if(row.out_2_end_is_next_day)e2+=1440; if(e2<s2)e2+=1440; total-=(e2-s2); }
    total-=(row.extra_out_minutes||0);
    return Math.max(0,total);
  }
  // 독서실 영업일 기준 '오늘' Date (01:10 이전은 전날)
  function rrToday(){
    var d=new Date(); var h=d.getHours(),m=d.getMinutes();
    if(h<1||(h===1&&m<10)){ d.setDate(d.getDate()-1); }
    return d;
  }
  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function md(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
  function mdw(d){ return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'; }
  function fmtDur(min){ var h=Math.floor(min/60),m=min%60; return h+'시간 '+String(m).padStart(2,'0')+'분'; }
  function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function maskName(name){ name=String(name||''); if(name.length<=1) return name; return name[0]+'○'.repeat(name.length-1); }
  function label(s){ var p=[]; if(s.school)p.push(s.school); if(s.grade)p.push(s.grade+'학년'); p.push(maskName(s.name)); return p.join(' '); }

  function periods(){
    var today=rrToday(); today.setHours(0,0,0,0);
    var yest=new Date(today); yest.setDate(today.getDate()-1);
    var dow=today.getDay(); var toMon=(dow===0)?-6:(1-dow);
    var thisMon=new Date(today); thisMon.setDate(today.getDate()+toMon);
    var lastMon=new Date(thisMon); lastMon.setDate(thisMon.getDate()-7);
    var lastSun=new Date(lastMon); lastSun.setDate(lastMon.getDate()+6);
    var mStart=new Date(today.getFullYear(),today.getMonth(),1);
    var qStart=new Date(Math.min(mStart.getTime(),lastMon.getTime()));
    return {yest,lastMon,lastSun,mStart,
      yestStr:ymd(yest), lastMonStr:ymd(lastMon), lastSunStr:ymd(lastSun),
      mStartStr:ymd(mStart), mEndStr:ymd(yest),
      qStartStr:ymd(qStart), qEndStr:ymd(yest)};
  }

  async function load(){
    var P=periods();
    var us=await db.from('users').select('id,name,school,grade').eq('reading_room_yn',true);
    if(us.error) throw us.error;
    var stu={}; (us.data||[]).forEach(function(s){ stu[s.id]=s; });
    var att=await db.from('reading_room_attendance')
      .select('student_id,attend_date,check_in_time,check_out_time,check_out_is_next_day,out_1_start,out_1_end,out_1_end_is_next_day,out_2_start,out_2_end,out_2_end_is_next_day,extra_out_minutes')
      .gte('attend_date',P.qStartStr).lte('attend_date',P.qEndStr);
    if(att.error) throw att.error;
    var rows=(att.data||[]).filter(function(r){ return r.check_out_time; });
    var yMap={},wMap={},mMap={};
    rows.forEach(function(r){
      var net=calcDaily(r); if(net==null) return; var d=r.attend_date;
      if(d===P.yestStr) yMap[r.student_id]=(yMap[r.student_id]||0)+net;
      if(d>=P.lastMonStr&&d<=P.lastSunStr) wMap[r.student_id]=(wMap[r.student_id]||0)+net;
      if(d>=P.mStartStr&&d<=P.mEndStr) mMap[r.student_id]=(mMap[r.student_id]||0)+net;
    });
    function top10(map){
      return Object.keys(map).map(function(sid){ return {st:stu[sid],total:map[sid]}; })
        .filter(function(x){ return x.st; })
        .sort(function(a,b){ return b.total-a.total; }).slice(0,10);
    }
    return {P, y:top10(yMap), w:top10(wMap), m:top10(mMap)};
  }

  function render(elId, list){
    var el=document.getElementById(elId);
    if(!list.length){ el.innerHTML='<div class="empty">아직 집계된 기록이 없습니다<br>하원이 완료되면 순위가 표시됩니다</div>'; return; }
    var h='';
    list.forEach(function(x,i){
      var r=i+1; var cls=r<=3?(' r'+r):'';
      h+='<div class="row'+cls+'" style="animation-delay:'+(i*60)+'ms">'
        +'<div class="medal">'+r+'</div>'
        +'<div class="name">'+esc(label(x.st))+'</div>'
        +'<div class="time">'+fmtDur(x.total)+'</div>'
        +'</div>';
    });
    el.innerHTML=h;
  }

  function tick(){
    var d=new Date();
    var de=document.getElementById('clk-date'), te=document.getElementById('clk-time');
    if(de) de.textContent=mdw(d);
    if(te) te.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
  }

  async function refresh(){
    try{
      var data=await load();
      document.getElementById('rng-y').textContent=mdw(data.P.yest);
      document.getElementById('rng-w').textContent=md(data.P.lastMon)+' ~ '+md(data.P.lastSun);
      document.getElementById('rng-m').textContent=md(data.P.mStart)+' ~ '+md(data.P.yest);
      render('board-y',data.y); render('board-w',data.w); render('board-m',data.m);
      var now=new Date();
      document.getElementById('foot').textContent='마지막 갱신 '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+' · 60초마다 자동 갱신';
    }catch(e){
      document.getElementById('foot').textContent='데이터를 불러오지 못했습니다 · 다음 갱신에 다시 시도합니다';
      console.error('lobby refresh error', e);
    }
  }

  tick(); setInterval(tick,1000);
  refresh(); setInterval(refresh,60000);
</script>
</body>
</html>
