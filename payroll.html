<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>급여 관리 — BMAPS</title>
<style>
  :root{
    --maroon:#1b6e4d; --maroon-d:#134e37; --maroon-l:#e7f3ec;
    --ink:#1f2430; --mut:#6b7280; --line:#e6e8ec; --bg:#f5f6f8; --card:#ffffff;
    --ok:#0f766e; --warn:#b45309;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  header.top{background:var(--maroon);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px}
  header.top h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.2px}
  header.top .badge{font-size:11px;font-weight:700;background:rgba(255,255,255,.18);
    padding:3px 9px;border-radius:999px;letter-spacing:.3px}
  header.top .sp{margin-left:auto;font-size:12px;opacity:.85}
  main{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px 22px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px}
  .panel .ph{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .panel .ph h2{margin:0;font-size:13px;font-weight:800;color:var(--ink)}
  .panel .pb{padding:12px 14px}
  /* staff list */
  .stafflist{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow-y:auto;padding-right:2px}
  .staff{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;transition:background .12s}
  .staff:hover{background:#f3f4f6}
  .staff.sel{background:var(--maroon-l);border-color:#f3d3dd}
  .staff .nm{font-weight:700;font-size:13px}
  .staff .ty{font-size:11px;color:var(--mut);margin-left:auto;white-space:nowrap}
  .staff .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0}
  .staff.off .dot{background:#cbd5e1}
  .staff.off .nm{color:var(--mut)}
  .btn{font:inherit;border:none;border-radius:9px;padding:8px 13px;font-weight:700;cursor:pointer;font-size:13px}
  .btn.pri{background:var(--maroon);color:#fff}
  .btn.pri:hover{background:var(--maroon-d)}
  .btn.gho{background:#fff;border:1.5px solid var(--line);color:#374151}
  .btn.gho:hover{border-color:#cbd5e1}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
  .addbtn{width:100%;margin-top:8px}
  /* detail */
  .dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .dhead .dnm{font-size:18px;font-weight:800}
  .dhead .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef2f7;color:#475569}
  .dhead .tag.mt{background:#fef3c7;color:#92400e}
  .monthnav{display:flex;align-items:center;gap:8px;margin-left:auto}
  .monthnav .mlabel{font-weight:800;font-size:15px;min-width:96px;text-align:center}
  .monthnav button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:15px}
  .monthnav button:hover{border-color:#cbd5e1}
  /* rate history */
  .rates{margin-top:6px}
  .ratetable{width:100%;border-collapse:collapse;font-size:13px}
  .ratetable th,.ratetable td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
  .ratetable th{font-size:11px;color:var(--mut);font-weight:700;background:#fafbfc}
  .ratetable td.num{text-align:right;font-variant-numeric:tabular-nums}
  .rate-now{color:var(--maroon);font-weight:800}
  /* worklog table */
  .wlwrap{margin-top:6px;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
  table.wl{width:100%;border-collapse:collapse;font-size:13px}
  table.wl th,table.wl td{padding:5px 8px;border-bottom:1px solid #eef0f3;white-space:nowrap}
  table.wl thead th{position:sticky;top:0;background:#f7f8fa;z-index:1;font-size:11px;color:var(--mut);font-weight:700;text-align:center}
  table.wl thead tr:nth-child(2) th{top:26px}
  table.wl thead th.grp{color:var(--ink);border-bottom:2px solid var(--line)}
  table.wl td.day{font-weight:700;text-align:center;width:78px}
  table.wl td.day .dow{font-weight:500;color:var(--mut);margin-left:4px;font-size:11px}
  table.wl tr.sun td.day{color:#dc2626}
  table.wl tr.sat td.day{color:#2563eb}
  table.wl .tcell{display:grid;grid-template-columns:30px 54px 30px;align-items:center;gap:0;justify-content:center}
  table.wl .tcell .tinput{grid-column:2}
  table.wl .tinput{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:54px;text-align:center;background:#fff;font-variant-numeric:tabular-nums;letter-spacing:.5px}
  table.wl .tinput:focus{outline:none;border-color:var(--maroon);box-shadow:0 0 0 2px var(--maroon-l)}
  table.wl .tinput.bad{border-color:#dc2626;background:#fef2f2}
  table.wl .ampm{grid-column:3;width:30px;text-align:center;overflow:hidden}
  table.wl .ampm .am,table.wl .ampm .pm{font-size:10px;font-weight:800;padding:2px 5px;border-radius:5px;white-space:nowrap}
  table.wl .ampm .am{background:#e0f2fe;color:#0369a1}
  table.wl .ampm .nx{font-size:10px;font-weight:800;padding:2px 5px;border-radius:5px;white-space:nowrap;background:#ede9fe;color:#6d28d9}
  table.wl .ampm .pm{background:#fff1e6;color:#c2410c}
  table.wl td.dur{text-align:center;font-variant-numeric:tabular-nums;color:#374151;width:62px}
  table.wl td.dur.z{color:#cbd5e1}
  table.wl tr:hover td{background:#fcfcfd}
  .mtcol-off table.wl .mt{display:none}
  table.wl th.mt,table.wl td.mt{background:#faf6fb}
  table.wl .mtedge{border-left:2px solid #d9bdd7}
  table.wl th.memohead{color:var(--ink);border-bottom:2px solid var(--line)}
  .viewsel{font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-weight:600;color:var(--ink)}
  table.wl td.memo{white-space:normal;min-width:130px;background:#fffdf6}
  table.wl .memoinput{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:4px 7px;width:100%;background:#fff;box-sizing:border-box}
  table.wl .memoinput:focus{outline:none;border-color:var(--maroon);box-shadow:0 0 0 2px var(--maroon-l)}
  /* summary */
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .scard{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:#fff}
  .scard .sl{font-size:11px;color:var(--mut);font-weight:700;margin-bottom:4px}
  .scard .sv{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .scard.gross{background:#fafbfc}
  .scard.net{background:var(--maroon);border-color:var(--maroon)}
  .scard.net .sl{color:rgba(255,255,255,.8)}
  .scard.net .sv{color:#fff}
  .scard .sub{font-size:11px;color:var(--mut);margin-top:3px}
  .scard.net .sub{color:rgba(255,255,255,.75)}
  .hint{font-size:12px;color:var(--mut);margin:8px 2px 0}
  .empty{padding:60px 20px;text-align:center;color:var(--mut)}
  .empty .ic{font-size:32px;margin-bottom:8px}
  /* modal */
  .mback{display:none;position:fixed;inset:0;background:rgba(15,18,25,.5);z-index:50;align-items:center;justify-content:center;padding:20px}
  .mbox{background:#fff;border-radius:14px;width:100%;max-width:380px;overflow:hidden}
  .mbox .mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800;font-size:15px}
  .mbox .mc{padding:16px 18px;display:flex;flex-direction:column;gap:11px}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:12px;font-weight:700;color:#475569}
  .fld input,.fld select{font:inherit;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--maroon)}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
  .mbox .mf{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  @media(max-width:820px){ main{grid-template-columns:1fr} }
  /* 분원 관리 */
  .brrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
  .brrow .brnm{font-weight:600;font-size:13px;color:var(--ink)}
  .brrow .brcnt{font-size:11px;color:var(--mut)}
  .brrow .brsp{margin-left:auto}
  .brrow button{font-size:11px;padding:3px 8px}
  .staff .br{font-size:11px;color:var(--maroon);margin-left:6px;background:var(--maroon-l);padding:1px 6px;border-radius:6px}
  .dnm-br{font-size:12px;color:var(--maroon);font-weight:600;margin-left:8px;background:var(--maroon-l);padding:2px 8px;border-radius:6px}
  .del-staff{color:#b91c1c;border-color:#e7b8b8;margin-left:8px;font-size:12px;padding:4px 10px;align-self:center}
  .del-staff:hover{background:#fdf2f2}
  .mgrbtn{width:100%;margin-top:6px}
  .staff-actions{padding:10px 12px 10px;border-bottom:1px solid var(--line)}
  .sa-label{font-size:11px;color:var(--mut);margin-bottom:6px;font-weight:600}
  .sa-btns{display:flex;gap:6px}
  .sa-btns button{flex:1;font-size:11px;padding:6px 0;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);cursor:pointer}
  .sa-btns button:hover{background:var(--maroon-l);color:var(--maroon);border-color:#cde6d9}
  .sa-btns .del-act{color:#b91c1c}
  .sa-btns .del-act:hover{background:#fdf2f2;color:#b91c1c;border-color:#e7b8b8}
  .stafffilter{display:flex;gap:6px;padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .stafffilter select{flex:0 0 auto;max-width:46%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:12px;background:#fff;color:var(--ink)}
  .stafffilter input{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:12px}
  /* 알바 로그인 / 본인 모드 */
  body.staffmode aside.panel{display:none}
  body.staffmode main{grid-template-columns:1fr}
  .logoutbtn{margin-left:auto}
  .loginback{position:fixed;inset:0;background:linear-gradient(160deg,#0f3d2c 0%,#1b6e4d 55%,#134e37 100%);display:none;align-items:center;justify-content:center;z-index:200}
  .loginback.show{display:flex}
  .loginbox{background:#fff;border-radius:16px;padding:28px 24px;width:340px;max-width:92vw;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .login-brand{font-size:13px;font-weight:800;letter-spacing:3px;color:var(--maroon);text-align:center;margin-bottom:2px}
  .loginbox h2{margin:0 0 18px;font-size:18px;color:var(--ink);text-align:center}
  .login-switch{width:100%;margin-top:14px;background:none;border:none;color:var(--mut);font-size:13px;cursor:pointer;padding:6px}
  .login-switch:hover{color:var(--maroon);text-decoration:underline}
  .loginbox select,.loginbox .pininput,.loginbox .logininput{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-bottom:10px;box-sizing:border-box}
  .pininput{letter-spacing:8px;text-align:center;font-size:22px;font-weight:700}
  .login-msg{font-size:13px;margin:6px 0 0;min-height:18px;color:var(--mut)}
  .login-msg.err{color:#b91c1c}
  .login-msg.ok{color:var(--maroon)}
  .pin-status{font-size:13px;padding:10px 12px;background:var(--bg);border-radius:8px;color:var(--ink);font-weight:600}
  .pin-status .lock{color:#b91c1c}
</style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="top">
  <h1>급여 관리</h1>
  <span class="badge">실데이터 연동</span>
  <span class="sp">관리자 · 알바 급여 관리</span>
  <button class="btn gho logoutbtn" id="logoutBtn" style="display:none" onclick="staffLogout()">로그아웃</button>
</header>

<main>
  <!-- 좌: 알바 목록 -->
  <aside class="panel">
    <div class="ph"><h2>알바</h2><span style="margin-left:auto;font-size:11px;color:var(--mut)" id="staffCount"></span></div>
    <div class="pb">
      <div class="staff-actions">
        <div class="sa-label" id="saLabel">알바를 선택하세요</div>
        <div class="sa-btns">
          <button onclick="actPin()">PIN 관리</button>
          <button onclick="actRate()">시급 변경</button>
          <button class="del-act" onclick="actDel()">삭제</button>
        </div>
      </div>
      <div class="stafffilter">
        <select id="flt_branch" onchange="renderStaffList()"></select>
        <input id="flt_name" placeholder="이름 검색" oninput="renderStaffList()">
      </div>
      <div class="stafflist" id="stafflist"></div>
      <button class="btn pri addbtn" onclick="openAddStaff()">+ 알바 등록</button>
      <button class="btn gho mgrbtn" onclick="openBranchMgr()">분원 관리</button>
    </div>
  </aside>

  <!-- 우: 상세 -->
  <section class="panel" id="detailPanel">
    <div class="pb" id="detailBody">
      <div class="empty"><div class="ic">👋</div>왼쪽에서 알바를 선택하세요.</div>
    </div>
  </section>
</main>

<!-- 알바 로그인 게이트 -->
<div class="loginback" id="staffLogin">
  <div class="loginbox">
    <div class="login-brand">BMAPS</div>
    <h2 id="login_title">알바 로그인</h2>
    <div id="staff_login_area">
      <select id="login_branch" onchange="onLoginReset()"><option value="">분원 선택</option></select>
      <input class="logininput" id="login_name" placeholder="이름 입력" autocomplete="off" oninput="onLoginReset()" onkeydown="if(event.key==='Enter')onLoginIdentify()">
      <button class="btn pri" style="width:100%;margin-bottom:10px" onclick="onLoginIdentify()">확인</button>
      <div id="login_pin_area" style="display:none">
        <input class="pininput" id="login_pin" inputmode="numeric" maxlength="4" placeholder="PIN 4자리" autocomplete="off" onkeydown="if(event.key==='Enter')onLoginSubmit()">
        <input class="pininput" id="login_pin2" inputmode="numeric" maxlength="4" placeholder="PIN 확인" autocomplete="off" style="display:none" onkeydown="if(event.key==='Enter')onLoginSubmit()">
        <button class="btn pri" style="width:100%" onclick="onLoginSubmit()">확인</button>
      </div>
    </div>
    <div id="admin_login_area" style="display:none">
      <input class="logininput" id="admin_user" placeholder="관리자 아이디" autocomplete="off" onkeydown="if(event.key==='Enter')onAdminLogin()">
      <input class="logininput" id="admin_pw" type="password" placeholder="비밀번호" autocomplete="off" onkeydown="if(event.key==='Enter')onAdminLogin()">
      <button class="btn pri" style="width:100%" onclick="onAdminLogin()">관리자 로그인</button>
    </div>
    <div class="login-msg" id="login_msg"></div>
    <button class="login-switch" id="login_switch" onclick="toggleLoginMode()">관리자 로그인 →</button>
  </div>
</div>

<!-- 알바 등록 모달 -->
<div class="mback" id="addStaffModal">
  <div class="mbox">
    <div class="mh">알바 등록</div>
    <div class="mc">
      <div class="fld"><label>이름</label><input id="as_name" placeholder="예: 홍길동"></div>
      <div class="fld"><label>분원</label><select id="as_branch"></select></div>
      <label class="chk"><input type="checkbox" id="as_mt"> 멘토링 업무 포함 (시급 별도)</label>
      <div class="fld"><label>첫 시급 — 적용 시작월</label><input type="month" id="as_ym" value="2026-01"></div>
      <div class="fld"><label>일반 시급 (원/시간)</label><input type="number" id="as_rn" value="10800" step="100"></div>
      <div class="fld" id="as_rm_fld" style="display:none"><label>멘토링 시급 (원/시간)</label><input type="number" id="as_rm" value="12000" step="100"></div>
      <div class="fld" id="as_mt_period_fld" style="display:none"><label>멘토링 기간 (시작일 ~ 종료일)</label><div style="display:flex;gap:8px;align-items:center"><input type="date" id="as_mt_start" style="flex:1"><span style="color:var(--mut)">~</span><input type="date" id="as_mt_end" style="flex:1"></div></div>
    </div>
    <div class="mf">
      <button class="btn gho" onclick="closeModal('addStaffModal')">취소</button>
      <button class="btn pri" onclick="addStaff()">등록</button>
    </div>
  </div>
</div>

<!-- 시급 변경 모달 -->
<div class="mback" id="addRateModal">
  <div class="mbox">
    <div class="mh">시급 변경 — <span id="rt_staff_name" style="color:var(--maroon)"></span></div>
    <div class="mc">
      <div class="fld"><label>적용 시작월</label><input type="month" id="rt_ym" value="2026-01" onchange="rtRefreshMentoring()"></div>
      <div class="fld"><label>일반 시급</label><input type="number" id="rt_rn" step="100"></div>
      <div id="rt_mt_section">
        <div class="fld" id="rt_mt_existing" style="display:none"><label>멘토링 시급 <span id="rt_mt_range" style="color:var(--mut);font-weight:400;font-size:11px"></span></label><input type="number" id="rt_rm" step="100"></div>
        <div id="rt_mt_add" style="display:none">
          <label class="chk"><input type="checkbox" id="rt_mt_addchk" onchange="rtToggleAdd()"> 멘토링 추가</label>
          <div id="rt_mt_addfld" style="display:none">
            <div class="fld"><label>멘토링 기간 (시작일 ~ 종료일)</label><div style="display:flex;gap:8px;align-items:center"><input type="date" id="rt_mt_start" style="flex:1"><span style="color:var(--mut)">~</span><input type="date" id="rt_mt_end" style="flex:1"></div></div>
            <div class="fld"><label>멘토링 시급</label><input type="number" id="rt_mt_addrate" value="12000" step="100"></div>
          </div>
        </div>
      </div>
      <p class="hint">이 시작월부터 다음 변경 전까지 적용됩니다.</p>
    </div>
    <div class="mf">
      <button class="btn gho" onclick="closeModal('addRateModal')">취소</button>
      <button class="btn pri" onclick="addRate()">추가</button>
    </div>
  </div>
</div>

<div class="mback" id="branchModal">
  <div class="mbox">
    <div class="mh">분원 관리</div>
    <div class="mc">
      <div id="branchList"></div>
      <div class="fld" style="display:flex;gap:6px;align-items:flex-end;margin-top:8px">
        <div style="flex:1"><label>새 분원 추가</label><input id="br_name" placeholder="예: 개봉 / 철산 / 청라"></div>
        <button class="btn pri" onclick="addBranch()">추가</button>
      </div>
      <p class="hint">분원에 배정된 알바가 있으면 삭제할 수 없습니다.</p>
    </div>
    <div class="mf">
      <button class="btn gho" onclick="closeModal('branchModal')">닫기</button>
    </div>
  </div>
</div>

<div class="mback" id="pinModal">
  <div class="mbox">
    <div class="mh">PIN 관리 — <span id="pin_staff_name"></span></div>
    <div class="mc">
      <div class="pin-status" id="pin_status">상태 조회 중…</div>
      <div class="fld" style="display:flex;gap:6px;align-items:flex-end;margin-top:10px">
        <div style="flex:1"><label>임시 PIN 부여 (4자리)</label><input id="pin_temp" inputmode="numeric" maxlength="4" placeholder="예: 0000" autocomplete="off"></div>
        <button class="btn pri" onclick="adminSetPin()">부여</button>
      </div>
      <div style="display:flex;gap:6px;margin-top:10px">
        <button class="btn gho" onclick="adminResetPin()">PIN 초기화</button>
        <button class="btn gho" onclick="adminUnlock()">잠금 해제</button>
      </div>
      <p class="hint">초기화하면 알바가 다음 로그인 때 새 PIN을 설정합니다. 임시 PIN은 알바에게 직접 전달하세요(저장은 해시).</p>
    </div>
    <div class="mf">
      <button class="btn gho" onclick="closeModal('pinModal')">닫기</button>
    </div>
  </div>
</div>

<script>

/* ============================================================

const WITHHOLD = 0.033; // 3.3% 원천징수
const DOW = ['일','월','화','수','목','금','토'];

function t2m(s){
  if(!s) return null;
  var p = String(s).split(':');
  if(p.length < 2) return null;
  var h = parseInt(p[0],10), m = parseInt(p[1],10);
  if(isNaN(h) || isNaN(m)) return null;
  return h*60 + m;
}
// 근무시간(분). 퇴근<출근이면 자정 넘김 → +24h
function dur(inS, outS){
  var a = t2m(inS), b = t2m(outS);
  if(a==null || b==null) return 0;
  if(b < a) b += 1440;
  return b - a;
}
function m2hm(min){
  if(!min) return '0:00';
  var h = Math.floor(min/60), m = min%60;
  return h + ':' + String(m).padStart(2,'0');
}
function won(n){ return '₩' + Math.round(n).toLocaleString('ko-KR'); }

// 해당 월(ym='YYYY-MM')에 적용되는 시급 = 시작월<=ym 중 가장 최근
function rateFor(staffId, ym){
  var rs = DB.rates.filter(r => r.staff_id===staffId && r.ym <= ym)
                   .sort((a,b)=> a.ym < b.ym ? 1 : -1);
  return rs[0] || null;
}
// 멘토링: 조회월(ym)이 걸치는 기간(start~end, 월 단위) 반환
function mentoringActiveFor(staffId, ym){
  return DB.mentorings.find(function(m){
    return m.staff_id===staffId
        && (m.start_date||'').slice(0,7) <= ym
        && (m.end_date||'').slice(0,7) >= ym;
  }) || null;
}
function isMentoringActive(staffId, ym){ return !!mentoringActiveFor(staffId, ym); }
// 멘토링 시급: 활성 기간의 월별 시급 중 ym 이하 최신 (일반 시급과 동일 규칙)
function mentoringRateFor(staffId, ym){
  var m = mentoringActiveFor(staffId, ym);
  if(!m) return 0;
  var rs = DB.mentoringRates.filter(function(r){ return r.mentoring_id===m.id && r.ym <= ym; })
                            .sort(function(a,b){ return a.ym < b.ym ? 1 : -1; });
  return rs[0] ? rs[0].rate : 0;
}
// 월 집계 + 급여
function payCalc(staffId, ym){
  var logs = DB.logs.filter(l => l.staff_id===staffId && l.date.slice(0,7)===ym);
  var nMin=0, mMin=0;
  logs.forEach(l => { nMin += dur(l.n_in, l.n_out); mMin += dur(l.m_in, l.m_out); });
  var rate = rateFor(staffId, ym);
  var rn = rate ? rate.rn : 0;
  var rm = mentoringRateFor(staffId, ym);   // pt_mentoring_rate 기반(기간 판정+ym이하최신)
  var gross = Math.round(nMin/60*rn + mMin/60*rm);
  var net   = Math.round(gross * (1 - WITHHOLD));
  return {nMin, mMin, totalMin:nMin+mMin, rn, rm, gross, net, hasRate:!!rate};
}

function daysInMonth(ym){
  var y = +ym.slice(0,4), mo = +ym.slice(5,7);
  return new Date(y, mo, 0).getDate();
}
function logOf(staffId, dateStr){
  return DB.logs.find(l => l.staff_id===staffId && l.date===dateStr) || null;
}
async function upsertLog(staffId, dateStr, field, val){
  var l = logOf(staffId, dateStr);
  if(!l){
    if(!val) return;
    l = {staff_id:staffId, date:dateStr};
    DB.logs.push(l);
  }
  l[field] = val || undefined;   // 캐시 즉시 반영(렌더는 이 값 사용)
  var payload = {staff_id:staffId, work_date:dateStr};
  ['n_in','n_out','m_in','m_out','memo_n','memo_m'].forEach(function(k){ payload[k] = l[k] || null; });
  var up = await sb.from('pt_log').upsert(payload, {onConflict:'staff_id,work_date'});
  if(up.error) console.warn('근무 저장 실패:', up.error.message);
}

async function onLoginSubmit(){

  var msg=document.getElementById('login_msg');

  if(!/^[0-9]{4}$/.test(pin)){ msg.textContent='PIN은 4자리 숫자입니다.'; return; }
  if(LOGIN_MODE==='multi'){
    for(var i=0;i<LOGIN_CANDS.length;i++){
      var rm=await sbRpc('pt_verify_pin',{p_staff:LOGIN_CANDS[i],p_pin:pin});
      if(rm && rm.result==='ok'){ enterStaffMode(LOGIN_CANDS[i]); return; }
    }
    msg.textContent='일치하는 PIN이 없습니다. (미설정이면 관리자에게 PIN을 받으세요)';
    document.getElementById('login_pin').value=''; document.getElementById('login_pin').focus();
    return;
  }
  var id=LOGIN_TARGET;
  if(!id){ msg.textContent='분원과 이름을 확인하세요.'; return; }
  if(LOGIN_MODE==='set'){
    var pin2=document.getElementById('login_pin2').value;
    if(pin!==pin2){ msg.textContent='두 PIN이 일치하지 않습니다.'; return; }
    var r=await sbRpc('pt_set_pin',{p_staff:id,p_pin:pin});
    if(r && r.__error){ msg.textContent='PIN 설정 실패: '+r.__error; return; }

  }
  var res=await sbRpc('pt_verify_pin',{p_staff:id,p_pin:pin});
  if(res && res.result==='ok'){ enterStaffMode(id); return; }
  if(res && res.result==='locked'){ msg.textContent='5회 실패로 잠겼습니다. 관리자에게 문의하세요.'; return; }
  if(res && res.result==='fail'){ var left=5-(res.fail_count||0); msg.textContent='PIN이 틀립니다. (남은 시도 '+(left>0?left:0)+'회)'; document.getElementById('login_pin').value=''; document.getElementById('login_pin').focus(); return; }

}

function shiftMonth(d){
  var y=+CUR.slice(0,4), m=+CUR.slice(5,7)+d;
  if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  CUR = y+'-'+String(m).padStart(2,'0');
  renderDetail();
}

function renderDetail(){
  var body = document.getElementById('detailBody');
  var panel = document.getElementById('detailPanel');
  if(!SEL){ body.innerHTML='<div class="empty"><div class="ic">👋</div>왼쪽에서 알바를 선택하세요.</div>'; return; }
  var s = staffById(SEL);
  var mtActive = isMentoringActive(SEL, CUR);   // 조회월이 멘토링 기간에 걸치나
  if(!mtActive && VIEW!=='normal') VIEW='normal';
  var showN=(VIEW==='both'||VIEW==='normal');
  var showM=(VIEW==='both'||VIEW==='mentoring') && mtActive;
  var showMemo=(VIEW!=='both');
  var memoField=(VIEW==='mentoring')?'memo_m':'memo_n';
  panel.classList.toggle('mtcol-off', !mtActive);

  var pc = payCalc(SEL, CUR);
  var ndays = daysInMonth(CUR);

  // 근무표 행
  var rows = '';
  for(var d=1; d<=ndays; d++){
    var ds = CUR + '-' + String(d).padStart(2,'0');
    var dt = new Date(+CUR.slice(0,4), +CUR.slice(5,7)-1, d);
    var dow = dt.getDay();
    var l = logOf(SEL, ds) || {};
    var nd = dur(l.n_in, l.n_out), md = dur(l.m_in, l.m_out);
    rows +=
      '<tr id="row-'+ds+'" class="'+(dow===0?'sun':dow===6?'sat':'')+'">' +
        '<td class="day">'+d+'<span class="dow">'+DOW[dow]+'</span></td>' +
        (showN ?
          '<td>'+timeCell(ds,'n_in',l.n_in)+'</td>' +
          '<td>'+timeCell(ds,'n_out',l.n_out)+'</td>' +
          '<td class="dur dur-n '+(nd?'':'z')+'">'+m2hm(nd)+'</td>' : '') +
        (showM ?
          '<td class="mt mtedge">'+timeCell(ds,'m_in',l.m_in)+'</td>' +
          '<td class="mt">'+timeCell(ds,'m_out',l.m_out)+'</td>' +
          '<td class="mt dur dur-m '+(md?'':'z')+'">'+m2hm(md)+'</td>' : '') +
        (showMemo ?
          '<td class="memo"><input class="memoinput" data-d="'+ds+'" data-f="'+memoField+'" value="'+esc(l[memoField]||'')+'" onchange="onMemoChange(this)" placeholder="메모"></td>' : '') +
      '</tr>';
  }

  // 시급 이력
  var nowRate = rateFor(SEL, CUR);
  var rateRows = DB.rates.filter(r=>r.staff_id===SEL).sort((a,b)=>a.ym<b.ym?-1:1).map(r=>{
    var isNow = nowRate && r.ym===nowRate.ym;
    return '<tr>' +
      '<td>'+r.ym+' 부터'+(isNow?' <span class="rate-now">● 현재월 적용</span>':'')+'</td>' +
      '<td class="num">'+won(r.rn)+'</td>' +
      '<td class="num">'+(r.rm?won(r.rm):'—')+'</td>' +
    '</tr>';
  }).join('');

  body.innerHTML =
    '<div class="dhead">' +
      '<span class="dnm">'+s.name+'</span>' +
      (s.branch_id?'<span class="dnm-br" style="background:'+branchColor(s.branch_id).bg+';color:'+branchColor(s.branch_id).fg+'">'+esc(branchName(s.branch_id))+'</span>':'') +
      '<span class="tag '+(mtActive?'mt':'')+'">'+(mtActive?'일반+멘토링':'일반')+'</span>' +
      '<div class="monthnav">' +
        '<button onclick="shiftMonth(-1)">‹</button>' +
        '<span class="mlabel">'+CUR.replace('-',' / ')+'</span>' +
        '<button onclick="shiftMonth(1)">›</button>' +
      '</div>' +
      (APP_MODE==='admin' ? '<button class="btn gho" onclick="openPinModal()" style="margin-left:8px">PIN 관리</button>' : '') +
      (APP_MODE==='admin' ? '<button class="btn gho del-staff" onclick="deleteStaff(\''+s.id+'\')" title="알바 삭제">삭제</button>' : '') +
    '</div>' +

    '<div class="rates">' +
      '<div style="display:flex;align-items:center;gap:8px;margin:14px 0 6px">' +
        '<h2 style="margin:0;font-size:13px;font-weight:800">시급 이력</h2>' +
        (APP_MODE==='admin' ? '<button class="btn gho sm" onclick="openAddRate()" style="margin-left:auto">+ 시급 변경</button>' : '') +
      '</div>' +
      '<table class="ratetable"><thead><tr><th>적용 시작월</th><th style="text-align:right">일반</th><th style="text-align:right">멘토링</th></tr></thead>' +
      '<tbody>'+rateRows+'</tbody></table>' +
    '</div>' +

    '<div style="display:flex;align-items:center;gap:10px;margin:16px 0 6px">' +
      '<h2 style="margin:0;font-size:13px;font-weight:800">근무 입력 — '+CUR.replace('-',' / ')+'</h2>' +
      (mtActive ? '<select class="viewsel" onchange="setView(this.value)" style="margin-left:auto">' +
        '<option value="both"'+(VIEW==='both'?' selected':'')+'>일반+멘토링</option>' +
        '<option value="normal"'+(VIEW==='normal'?' selected':'')+'>일반만</option>' +
        '<option value="mentoring"'+(VIEW==='mentoring'?' selected':'')+'>멘토링만</option>' +
      '</select>' : '') +
    '</div>' +
    (pc.hasRate?'':'<p class="hint" style="color:var(--warn)">⚠ 이 달에 적용할 시급이 없습니다. 시급 이력에서 시작월을 등록하세요.</p>') +
    '<div class="wlwrap"><table class="wl">' +
      '<thead>' +
        '<tr><th rowspan="2" class="grp">날짜</th>' +
          (showN?'<th colspan="3" class="grp">일반</th>':'') +
          (showM?'<th colspan="3" class="grp mt mtedge">멘토링</th>':'') +
          (showMemo?'<th rowspan="2" class="grp memohead">특이사항</th>':'') +
        '</tr>' +
        '<tr>' +
          (showN?'<th>출근</th><th>퇴근</th><th>시간</th>':'') +
          (showM?'<th class="mt mtedge">출근</th><th class="mt">퇴근</th><th class="mt">시간</th>':'') +
        '</tr>' +
      '</thead><tbody>'+rows+'</tbody>' +
    '</table></div>' +
    '<p class="hint">시간은 24시간제로 입력합니다. 퇴근이 출근보다 이르면 자정을 넘긴 것으로 보고 자동 계산됩니다(예: 16:00~00:25 → 8:25).</p>' +

    '<div class="summary">' +
      '<div class="scard">' +
        '<div class="sl">총 근무시간</div>' +
        '<div class="sv" id="sv-total">'+m2hm(pc.totalMin)+'</div>' +
        '<div class="sub" id="sub-total">일반 '+m2hm(pc.nMin)+(mtActive?' · 멘토링 '+m2hm(pc.mMin):'')+'</div>' +
      '</div>' +
      '<div class="scard gross">' +
        '<div class="sl">세전</div>' +
        '<div class="sv" id="sv-gross">'+won(pc.gross)+'</div>' +
        '<div class="sub">일반 '+won(pc.rn)+(mtActive&&pc.rm?' · 멘토링 '+won(pc.rm):'')+' /시간</div>' +
      '</div>' +
      '<div class="scard net">' +
        '<div class="sl">세후 (3.3% 공제)</div>' +
        '<div class="sv" id="sv-net">'+won(pc.net)+'</div>' +
        '<div class="sub" id="sub-net">공제 '+won(pc.gross-pc.net)+'</div>' +
      '</div>' +
    '</div>';
}

/* ---- 시간 입력: 텍스트 + 자동 콜론 + 오전/오후 뱃지 (독서실 방식 참고) ---- */
// '10:00' / '1000' / '930' / '13' 등 관대하게 파싱 → 분. 잘못되면 null
function parseTimeLoose(v){
  v = (v||'').trim(); if(!v) return null;
  var hh, mm;
  if(v.indexOf(':') >= 0){ var p=v.split(':'); hh=parseInt(p[0],10); mm=parseInt(p[1],10); }
  else {
    var d = v.replace(/\D/g,'');
    if(d==='') return null;
    if(d.length<=2){ hh=parseInt(d,10); mm=0; }
    else if(d.length===3){ hh=parseInt(d.slice(0,1),10); mm=parseInt(d.slice(1),10); }
    else { hh=parseInt(d.slice(0,2),10); mm=parseInt(d.slice(2,4),10); }
  }
  if(isNaN(hh)||isNaN(mm)||hh>23||mm>59) return null;
  return hh*60+mm;
}
function normTime(v){ var m=parseTimeLoose(v); if(m==null) return ''; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function ampmHtml(v){
  var m=parseTimeLoose(v); if(m==null) return '';
  return (Math.floor(m/60)<12) ? '<span class="am">오전</span>' : '<span class="pm">오후</span>';
}
// 퇴근<출근이면 자정 넘김(익일)
function isOvernight(inV,outV){ var a=parseTimeLoose(inV), b=parseTimeLoose(outV); return (a!=null && b!=null && b<a); }
// 셀 배지: 퇴근 셀이 자정 넘김이면 '익일', 그 외엔 오전/오후 (저장된 짝 시각 기준 — 초기 렌더/onChange용)
function cellBadge(ds,field,val){
  if(field==='n_out' || field==='m_out'){
    var l=logOf(SEL,ds)||{};
    var inV=(field==='n_out')?l.n_in:l.m_in;
    if(isOvernight(inV,val)) return '<span class="nx">익일</span>';
  }
  return ampmHtml(val);
}
function timeCell(ds, field, val){
  return '<div class="tcell">' +
    '<input class="tinput" data-d="'+ds+'" data-f="'+field+'" value="'+(val||'')+'" ' +
      'oninput="onTimeInput(this)" onchange="onTimeChange(this)" placeholder="--:--" maxlength="5" inputmode="numeric" autocomplete="off">' +
    '<span class="ampm">'+cellBadge(ds,field,val)+'</span>' +
  '</div>';
}
// 입력 중: 뱃지 실시간 + 형식 오류 표시 (재렌더 없음 → 포커스 유지)
function onTimeInput(inp){
  var _d=inp.value.replace(/\D/g,'').slice(0,4);
  inp.value=(_d.length<=2)?_d:_d.slice(0,_d.length-2)+':'+_d.slice(_d.length-2);
  var m=parseTimeLoose(inp.value);
  var badge=inp.parentNode.querySelector('.ampm');
  if(m==null){ if(badge) badge.innerHTML=''; inp.classList.toggle('bad', inp.value.trim()!==''); return; }
  inp.classList.remove('bad');
  var f=inp.getAttribute('data-f'), ds=inp.getAttribute('data-d'), nx=false;
  if(f==='n_out' || f==='m_out'){
    var inEl=document.querySelector('.tinput[data-d="'+ds+'"][data-f="'+(f==='n_out'?'n_in':'m_in')+'"]');
    if(inEl){ var im=parseTimeLoose(inEl.value); if(im!=null && m<im) nx=true; }
  }
  if(badge) badge.innerHTML = nx ? '<span class="nx">익일</span>' : ((Math.floor(m/60)<12)?'<span class="am">오전</span>':'<span class="pm">오후</span>');
}
// 칸 벗어날 때: 정규화(자동 콜론) + 저장 + 근무시간/명세 부분 갱신
function onTimeChange(inp){
  var v=normTime(inp.value); inp.value=v;
  var ds=inp.getAttribute('data-d'), f=inp.getAttribute('data-f');
  upsertLog(SEL, ds, f, v);
  onTimeInput(inp);
  if(f==='n_in' || f==='m_in'){
    var outEl=document.querySelector('.tinput[data-d="'+ds+'"][data-f="'+(f==='n_in'?'n_out':'m_out')+'"]');
    if(outEl) onTimeInput(outEl);   // 출근 바뀌면 퇴근 '익일' 재평가
  }
  updateRowDur(ds);
  updateSummary();
}
function updateRowDur(ds){
  var l=logOf(SEL,ds)||{};
  var nd=dur(l.n_in,l.n_out), md=dur(l.m_in,l.m_out);
  var tr=document.getElementById('row-'+ds); if(!tr) return;
  var nc=tr.querySelector('.dur-n'), mc=tr.querySelector('.dur-m');
  if(nc){ nc.textContent=m2hm(nd); nc.classList.toggle('z',!nd); }
  if(mc){ mc.textContent=m2hm(md); mc.classList.toggle('z',!md); }
}
function updateSummary(){
  var pc=payCalc(SEL,CUR), s=staffById(SEL), e;
  if(e=document.getElementById('sv-total')) e.textContent=m2hm(pc.totalMin);
  if(e=document.getElementById('sub-total')) e.textContent='일반 '+m2hm(pc.nMin)+(isMentoringActive(SEL,CUR)?' · 멘토링 '+m2hm(pc.mMin):'');
  if(e=document.getElementById('sv-gross')) e.textContent=won(pc.gross);
  if(e=document.getElementById('sv-net')) e.textContent=won(pc.net);
  if(e=document.getElementById('sub-net')) e.textContent='공제 '+won(pc.gross-pc.net);
}

/* ---- 모달: 알바 등록 ---- */
function openAddStaff(){
  document.getElementById('as_name').value='';
  document.getElementById('as_mt').checked=false;
  document.getElementById('as_rm_fld').style.display='none';
  document.getElementById('as_mt_period_fld').style.display='none';
  document.getElementById('as_mt_start').value='';
  document.getElementById('as_mt_end').value='';
  document.getElementById('as_ym').value=CUR;
  document.getElementById('as_rn').value=10800;
  document.getElementById('as_rm').value=12000;
  document.getElementById('as_branch').value='';
  refreshBranchSelects();
  document.getElementById('as_branch').value='';
  document.getElementById('addStaffModal').style.display='flex';
}
document.getElementById('as_mt').addEventListener('change',function(){
  document.getElementById('as_rm_fld').style.display=this.checked?'flex':'none';
  document.getElementById('as_mt_period_fld').style.display=this.checked?'flex':'none';
});
async function addStaff(){
  var name=document.getElementById('as_name').value.trim();
  if(!name){ alert('이름을 입력하세요.'); return; }
  var branch_id=document.getElementById('as_branch').value || null;
  var mt=document.getElementById('as_mt').checked;
  var ym=document.getElementById('as_ym').value;
  var rn=+document.getElementById('as_rn').value;
  var rm= mt ? +document.getElementById('as_rm').value : null;
  var mtStart = mt ? document.getElementById('as_mt_start').value : null;
  var mtEnd   = mt ? document.getElementById('as_mt_end').value   : null;
  if(mt){
    if(!mtStart || !mtEnd){ alert('멘토링 기간(시작일·종료일)을 입력하세요.'); return; }
    if(mtEnd < mtStart){ alert('멘토링 종료일이 시작일보다 빠를 수 없습니다.'); return; }
  }
  // 1) 직원 insert
  var ins=await sb.from('pt_staff').insert({name:name, branch_id:branch_id, has_mentoring:mt, active:true, sort:(DB.staff.length+1)}).select('id,name,branch_id,has_mentoring,active,sort').single();
  if(ins.error){ alert('등록 실패: '+ins.error.message); return; }
  var id=ins.data.id;
  // 2) 첫 시급 insert (일반 시급만 pt_rate; 멘토링 시급은 pt_mentoring_rate로 분리)
  var rIns=await sb.from('pt_rate').insert({staff_id:id, ym:ym, rate_normal:rn, rate_mentoring:null});
  if(rIns.error){ alert('시급 등록 실패: '+rIns.error.message); }
  // 2-1) 멘토링: 기간(pt_mentoring) + 시작월 시급(pt_mentoring_rate)
  if(mt){
    var mIns=await sb.from('pt_mentoring').insert({staff_id:id, start_date:mtStart, end_date:mtEnd}).select('id,staff_id,start_date,end_date').single();
    if(mIns.error){ alert('멘토링 기간 등록 실패: '+mIns.error.message); }
    else {
      DB.mentorings.push(mIns.data);
      var mYm = mtStart.slice(0,7);
      var mrIns=await sb.from('pt_mentoring_rate').insert({mentoring_id:mIns.data.id, ym:mYm, rate:rm});
      if(mrIns.error){ alert('멘토링 시급 등록 실패: '+mrIns.error.message); }
      else { DB.mentoringRates.push({mentoring_id:mIns.data.id, ym:mYm, rate:rm}); }
    }
  }
  // 3) 캐시 갱신
  DB.staff.push(ins.data);
  DB.rates.push({staff_id:id, ym:ym, rn:rn, rm:null});
  closeModal('addStaffModal');
  renderStaffList(); selectStaff(id);
}

/* ---- 모달: 시급 변경 ---- */
function openAddRate(){
  var s=staffById(SEL);
  document.getElementById('rt_staff_name').textContent=s?s.name:'';
  document.getElementById('rt_ym').value=CUR;
  var cur=rateFor(SEL,CUR);
  document.getElementById('rt_rn').value=cur?cur.rn:10800;
  rtRefreshMentoring();
  document.getElementById('addRateModal').style.display='flex';
}
// 적용월 기준 멘토링 섹션 갱신: 걸치는 기간 있으면 시급변경(①), 없으면 추가(②)
function rtRefreshMentoring(){
  var ym=document.getElementById('rt_ym').value;
  var m=mentoringActiveFor(SEL, ym);
  var existing=document.getElementById('rt_mt_existing');
  var addBox=document.getElementById('rt_mt_add');
  if(m){
    existing.style.display='flex'; addBox.style.display='none';
    document.getElementById('rt_mt_range').textContent='('+m.start_date+' ~ '+m.end_date+')';
    var mr=mentoringRateFor(SEL, ym);
    document.getElementById('rt_rm').value=mr||12000;
  } else {
    existing.style.display='none'; addBox.style.display='block';
    document.getElementById('rt_mt_addchk').checked=false;
    document.getElementById('rt_mt_addfld').style.display='none';
  }
}
function rtToggleAdd(){
  document.getElementById('rt_mt_addfld').style.display=document.getElementById('rt_mt_addchk').checked?'block':'none';
}
async function addRate(){
  var ym=document.getElementById('rt_ym').value;
  var rn=+document.getElementById('rt_rn').value;
  // 1) 일반 시급 (rate_mentoring은 더 이상 사용 안 함 → null 고정)
  var up=await sb.from('pt_rate').upsert({staff_id:SEL, ym:ym, rate_normal:rn, rate_mentoring:null}, {onConflict:'staff_id,ym'});
  if(up.error){ alert('시급 저장 실패: '+up.error.message); return; }
  // 2) 멘토링: 적용월이 기간에 걸치면 시급변경, 아니면(추가 체크 시) 새 기간 생성
  var m=mentoringActiveFor(SEL, ym);
  if(m){
    var rm=+document.getElementById('rt_rm').value;
    var mu=await sb.from('pt_mentoring_rate').upsert({mentoring_id:m.id, ym:ym, rate:rm}, {onConflict:'mentoring_id,ym'});
    if(mu.error){ alert('멘토링 시급 저장 실패: '+mu.error.message); return; }
  } else if(document.getElementById('rt_mt_addchk').checked){
    var st=document.getElementById('rt_mt_start').value, en=document.getElementById('rt_mt_end').value;
    if(!st||!en){ alert('멘토링 기간(시작일·종료일)을 입력하세요.'); return; }
    if(en<st){ alert('멘토링 종료일이 시작일보다 빠를 수 없습니다.'); return; }
    var ar=+document.getElementById('rt_mt_addrate').value;
    var mi=await sb.from('pt_mentoring').insert({staff_id:SEL, start_date:st, end_date:en}).select('id,staff_id,start_date,end_date').single();
    if(mi.error){ alert('멘토링 기간 추가 실패: '+mi.error.message); return; }
    var mri=await sb.from('pt_mentoring_rate').insert({mentoring_id:mi.data.id, ym:st.slice(0,7), rate:ar});
    if(mri.error){ alert('멘토링 시급 추가 실패: '+mri.error.message); return; }
    await sb.from('pt_staff').update({has_mentoring:true}).eq('id',SEL);
  }
  await loadAll();
  closeModal('addRateModal');
  renderDetail();
}

function closeModal(id){ document.getElementById(id).style.display='none'; }

/* ===== 분원 마스터 (pt_branch) ===== */
function branchName(id){ var b=DB.branches.find(function(x){return x.id===id;}); return b?b.name:''; }
var BRANCH_COLORS=[{bg:'#e7f3ec',fg:'#1b6e4d'},{bg:'#e8eefc',fg:'#2747b0'},{bg:'#fdeede',fg:'#b5630e'},{bg:'#f3e8fb',fg:'#7b2cbf'},{bg:'#fde8ee',fg:'#b91c4d'},{bg:'#fef6da',fg:'#9a7400'}];
function branchColor(id){ var i=DB.branches.findIndex(function(b){return b.id===id;}); if(i<0)return{bg:'#eef1f4',fg:'#64748b'}; return BRANCH_COLORS[i%BRANCH_COLORS.length]; }
function branchOptions(sel){
  return '<option value="">(분원 미지정)</option>' +
    DB.branches.map(function(b){ return '<option value="'+b.id+'"'+(b.id===sel?' selected':'')+'>'+esc(b.name)+'</option>'; }).join('');
}
function refreshBranchSelects(){
  var s=document.getElementById('as_branch');
  if(s){ var cur=s.value; s.innerHTML=branchOptions(cur); }
  var f=document.getElementById('flt_branch');
  if(f){ var fc=f.value; f.innerHTML='<option value="">(전체 분원)</option>'+DB.branches.map(function(b){return '<option value="'+b.id+'"'+(b.id===fc?' selected':'')+'>'+esc(b.name)+'</option>';}).join(''); }
}
function openBranchMgr(){ renderBranchList(); document.getElementById('branchModal').style.display='flex'; }
function renderBranchList(){
  var box=document.getElementById('branchList');
  if(!DB.branches.length){ box.innerHTML='<p class="hint" style="margin:4px 0">등록된 분원이 없습니다. 아래에서 추가하세요.</p>'; return; }
  box.innerHTML = DB.branches.map(function(b){
    var cnt=DB.staff.filter(function(s){return s.branch_id===b.id;}).length;
    return '<div class="brrow">'+
      '<span class="brnm">'+esc(b.name)+'</span>'+
      '<span class="brcnt">'+cnt+'명</span>'+
      '<span class="brsp"></span>'+
      '<button class="btn gho" onclick="editBranch(\''+b.id+'\')">수정</button>'+
      '<button class="btn gho" onclick="deleteBranch(\''+b.id+'\')">삭제</button>'+
    '</div>';
  }).join('');
}
async function addBranch(){
  var el=document.getElementById('br_name'); var name=el.value.trim();
  if(!name){ alert('분원명을 입력하세요.'); return; }
  if(DB.branches.some(function(b){return b.name===name;})){ alert('이미 같은 이름의 분원이 있습니다.'); return; }
  var ins=await sb.from('pt_branch').insert({name:name, sort:(DB.branches.length+1)}).select().single();
  if(ins.error){ alert('분원 추가 실패: '+ins.error.message); return; }
  DB.branches.push(ins.data);
  el.value='';
  renderBranchList(); refreshBranchSelects();
}
async function editBranch(id){
  var b=DB.branches.find(function(x){return x.id===id;}); if(!b) return;
  var nn=prompt('분원명 수정', b.name); if(nn==null) return; nn=nn.trim();
  if(!nn){ alert('분원명을 입력하세요.'); return; }
  if(DB.branches.some(function(x){return x.id!==id && x.name===nn;})){ alert('이미 같은 이름의 분원이 있습니다.'); return; }
  var up=await sb.from('pt_branch').update({name:nn}).eq('id',id);
  if(up.error){ alert('수정 실패: '+up.error.message); return; }
  b.name=nn;
  renderBranchList(); refreshBranchSelects(); renderStaffList(); if(SEL) renderDetail();
}
async function deleteBranch(id){
  var cnt=DB.staff.filter(function(s){return s.branch_id===id;}).length;
  if(cnt>0){ alert('이 분원에 배정된 알바 '+cnt+'명이 있어 삭제할 수 없습니다.\n먼저 해당 알바의 분원을 변경하세요.'); return; }
  var b=DB.branches.find(function(x){return x.id===id;}); if(!b) return;
  if(!confirm('분원 "'+b.name+'"을(를) 삭제할까요?')) return;
  var del=await sb.from('pt_branch').delete().eq('id',id);
  if(del.error){ alert('삭제 실패: '+del.error.message); return; }
  DB.branches=DB.branches.filter(function(x){return x.id!==id;});
  renderBranchList(); refreshBranchSelects();
}
/* 서버(UTC) 시각 → KST 현재월 자동 */
async function setCurrentMonthKST(){
  try{
    var r=await fetch(SB_URL+'/rest/v1/pt_branch?select=id&limit=1',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    var d=r.headers.get('date');
    if(d){ var kst=new Date(new Date(d).getTime()+9*3600000); CUR=kst.toISOString().slice(0,7); }
  }catch(e){ /* 실패 시 기본 CUR 유지 */ }
}

[...document.querySelectorAll('.mback')].forEach(m=>{
  m.addEventListener('click',e=>{ if(e.target===m) m.style.display='none'; });
});

/* init */
(async function(){
  await setCurrentMonthKST();
  await loadAll();
  refreshBranchSelects();
  startIdleWatch();
  var role = await getCurrentRole();
  if(role==='admin'){
    APP_MODE='admin';
    renderStaffList();
    if(DB.staff.length) selectStaff(DB.staff[0].id);
  } else {
    APP_MODE='staff';
    showStaffLogin();
  }
})();
</script>
