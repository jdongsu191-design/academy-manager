<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>급여 관리 — BMAPS</title>
<style>
  :root{
    --maroon:#8a1f3d; --maroon-d:#6f1830; --maroon-l:#fbeef2;
    --ink:#1f2430; --mut:#6b7280; --line:#e6e8ec; --bg:#f5f6f8; --card:#ffffff;
    --ok:#0f766e; --warn:#b45309;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  header.top{background:var(--maroon);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px}
  header.top h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.2px}
  header.top .badge{font-size:11px;font-weight:700;background:rgba(255,255,255,.18);
    padding:3px 9px;border-radius:999px;letter-spacing:.3px}
  header.top .sp{margin-left:auto;font-size:12px;opacity:.85}
  main{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px 22px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px}
  .panel .ph{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .panel .ph h2{margin:0;font-size:13px;font-weight:800;color:var(--ink)}
  .panel .pb{padding:12px 14px}
  /* staff list */
  .stafflist{display:flex;flex-direction:column;gap:4px}
  .staff{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;
    border:1px solid transparent;transition:background .12s}
  .staff:hover{background:#f3f4f6}
  .staff.sel{background:var(--maroon-l);border-color:#f3d3dd}
  .staff .nm{font-weight:700;font-size:13px}
  .staff .ty{font-size:11px;color:var(--mut);margin-left:auto;white-space:nowrap}
  .staff .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex-shrink:0}
  .staff.off .dot{background:#cbd5e1}
  .staff.off .nm{color:var(--mut)}
  .btn{font:inherit;border:none;border-radius:9px;padding:8px 13px;font-weight:700;cursor:pointer;font-size:13px}
  .btn.pri{background:var(--maroon);color:#fff}
  .btn.pri:hover{background:var(--maroon-d)}
  .btn.gho{background:#fff;border:1.5px solid var(--line);color:#374151}
  .btn.gho:hover{border-color:#cbd5e1}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
  .addbtn{width:100%;margin-top:8px}
  /* detail */
  .dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .dhead .dnm{font-size:18px;font-weight:800}
  .dhead .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef2f7;color:#475569}
  .dhead .tag.mt{background:#fef3c7;color:#92400e}
  .monthnav{display:flex;align-items:center;gap:8px;margin-left:auto}
  .monthnav .mlabel{font-weight:800;font-size:15px;min-width:96px;text-align:center}
  .monthnav button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:15px}
  .monthnav button:hover{border-color:#cbd5e1}
  /* rate history */
  .rates{margin-top:6px}
  .ratetable{width:100%;border-collapse:collapse;font-size:13px}
  .ratetable th,.ratetable td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
  .ratetable th{font-size:11px;color:var(--mut);font-weight:700;background:#fafbfc}
  .ratetable td.num{text-align:right;font-variant-numeric:tabular-nums}
  .rate-now{color:var(--maroon);font-weight:800}
  /* worklog table */
  .wlwrap{margin-top:6px;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
  table.wl{width:100%;border-collapse:collapse;font-size:13px}
  table.wl th,table.wl td{padding:5px 8px;border-bottom:1px solid #eef0f3;white-space:nowrap}
  table.wl thead th{position:sticky;top:0;background:#f7f8fa;z-index:1;font-size:11px;color:var(--mut);font-weight:700;text-align:center}
  table.wl thead tr:nth-child(2) th{top:26px}
  table.wl thead th.grp{color:var(--ink);border-bottom:2px solid var(--line)}
  table.wl td.day{font-weight:700;text-align:center;width:78px}
  table.wl td.day .dow{font-weight:500;color:var(--mut);margin-left:4px;font-size:11px}
  table.wl tr.sun td.day{color:#dc2626}
  table.wl tr.sat td.day{color:#2563eb}
  table.wl .tcell{display:grid;grid-template-columns:54px 30px;align-items:center;gap:4px;justify-content:center}
  table.wl .tinput{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:54px;text-align:center;background:#fff;font-variant-numeric:tabular-nums;letter-spacing:.5px}
  table.wl .tinput:focus{outline:none;border-color:var(--maroon);box-shadow:0 0 0 2px var(--maroon-l)}
  table.wl .tinput.bad{border-color:#dc2626;background:#fef2f2}
  table.wl .ampm{width:30px;text-align:center;overflow:hidden}
  table.wl .ampm .am,table.wl .ampm .pm{font-size:10px;font-weight:800;padding:2px 5px;border-radius:5px;white-space:nowrap}
  table.wl .ampm .am{background:#e0f2fe;color:#0369a1}
  table.wl .ampm .nx{font-size:10px;font-weight:800;padding:2px 5px;border-radius:5px;white-space:nowrap;background:#ede9fe;color:#6d28d9}
  table.wl .ampm .pm{background:#fff1e6;color:#c2410c}
  table.wl td.dur{text-align:right;font-variant-numeric:tabular-nums;color:#374151;width:62px}
  table.wl td.dur.z{color:#cbd5e1}
  table.wl tr:hover td{background:#fcfcfd}
  .mtcol-off table.wl .mt{display:none}
  table.wl th.mt,table.wl td.mt{background:#faf6fb}
  table.wl .mtedge{border-left:2px solid #d9bdd7}
  table.wl th.memohead{color:var(--ink);border-bottom:2px solid var(--line)}
  table.wl td.memo{white-space:normal;min-width:130px;background:#fffdf6}
  table.wl .memoinput{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:4px 7px;width:100%;background:#fff;box-sizing:border-box}
  table.wl .memoinput:focus{outline:none;border-color:var(--maroon);box-shadow:0 0 0 2px var(--maroon-l)}
  /* summary */
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .scard{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:#fff}
  .scard .sl{font-size:11px;color:var(--mut);font-weight:700;margin-bottom:4px}
  .scard .sv{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .scard.gross{background:#fafbfc}
  .scard.net{background:var(--maroon);border-color:var(--maroon)}
  .scard.net .sl{color:rgba(255,255,255,.8)}
  .scard.net .sv{color:#fff}
  .scard .sub{font-size:11px;color:var(--mut);margin-top:3px}
  .scard.net .sub{color:rgba(255,255,255,.75)}
  .hint{font-size:12px;color:var(--mut);margin:8px 2px 0}
  .empty{padding:60px 20px;text-align:center;color:var(--mut)}
  .empty .ic{font-size:32px;margin-bottom:8px}
  /* modal */
  .mback{display:none;position:fixed;inset:0;background:rgba(15,18,25,.5);z-index:50;align-items:center;justify-content:center;padding:20px}
  .mbox{background:#fff;border-radius:14px;width:100%;max-width:380px;overflow:hidden}
  .mbox .mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800;font-size:15px}
  .mbox .mc{padding:16px 18px;display:flex;flex-direction:column;gap:11px}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:12px;font-weight:700;color:#475569}
  .fld input,.fld select{font:inherit;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--maroon)}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
  .mbox .mf{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  @media(max-width:820px){ main{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="top">
  <h1>급여 관리</h1>
  <span class="badge">미리보기 · mock 데이터</span>
  <span class="sp">관리자 · DB 연동 전 화면 확인용</span>
</header>

<main>
  <!-- 좌: 알바 목록 -->
  <aside class="panel">
    <div class="ph"><h2>알바</h2><span style="margin-left:auto;font-size:11px;color:var(--mut)" id="staffCount"></span></div>
    <div class="pb">
      <div class="stafflist" id="stafflist"></div>
      <button class="btn pri addbtn" onclick="openAddStaff()">+ 알바 등록</button>
    </div>
  </aside>

  <!-- 우: 상세 -->
  <section class="panel" id="detailPanel">
    <div class="pb" id="detailBody">
      <div class="empty"><div class="ic">👋</div>왼쪽에서 알바를 선택하세요.</div>
    </div>
  </section>
</main>

<!-- 알바 등록 모달 -->
<div class="mback" id="addStaffModal">
  <div class="mbox">
    <div class="mh">알바 등록</div>
    <div class="mc">
      <div class="fld"><label>이름</label><input id="as_name" placeholder="예: 홍길동"></div>
      <label class="chk"><input type="checkbox" id="as_mt"> 멘토링 업무 포함 (시급 별도)</label>
      <div class="fld"><label>첫 시급 — 적용 시작월</label><input type="month" id="as_ym" value="2026-01"></div>
      <div class="fld"><label>일반 시급 (원/시간)</label><input type="number" id="as_rn" value="10800" step="100"></div>
      <div class="fld" id="as_rm_fld" style="display:none"><label>멘토링 시급 (원/시간)</label><input type="number" id="as_rm" value="12000" step="100"></div>
    </div>
    <div class="mf">
      <button class="btn gho" onclick="closeModal('addStaffModal')">취소</button>
      <button class="btn pri" onclick="addStaff()">등록</button>
    </div>
  </div>
</div>

<!-- 시급 변경 모달 -->
<div class="mback" id="addRateModal">
  <div class="mbox">
    <div class="mh">시급 변경</div>
    <div class="mc">
      <div class="fld"><label>적용 시작월</label><input type="month" id="rt_ym" value="2026-01"></div>
      <div class="fld"><label>일반 시급</label><input type="number" id="rt_rn" step="100"></div>
      <div class="fld" id="rt_rm_fld"><label>멘토링 시급</label><input type="number" id="rt_rm" step="100"></div>
      <p class="hint">이 시작월부터 다음 변경 전까지 적용됩니다.</p>
    </div>
    <div class="mf">
      <button class="btn gho" onclick="closeModal('addRateModal')">취소</button>
      <button class="btn pri" onclick="addRate()">추가</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   MOCK DB  —  실제 Supabase 테이블(pt_staff / pt_rate / pt_log)과
   동일한 형태. 연동 단계에서 이 객체만 Supabase 호출로 교체.
   ============================================================ */
const DB = {
  staff: [
    {id:'s1', name:'최지훈', has_mentoring:true,  active:true, sort:1},
    {id:'s2', name:'최지혜', has_mentoring:false, active:true, sort:2},
    {id:'s3', name:'김세희', has_mentoring:true,  active:true, sort:3},
  ],
  // ym = 적용 시작월. 변동점만 저장.
  rates: [
    {staff_id:'s1', ym:'2026-01', rn:10800, rm:12000},
    {staff_id:'s1', ym:'2026-03', rn:11300, rm:12000},
    {staff_id:'s2', ym:'2026-01', rn:10800, rm:null},
    {staff_id:'s3', ym:'2026-01', rn:10800, rm:12000},
    {staff_id:'s3', ym:'2026-02', rn:11800, rm:12000},
  ],
  // 일별 근무 (n=일반, m=멘토링). 근무시간은 저장 안 함 → 계산.
  logs: [
    // 최지훈 2026-01 (검증용: 일반 33:15 + 멘토링 20:15 = 53:30, 세전 602,100)
    {staff_id:'s1', date:'2026-01-06', n_in:'17:30', n_out:'22:10'},
    {staff_id:'s1', date:'2026-01-08', n_in:'17:20', n_out:'22:10'},
    {staff_id:'s1', date:'2026-01-13', n_in:'17:20', n_out:'22:10'},
    {staff_id:'s1', date:'2026-01-15', n_in:'17:25', n_out:'22:10'},
    {staff_id:'s1', date:'2026-01-20', n_in:'17:30', n_out:'22:10'},
    {staff_id:'s1', date:'2026-01-22', n_in:'17:30', n_out:'22:10', m_in:'15:15', m_out:'17:30'},
    {staff_id:'s1', date:'2026-01-26', m_in:'08:22', m_out:'17:37'},
    {staff_id:'s1', date:'2026-01-27', n_in:'17:20', n_out:'22:10'},
    {staff_id:'s1', date:'2026-01-28', m_in:'08:26', m_out:'15:05'},
    {staff_id:'s1', date:'2026-01-29', m_in:'12:54', m_out:'15:00'},
    // 김세희 2026-01 (자정 넘김 케이스: 16:00~0:25 = 8:25)
    {staff_id:'s3', date:'2026-01-01', n_in:'09:00', n_out:'16:00'},
    {staff_id:'s3', date:'2026-01-03', n_in:'16:00', n_out:'00:25'},
    {staff_id:'s3', date:'2026-01-10', n_in:'16:00', n_out:'00:10', m_in:'09:30', m_out:'10:50'},
    {staff_id:'s3', date:'2026-01-31', n_in:'16:00', n_out:'00:05'},
    // 최지혜 2026-06
    {staff_id:'s2', date:'2026-06-11', n_in:'19:34', n_out:'20:50'},
  ],
};

/* ============================================================
   계산 유틸 (시트로 검증된 로직)
   ============================================================ */
const WITHHOLD = 0.033; // 3.3% 원천징수
const DOW = ['일','월','화','수','목','금','토'];

function t2m(s){
  if(!s) return null;
  var p = String(s).split(':');
  if(p.length < 2) return null;
  var h = parseInt(p[0],10), m = parseInt(p[1],10);
  if(isNaN(h) || isNaN(m)) return null;
  return h*60 + m;
}
// 근무시간(분). 퇴근<출근이면 자정 넘김 → +24h
function dur(inS, outS){
  var a = t2m(inS), b = t2m(outS);
  if(a==null || b==null) return 0;
  if(b < a) b += 1440;
  return b - a;
}
function m2hm(min){
  if(!min) return '0:00';
  var h = Math.floor(min/60), m = min%60;
  return h + ':' + String(m).padStart(2,'0');
}
function won(n){ return '₩' + Math.round(n).toLocaleString('ko-KR'); }

// 해당 월(ym='YYYY-MM')에 적용되는 시급 = 시작월<=ym 중 가장 최근
function rateFor(staffId, ym){
  var rs = DB.rates.filter(r => r.staff_id===staffId && r.ym <= ym)
                   .sort((a,b)=> a.ym < b.ym ? 1 : -1);
  return rs[0] || null;
}
// 월 집계 + 급여
function payCalc(staffId, ym){
  var logs = DB.logs.filter(l => l.staff_id===staffId && l.date.slice(0,7)===ym);
  var nMin=0, mMin=0;
  logs.forEach(l => { nMin += dur(l.n_in, l.n_out); mMin += dur(l.m_in, l.m_out); });
  var rate = rateFor(staffId, ym);
  var rn = rate ? rate.rn : 0;
  var rm = (rate && rate.rm) ? rate.rm : 0;
  var gross = Math.round(nMin/60*rn + mMin/60*rm);
  var net   = Math.round(gross * (1 - WITHHOLD));
  return {nMin, mMin, totalMin:nMin+mMin, rn, rm, gross, net, hasRate:!!rate};
}

function daysInMonth(ym){
  var y = +ym.slice(0,4), mo = +ym.slice(5,7);
  return new Date(y, mo, 0).getDate();
}
function logOf(staffId, dateStr){
  return DB.logs.find(l => l.staff_id===staffId && l.date===dateStr) || null;
}
function upsertLog(staffId, dateStr, field, val){
  var l = logOf(staffId, dateStr);
  if(!l){
    if(!val) return;
    l = {staff_id:staffId, date:dateStr};
    DB.logs.push(l);
  }
  l[field] = val || undefined;
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function onMemoChange(inp){ upsertLog(SEL, inp.getAttribute('data-d'), 'memo', inp.value); }

/* ============================================================
   상태 + 렌더
   ============================================================ */
var SEL = null;          // 선택 알바 id
var CUR = '2026-01';     // 현재 보는 월

function staffById(id){ return DB.staff.find(s=>s.id===id); }

function renderStaffList(){
  var box = document.getElementById('stafflist');
  var arr = DB.staff.slice().sort((a,b)=> (a.sort||0)-(b.sort||0));
  box.innerHTML = arr.map(s =>
    '<div class="staff '+(s.id===SEL?'sel':'')+' '+(s.active?'':'off')+'" onclick="selectStaff(\''+s.id+'\')">' +
      '<span class="dot"></span>' +
      '<span class="nm">'+s.name+'</span>' +
      '<span class="ty">'+(s.has_mentoring?'일반+멘토링':'일반')+'</span>' +
    '</div>'
  ).join('');
  document.getElementById('staffCount').textContent = DB.staff.length + '명';
}

function selectStaff(id){ SEL = id; renderStaffList(); renderDetail(); }
function shiftMonth(d){
  var y=+CUR.slice(0,4), m=+CUR.slice(5,7)+d;
  if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  CUR = y+'-'+String(m).padStart(2,'0');
  renderDetail();
}

function renderDetail(){
  var body = document.getElementById('detailBody');
  var panel = document.getElementById('detailPanel');
  if(!SEL){ body.innerHTML='<div class="empty"><div class="ic">👋</div>왼쪽에서 알바를 선택하세요.</div>'; return; }
  var s = staffById(SEL);
  panel.classList.toggle('mtcol-off', !s.has_mentoring);

  var pc = payCalc(SEL, CUR);
  var ndays = daysInMonth(CUR);

  // 근무표 행
  var rows = '';
  for(var d=1; d<=ndays; d++){
    var ds = CUR + '-' + String(d).padStart(2,'0');
    var dt = new Date(+CUR.slice(0,4), +CUR.slice(5,7)-1, d);
    var dow = dt.getDay();
    var l = logOf(SEL, ds) || {};
    var nd = dur(l.n_in, l.n_out), md = dur(l.m_in, l.m_out);
    rows +=
      '<tr id="row-'+ds+'" class="'+(dow===0?'sun':dow===6?'sat':'')+'">' +
        '<td class="day">'+d+'<span class="dow">'+DOW[dow]+'</span></td>' +
        '<td>'+timeCell(ds,'n_in',l.n_in)+'</td>' +
        '<td>'+timeCell(ds,'n_out',l.n_out)+'</td>' +
        '<td class="dur dur-n '+(nd?'':'z')+'">'+m2hm(nd)+'</td>' +
        '<td class="mt mtedge">'+timeCell(ds,'m_in',l.m_in)+'</td>' +
        '<td class="mt">'+timeCell(ds,'m_out',l.m_out)+'</td>' +
        '<td class="mt dur dur-m '+(md?'':'z')+'">'+m2hm(md)+'</td>' +
        '<td class="memo"><input class="memoinput" data-d="'+ds+'" value="'+esc(l.memo||'')+'" onchange="onMemoChange(this)" placeholder="메모"></td>' +
      '</tr>';
  }

  // 시급 이력
  var nowRate = rateFor(SEL, CUR);
  var rateRows = DB.rates.filter(r=>r.staff_id===SEL).sort((a,b)=>a.ym<b.ym?-1:1).map(r=>{
    var isNow = nowRate && r.ym===nowRate.ym;
    return '<tr>' +
      '<td>'+r.ym+' 부터'+(isNow?' <span class="rate-now">● 현재월 적용</span>':'')+'</td>' +
      '<td class="num">'+won(r.rn)+'</td>' +
      '<td class="num">'+(r.rm?won(r.rm):'—')+'</td>' +
    '</tr>';
  }).join('');

  body.innerHTML =
    '<div class="dhead">' +
      '<span class="dnm">'+s.name+'</span>' +
      '<span class="tag '+(s.has_mentoring?'mt':'')+'">'+(s.has_mentoring?'일반+멘토링':'일반')+'</span>' +
      '<div class="monthnav">' +
        '<button onclick="shiftMonth(-1)">‹</button>' +
        '<span class="mlabel">'+CUR.replace('-',' / ')+'</span>' +

    '<div class="wlwrap"><table class="wl">' +

/* ---- 시간 입력: 텍스트 + 자동 콜론 + 오전/오후 뱃지 (독서실 방식 참고) ---- */
// '10:00' / '1000' / '930' / '13' 등 관대하게 파싱 → 분. 잘못되면 null
function parseTimeLoose(v){
  v = (v||'').trim(); if(!v) return null;
  var hh, mm;
  if(v.indexOf(':') >= 0){ var p=v.split(':'); hh=parseInt(p[0],10); mm=parseInt(p[1],10); }
  else {
    var d = v.replace(/\D/g,'');
    if(d==='') return null;
    if(d.length<=2){ hh=parseInt(d,10); mm=0; }
    else if(d.length===3){ hh=parseInt(d.slice(0,1),10); mm=parseInt(d.slice(1),10); }
    else { hh=parseInt(d.slice(0,2),10); mm=parseInt(d.slice(2,4),10); }
  }
  if(isNaN(hh)||isNaN(mm)||hh>23||mm>59) return null;
  return hh*60+mm;
}
function normTime(v){ var m=parseTimeLoose(v); if(m==null) return ''; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function ampmHtml(v){
  var m=parseTimeLoose(v); if(m==null) return '';
  return (Math.floor(m/60)<12) ? '<span class="am">오전</span>' : '<span class="pm">오후</span>';
}
// 퇴근<출근이면 자정 넘김(익일)
function isOvernight(inV,outV){ var a=parseTimeLoose(inV), b=parseTimeLoose(outV); return (a!=null && b!=null && b<a); }
// 셀 배지: 퇴근 셀이 자정 넘김이면 '익일', 그 외엔 오전/오후 (저장된 짝 시각 기준 — 초기 렌더/onChange용)
function cellBadge(ds,field,val){
  if(field==='n_out' || field==='m_out'){
    var l=logOf(SEL,ds)||{};
    var inV=(field==='n_out')?l.n_in:l.m_in;
    if(isOvernight(inV,val)) return '<span class="nx">익일</span>';
  }
  return ampmHtml(val);
}
function timeCell(ds, field, val){
  return '<div class="tcell">' +
    '<input class="tinput" data-d="'+ds+'" data-f="'+field+'" value="'+(val||'')+'" ' +
      'oninput="onTimeInput(this)" onchange="onTimeChange(this)" placeholder="--:--" maxlength="5" inputmode="numeric" autocomplete="off">' +
    '<span class="ampm">'+cellBadge(ds,field,val)+'</span>' +
  '</div>';
}
// 입력 중: 뱃지 실시간 + 형식 오류 표시 (재렌더 없음 → 포커스 유지)
function onTimeInput(inp){
  var _d=inp.value.replace(/\D/g,'').slice(0,4);
  inp.value=(_d.length<=2)?_d:_d.slice(0,_d.length-2)+':'+_d.slice(_d.length-2);
  var m=parseTimeLoose(inp.value);
  var badge=inp.parentNode.querySelector('.ampm');
  if(m==null){ if(badge) badge.innerHTML=''; inp.classList.toggle('bad', inp.value.trim()!==''); return; }
  inp.classList.remove('bad');
  var f=inp.getAttribute('data-f'), ds=inp.getAttribute('data-d'), nx=false;
  if(f==='n_out' || f==='m_out'){
    var inEl=document.querySelector('.tinput[data-d="'+ds+'"][data-f="'+(f==='n_out'?'n_in':'m_in')+'"]');
    if(inEl){ var im=parseTimeLoose(inEl.value); if(im!=null && m<im) nx=true; }
  }
  if(badge) badge.innerHTML = nx ? '<span class="nx">익일</span>' : ((Math.floor(m/60)<12)?'<span class="am">오전</span>':'<span class="pm">오후</span>');
}
// 칸 벗어날 때: 정규화(자동 콜론) + 저장 + 근무시간/명세 부분 갱신
function onTimeChange(inp){
  var v=normTime(inp.value); inp.value=v;
  var ds=inp.getAttribute('data-d'), f=inp.getAttribute('data-f');
  upsertLog(SEL, ds, f, v);
  onTimeInput(inp);
  if(f==='n_in' || f==='m_in'){
    var outEl=document.querySelector('.tinput[data-d="'+ds+'"][data-f="'+(f==='n_in'?'n_out':'m_out')+'"]');
    if(outEl) onTimeInput(outEl);   // 출근 바뀌면 퇴근 '익일' 재평가
  }
  updateRowDur(ds);
  updateSummary();
}
function updateRowDur(ds){
  var l=logOf(SEL,ds)||{};
  var nd=dur(l.n_in,l.n_out), md=dur(l.m_in,l.m_out);
  var tr=document.getElementById('row-'+ds); if(!tr) return;
  var nc=tr.querySelector('.dur-n'), mc=tr.querySelector('.dur-m');
  if(nc){ nc.textContent=m2hm(nd); nc.classList.toggle('z',!nd); }
  if(mc){ mc.textContent=m2hm(md); mc.classList.toggle('z',!md); }
}
function updateSummary(){
  var pc=payCalc(SEL,CUR), s=staffById(SEL), e;
  if(e=document.getElementById('sv-total')) e.textContent=m2hm(pc.totalMin);
  if(e=document.getElementById('sub-total')) e.textContent='일반 '+m2hm(pc.nMin)+(s.has_mentoring?' · 멘토링 '+m2hm(pc.mMin):'');
  if(e=document.getElementById('sv-gross')) e.textContent=won(pc.gross);
  if(e=document.getElementById('sv-net')) e.textContent=won(pc.net);
  if(e=document.getElementById('sub-net')) e.textContent='공제 '+won(pc.gross-pc.net);
}

/* ---- 모달: 알바 등록 ---- */
function openAddStaff(){
  document.getElementById('as_name').value='';
  document.getElementById('as_mt').checked=false;
  document.getElementById('as_rm_fld').style.display='none';
  document.getElementById('addStaffModal').style.display='flex';
}
document.getElementById('as_mt').addEventListener('change',function(){
  document.getElementById('as_rm_fld').style.display=this.checked?'flex':'none';
});
function addStaff(){
  var name=document.getElementById('as_name').value.trim();
  if(!name){ alert('이름을 입력하세요.'); return; }
  var mt=document.getElementById('as_mt').checked;
  var id='s'+(Date.now());
  DB.staff.push({id, name, has_mentoring:mt, active:true, sort:(DB.staff.length+1)});
  DB.rates.push({
    staff_id:id, ym:document.getElementById('as_ym').value,
    rn:+document.getElementById('as_rn').value,
    rm: mt ? +document.getElementById('as_rm').value : null
  });
  closeModal('addStaffModal');
  renderStaffList(); selectStaff(id);
}

/* ---- 모달: 시급 변경 ---- */
function openAddRate(){
  var s=staffById(SEL);
  document.getElementById('rt_ym').value=CUR;
  var cur=rateFor(SEL,CUR);
  document.getElementById('rt_rn').value=cur?cur.rn:10800;
  document.getElementById('rt_rm').value=cur&&cur.rm?cur.rm:12000;
  document.getElementById('rt_rm_fld').style.display=s.has_mentoring?'flex':'none';
  document.getElementById('addRateModal').style.display='flex';
}
function addRate(){
  var s=staffById(SEL);
  var ym=document.getElementById('rt_ym').value;
  var rn=+document.getElementById('rt_rn').value;
  var rm=s.has_mentoring?+document.getElementById('rt_rm').value:null;
  var ex=DB.rates.find(r=>r.staff_id===SEL && r.ym===ym);
  if(ex){ ex.rn=rn; ex.rm=rm; } else { DB.rates.push({staff_id:SEL, ym, rn, rm}); }
  closeModal('addRateModal');
  renderDetail();
}

function closeModal(id){ document.getElementById(id).style.display='none'; }
[...document.querySelectorAll('.mback')].forEach(m=>{
  m.addEventListener('click',e=>{ if(e.target===m) m.style.display='none'; });
});

/* init */
renderStaffList();
selectStaff('s1');
