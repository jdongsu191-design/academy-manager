<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F3A51">
<title>진도계획서 · 베스티안수학학원</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 학부모용 공개 진도계획서 — 글자 위주, 로그인 없음.
     주소: /plan.html?t=<선생님 id>  (포스터 QR 에 고정)
     달 판정: 1~24일 이번 달, 25일~말일 다음 달. 없으면 있는 달로 내려감.
     화면: 강좌 목록(카드) → 강좌를 누르면 상세(진도표). 강좌마다 색(--c/--cl/--cd)으로 구분. */
  :root{
    --navy:#1F3A51; --ink:#1e293b; --ink-2:#475569; --ink-3:#94a3b8;
    --line:#e2e8f0; --bg:#eef1f5; --card:#fff;
    --warn:#b45309; --warn-bg:#fef3c7; --off:#b91c1c; --off-bg:#fee2e2; --sp:#065f46; --sp-bg:#d1fae5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;word-break:keep-all}
  .wrap{max-width:720px;margin:0 auto;padding:0 0 40px;min-height:100vh}
  header{background:var(--navy);color:#fff;padding:18px 18px 16px}
  header .brand{font-size:12px;letter-spacing:2px;opacity:.75;font-weight:700}
  header h1{font-size:22px;font-weight:800;margin-top:4px;line-height:1.25}
  header .sub{margin-top:6px;font-size:14px;opacity:.9;display:flex;flex-wrap:wrap;gap:4px 12px}
  .months{display:flex;gap:8px;padding:12px 14px 0}
  .months button{flex:1;padding:10px 8px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font-size:15px;font-weight:700;color:var(--ink-2);cursor:pointer}
  .months button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .notice{margin:12px 14px 0;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:14px;font-weight:600;line-height:1.5}
  .hint{padding:14px 16px 2px;font-size:13px;color:var(--ink-3);font-weight:600}

  /* ── 목록 카드 ── */
  .list{display:flex;flex-direction:column;gap:10px;padding:10px 12px 0}
  .item{display:flex;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .item:active{transform:scale(.99)}
  .item .band{flex:none;width:10px;background:var(--c)}
  .item .ib{flex:1;min-width:0;padding:12px 10px 12px 14px;background:linear-gradient(90deg,var(--cl) 0,#fff 55%)}
  .item .nm{font-size:17px;font-weight:800;color:var(--cd);line-height:1.3}
  .item .nm .g{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--c);border-radius:6px;padding:1px 7px;margin-right:7px;vertical-align:2px}
  .item .meta{margin-top:5px;font-size:13.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 12px}
  .item .meta span{white-space:nowrap} .item .meta b{color:var(--ink)}
  .item .arrow{flex:none;display:flex;align-items:center;padding:0 14px 0 4px;color:var(--c);font-size:22px;font-weight:800}

  /* ── 상세 ── */
  .back{display:flex;align-items:center;gap:6px;margin:12px 14px 0;padding:9px 12px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font-size:14px;font-weight:700;color:var(--ink-2);cursor:pointer;width:max-content}
  .detail{margin:12px 12px 0;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  .detail .dh{background:var(--c);color:#fff;padding:14px 16px 12px}
  .detail .dh .g{display:inline-block;font-size:12px;font-weight:800;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:1px 8px;margin-bottom:6px}
  .detail .dh h2{font-size:20px;font-weight:800;line-height:1.3}
  .info{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;padding:12px 16px;font-size:15px;background:var(--cl);border-bottom:1px solid var(--line)}
  .info dt{color:var(--cd);font-weight:800;font-size:13px;padding-top:2px;white-space:nowrap}
  .info dd{font-weight:600}
  .feature{padding:12px 16px;font-size:15px;color:var(--ink-2);border-bottom:1px solid var(--line);white-space:pre-line;line-height:1.6}
  .sec{display:flex;align-items:center;gap:8px;padding:14px 16px 6px;font-size:13.5px;font-weight:800;color:var(--cd)}
  .sec::before{content:'';width:5px;height:14px;border-radius:3px;background:var(--c)}
  table{width:100%;border-collapse:collapse;font-size:15px}
  td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
  td.d{white-space:nowrap;font-weight:800;width:1%;padding-left:14px;padding-right:12px;background:var(--cl);color:var(--cd);border-right:3px solid var(--c)}
  td.d small{display:block;font-size:12px;font-weight:700;color:var(--ink-2)}
  td.d small.sat{color:#1d4ed8} td.d small.sun{color:#dc2626}
  td.c{padding-left:12px;padding-right:14px;white-space:pre-line}
  tr.next td.c{background:#fffbeb}
  tr.next td.d{background:var(--c);color:#fff}
  tr.next td.d small{color:rgba(255,255,255,.85)}
  tr.next td.d::after{content:'다음 수업';display:block;font-size:10.5px;font-weight:700;margin-top:2px;color:#fde68a}
  .tag{display:inline-block;font-size:11.5px;font-weight:800;padding:1px 7px;border-radius:6px;margin-right:6px;vertical-align:1px}
  .tag.H{background:var(--off);color:#fff} .tag.S{background:var(--sp);color:#fff}
  tr.H td{background:var(--off-bg) !important} tr.H td.d{color:var(--off);border-right-color:var(--off)} tr.H td.c{color:var(--off)}
  tr.S td{background:var(--sp-bg) !important} tr.S td.d{color:var(--sp);border-right-color:var(--sp)}
  table.week td.d{border-right-color:var(--ink-3);background:#f1f5f9;color:var(--ink-2)}
  .leg{display:flex;gap:12px;flex-wrap:wrap;padding:10px 16px 14px;font-size:12px;color:var(--ink-3);font-weight:600}
  .leg i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
  .nav{display:flex;gap:8px;margin:12px 12px 0}
  .nav button{flex:1;padding:11px 8px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font-size:14px;font-weight:700;color:var(--ink-2);cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav button:disabled{opacity:.35;cursor:default}
  .empty{padding:40px 18px;text-align:center;color:var(--ink-3);font-size:15px;line-height:1.7}
  .empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
  footer{margin:28px 18px 0;text-align:center;font-size:12px;color:var(--ink-3);line-height:1.8}
  @media (min-width:600px){ .list,.detail,.nav{margin-left:18px;margin-right:18px} .list{padding-left:0;padding-right:0;margin-top:12px} td.c{font-size:16px} }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="brand">BESTIAN · 베스티안수학학원</div>
    <h1 id="h-title">진도계획서</h1>
    <div class="sub" id="h-sub"></div>
  </header>
  <div id="body"><div class="empty">불러오는 중…</div></div>
  <footer>베스티안수학학원 · 문의는 학원으로 연락 주세요<br><span id="ver"></span></footer>
</div>
<script>
  window.PLAN_VERSION = 'v1.1';
  document.getElementById('ver').textContent = 'BMAPS plan ' + window.PLAN_VERSION;
  var db = supabase.createClient('https://qtpftloyumtffvgurvqv.supabase.co', 'sb_publishable_XGP9n-2fuBQFuJlAA5MJ8w_R8JYIi9O');

  /* 강좌 색: [진한색(띠·머리), 연한 바탕, 글자색] — syllabus.html 강좌 팔레트와 같은 순서 */
  var PALETTE = [
    ['#1F3A51', '#e8eef5', '#1F3A51'], ['#7a2e2e', '#f7e9e9', '#6b2626'], ['#3f7d12', '#e9f5df', '#2f5f0d'], ['#0f7f96', '#e0f3f7', '#0b6475'],
    ['#c2410c', '#fdeadf', '#9a3412'], ['#314C97', '#e6eaf7', '#283d7a'], ['#7030A0', '#f0e6f8', '#5b2583'], ['#0f766e', '#dff5f2', '#0b5e58']
  ];
  function colorStyle(i){ var p = PALETTE[i % PALETTE.length]; return 'style="--c:' + p[0] + ';--cl:' + p[1] + ';--cd:' + p[2] + '"'; }

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function periodKey(p){ var m = /(\d{4})\s*년\s*(\d{1,2})\s*월/.exec(p || ''); return m ? m[1] + '-' + pad2(+m[2]) : ''; }   /* '2026년 11월' → '2026-11' */
  function keyLabel(k){ return k ? (+k.slice(0,4)) + '년 ' + (+k.slice(5,7)) + '월' : ''; }
  function addMonth(k, n){ var y = +k.slice(0,4), m = +k.slice(5,7) - 1 + n; return (y + Math.floor(m / 12)) + '-' + pad2((m % 12 + 12) % 12 + 1); }

  /* 오늘(로컬). ?d=YYYY-MM-DD 로 날짜를 가짜로 넣어 시험할 수 있다. */
  function today(){
    var q = new URLSearchParams(location.search).get('d');
    return q && /^\d{4}-\d{2}-\d{2}$/.test(q) ? new Date(q + 'T00:00:00') : new Date();
  }
  /* 보여줄 달: 1~24일 이번 달, 25일~ 다음 달. 그 달이 없으면 있는 달 중 가장 가까운 과거 → 그래도 없으면 가장 이른 미래 */
  function pickMonth(keys, d){
    var cur = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
    var want = d.getDate() >= 25 ? addMonth(cur, 1) : cur;
    if(keys.indexOf(want) >= 0) return { key: want, want: want };
    var past = keys.filter(function(k){ return k < want; });
    if(past.length) return { key: past[past.length - 1], want: want };
    return { key: keys[0] || '', want: want };
  }

  var _rows = {}, _keys = [], _teacher = '', _today = today(), _cur = { key: '', want: '', courses: [] };

  async function load(){
    var tid = new URLSearchParams(location.search).get('t') || '';
    if(!/^[0-9a-f-]{36}$/i.test(tid)){ show('<div class="empty"><b>잘못된 주소입니다</b>포스터의 QR 코드를 다시 인식해 주세요.</div>'); return; }
    var r = await db.rpc('plan_public', { p_teacher: tid });
    if(r.error){ show('<div class="empty"><b>불러오지 못했습니다</b>잠시 후 다시 시도해 주세요.<br><small>' + esc(r.error.message) + '</small></div>'); return; }
    (r.data || []).forEach(function(row){ var k = periodKey(row.period); if(k) _rows[k] = row; });
    _keys = Object.keys(_rows).sort();
    if(!_keys.length){ show('<div class="empty"><b>등록된 진도계획서가 없습니다</b>담당 선생님이 변경되었거나 아직 작성 전입니다.<br>학원으로 문의해 주세요.</div>'); return; }
    _teacher = (_rows[_keys[_keys.length - 1]].teacher_name) || '';
    var pick = pickMonth(_keys, _today);
    setMonth(pick.key, pick.want);
    /* 폰 뒤로가기: 상세 → 목록 */
    window.addEventListener('popstate', function(){ var i = (history.state && history.state.c != null) ? history.state.c : null; i == null ? renderList() : renderDetail(i, true); });
  }

  function show(html){ document.getElementById('body').innerHTML = html; window.scrollTo(0, 0); }

  function setMonth(key, want){
    var row = _rows[key];
    _cur = { key: key, want: want, courses: (row.courses || []).filter(function(c){ return c && ((c.sched || []).some(function(s){ return s && (s[0] || s[2]); }) || c.course); }) };
    document.getElementById('h-title').textContent = keyLabel(key) + ' 진도계획서';
    document.getElementById('h-sub').innerHTML = '<span>👩‍🏫 ' + esc(_teacher) + ' 선생님</span>' + (row.updated_at ? '<span>수정 ' + esc(String(row.updated_at).slice(0, 10).replace(/-/g, '.')) + '</span>' : '');
    history.replaceState({ c: null }, '');
    renderList();
  }

  /* 머리: 이번 달/다음 달 칩(둘 다 있을 때만) + 준비 중 안내 */
  function topBar(){
    var h = '';
    var cur = _today.getFullYear() + '-' + pad2(_today.getMonth() + 1), nxt = addMonth(cur, 1);
    var tabs = [cur, nxt].filter(function(k){ return _rows[k]; });
    if(tabs.length === 2){
      h += '<div class="months">' + tabs.map(function(k){ return '<button type="button" class="' + (k === _cur.key ? 'on' : '') + '" onclick="setMonth(\'' + k + '\',\'' + k + '\')">' + keyLabel(k) + (k === cur ? ' (이번 달)' : ' (다음 달)') + '</button>'; }).join('') + '</div>';
    }
    if(_cur.want && _cur.want !== _cur.key) h += '<div class="notice">' + keyLabel(_cur.want) + ' 진도계획서는 준비 중입니다. ' + keyLabel(_cur.key) + ' 계획서를 보여드립니다.</div>';
    return h;
  }

  /* ── 목록: 강좌 카드 ── */
  function renderList(){
    var cs = _cur.courses, h = topBar();
    if(!cs.length){ show(h + '<div class="empty"><b>작성된 강좌가 없습니다</b></div>'); return; }
    h += '<div class="hint">강좌를 누르면 진도 계획이 열립니다</div><div class="list">';
    h += cs.map(function(c, i){
      var n = (c.sched || []).filter(function(s){ return s && (s[0] || s[2]) && (s[3] || '') !== 'H'; }).length;
      var meta = [];
      if(c.time) meta.push('<span>⏰ <b>' + esc(c.time) + '</b></span>');
      if(c.bookMain || c.bookSub) meta.push('<span>📘 ' + esc([c.bookMain, c.bookSub].filter(Boolean).join(' · ')) + '</span>');
      meta.push('<span>📅 수업 <b>' + n + '</b>회</span>');
      return '<a class="item" ' + colorStyle(i) + ' href="#c' + i + '" onclick="openDetail(' + i + ');return false"><div class="band"></div><div class="ib">'
        + '<div class="nm">' + (c.grade ? '<span class="g">' + esc(c.grade) + '</span>' : '') + esc(c.course || ('강좌 ' + (i + 1))) + '</div>'
        + '<div class="meta">' + meta.join('') + '</div></div><div class="arrow">›</div></a>';
    }).join('');
    show(h + '</div>');
  }

  function openDetail(i){ history.pushState({ c: i }, '', '#c' + i); renderDetail(i); }
  function goList(){ if(history.state && history.state.c != null) history.back(); else renderList(); }
  function moveTo(i){ history.replaceState({ c: i }, '', '#c' + i); renderDetail(i); }

  /* ── 상세: 강좌 하나의 진도표 ── */
  function renderDetail(i){
    var c = _cur.courses[i]; if(!c){ renderList(); return; }
    var key = _cur.key, n = _cur.courses.length;
    var h = '<button type="button" class="back" onclick="goList()">‹ 강좌 목록</button>';
    h += '<section class="detail" ' + colorStyle(i) + '>';
    h += '<div class="dh">' + (c.grade ? '<span class="g">' + esc(c.grade) + '</span>' : '') + '<h2>' + esc(c.course || ('강좌 ' + (i + 1))) + '</h2></div>';
    var info = [];
    if(c.time) info.push(['수업 시간', c.time]);
    if(c.bookMain || c.bookSub) info.push(['교재', [c.bookMain, c.bookSub].filter(Boolean).join(' · ')]);
    if(c.najeTime) info.push([c.najeLabel || 'N제 시간', c.najeTime]);
    if(c.mockTime) info.push([c.mockLabel || '모의고사 시간', c.mockTime]);
    if(info.length) h += '<dl class="info">' + info.map(function(p){ return '<dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd>'; }).join('') + '</dl>';
    if(c.feature) h += '<div class="feature">' + esc(c.feature) + '</div>';
    var sched = schedRows(c.sched, key, true);
    if(sched) h += '<div class="sec">' + esc(keyLabel(key)) + ' 진도 계획</div>' + sched;
    var week = (c.week || []).filter(function(w){ return w && (w[0] || w[1]); });
    if(week.length) h += '<div class="sec">주말 · 특강</div><table class="week"><tbody>' + week.map(function(w){ return '<tr><td class="d">' + esc(w[0] || '') + '</td><td class="c">' + esc(w[1] || '') + '</td></tr>'; }).join('') + '</tbody></table>';
    if(c.page2 && c.page2.on){
      var s2 = schedRows(c.page2.sched2, periodKey(c.page2.period2) || addMonth(key, 1), false);
      if(s2) h += '<div class="sec">' + esc(c.page2.period2 || '다음 달') + ' 미리보기</div>' + s2;
    }
    h += '<div class="leg"><span><i style="background:#fffbeb;border:1px solid #fcd34d"></i>다음 수업</span><span><i style="background:var(--sp)"></i>특별</span><span><i style="background:var(--off)"></i>휴강</span></div>';
    h += '</section>';
    if(n > 1){
      var prev = _cur.courses[i - 1], next = _cur.courses[i + 1];
      h += '<div class="nav"><button type="button" onclick="moveTo(' + (i - 1) + ')"' + (prev ? '' : ' disabled') + '>‹ ' + esc(prev ? prev.course : '') + '</button>'
        + '<button type="button" onclick="moveTo(' + (i + 1) + ')"' + (next ? '' : ' disabled') + '>' + esc(next ? next.course : '') + ' ›</button></div>';
    }
    show(h);
  }

  /* 진도표 행: [날짜, 요일, 내용, 구분('' | 'S' 특별 | 'H' 휴강)] */
  function schedRows(rows, key, markNext){
    rows = (rows || []).filter(function(s){ return s && (s[0] || s[2]); });
    if(!rows.length) return '';
    var nextIdx = -1, y = +key.slice(0,4), m = +key.slice(5,7);
    if(markNext){
      var t0 = new Date(_today.getFullYear(), _today.getMonth(), _today.getDate());
      for(var i = 0; i < rows.length; i++){
        var dm = /(\d{1,2})\s*[\/.]\s*(\d{1,2})/.exec(rows[i][0] || '');
        if(!dm) continue;
        var dt = new Date(y + (+dm[1] < m ? 1 : 0), +dm[1] - 1, +dm[2]);
        if(dt >= t0 && (rows[i][3] || '') !== 'H'){ nextIdx = i; break; }
      }
    }
    return '<table><tbody>' + rows.map(function(s, i){
      var flag = s[3] || '', wd = String(s[1] || '').trim();
      var tag = flag === 'H' ? '<span class="tag H">휴강</span>' : flag === 'S' ? '<span class="tag S">특별</span>' : '';
      var wcls = wd.charAt(0) === '토' ? ' class="sat"' : wd.charAt(0) === '일' ? ' class="sun"' : '';
      return '<tr class="' + (i === nextIdx ? 'next ' : '') + esc(flag) + '"><td class="d">' + esc(s[0] || '') + (wd ? '<small' + wcls + '>' + esc(wd) + '</small>' : '') + '</td><td class="c">' + tag + esc(s[2] || '') + '</td></tr>';
    }).join('') + '</tbody></table>';
  }

  load();
</script>
</body>
</html>
